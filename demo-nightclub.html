<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Club Malam Popup</title><style>body{margin:0;font-family:Outfit,sans-serif;background:linear-gradient(160deg,#120c1a,#1a1028 40%,#0a1620);color:#f4f7ff;min-height:100vh}main{max-width:720px;margin:0 auto;padding:28px 18px 80px}h1{margin:0 0 10px}p{color:#c9c2d8;line-height:1.6}</style></head><body><main><h1>Demo Club Malam Popup</h1><p>Nuansa nightclub: spotlight, strobe, neon, equalizer. Tutup modal → FX laser/spark tetap soft.</p></main>
<!--
  DROP-IN: Popup CLUB MALAM (neon / spotlight / strobe)
  Overlay gelap transparan · tutup = modal hilang, lampu club tetap soft
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Syne:wght@700;800&display=swap');

  #club-root {
    --ink: #07060c;
    --neon: #3dfff0;
    --hot: #ff3d7f;
    --gold: #ffd166;
    --lime: #b8ff4a;
    --foam: #f4f7ff;
    --sub: #c9c2d8;
    font-family: "Outfit", "Syne", sans-serif;
  }
  #club-root.is-closed #popup-overlay {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  #club-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(255,61,127,.18), transparent 50%),
      radial-gradient(ellipse 70% 45% at 85% 20%, rgba(61,255,240,.14), transparent 52%),
      radial-gradient(ellipse 90% 60% at 50% 100%, rgba(255,209,102,.1), transparent 55%),
      rgba(4, 3, 10, .42);
    backdrop-filter: blur(2px) saturate(1.25);
    opacity: 0; visibility: hidden;
    animation: club-in .45s ease .35s forwards;
    overflow: hidden;
  }
  #club-root #popup-overlay.is-closed {
    display: none !important; animation: none !important;
  }
  @keyframes club-in { to { opacity: 1; visibility: visible; } }

  /* Spotlights behind modal */
  #club-root .spot {
    position: absolute; width: 42vw; height: 90vh; top: -10vh;
    pointer-events: none; filter: blur(18px); opacity: .45;
    mix-blend-mode: screen;
  }
  #club-root .spot.s1 {
    left: 8%;
    background: linear-gradient(180deg, rgba(61,255,240,.55), transparent 70%);
    transform-origin: top center;
    animation: club-spot1 4.5s ease-in-out infinite;
  }
  #club-root .spot.s2 {
    right: 6%; left: auto;
    background: linear-gradient(180deg, rgba(255,61,127,.5), transparent 70%);
    transform-origin: top center;
    animation: club-spot2 5.2s ease-in-out infinite .4s;
  }
  #club-root .spot.s3 {
    left: 38%;
    background: linear-gradient(180deg, rgba(255,209,102,.4), transparent 68%);
    transform-origin: top center;
    animation: club-spot3 3.8s ease-in-out infinite .2s;
  }
  @keyframes club-spot1 {
    0%,100% { transform: rotate(-18deg) skewX(-6deg); opacity: .35; }
    50% { transform: rotate(12deg) skewX(4deg); opacity: .65; }
  }
  @keyframes club-spot2 {
    0%,100% { transform: rotate(16deg) skewX(5deg); opacity: .3; }
    50% { transform: rotate(-14deg) skewX(-6deg); opacity: .7; }
  }
  @keyframes club-spot3 {
    0%,100% { transform: rotate(-4deg) scaleX(.85); opacity: .25; }
    50% { transform: rotate(6deg) scaleX(1.15); opacity: .55; }
  }

  #club-root .strobe {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 40%, rgba(244,247,255,.22), transparent 42%);
    opacity: 0; animation: club-strobe 2.8s ease-in-out infinite;
  }
  @keyframes club-strobe {
    0%,72%,78%,86%,100% { opacity: 0; }
    74% { opacity: .55; }
    76% { opacity: .08; }
    80% { opacity: .35; }
    82% { opacity: 0; }
  }

  #club-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }

  #club-root .popup-box {
    position: relative; z-index: 2; width: min(400px, 93vw);
    padding: 18px 18px 16px;
    border-radius: 22px;
    text-align: center;
    background:
      radial-gradient(circle at 50% -10%, rgba(61,255,240,.16), transparent 42%),
      radial-gradient(circle at 100% 100%, rgba(255,61,127,.14), transparent 40%),
      linear-gradient(165deg, #14101f 0%, #0a0812 55%, #120c1a 100%);
    border: 1.5px solid rgba(61,255,240,.45);
    box-shadow:
      0 0 0 1px rgba(255,61,127,.18) inset,
      0 0 40px rgba(61,255,240,.22),
      0 0 70px rgba(255,61,127,.12),
      0 24px 50px rgba(0,0,0,.55);
    overflow: hidden;
    animation:
      club-pop .7s cubic-bezier(.2,1.35,.3,1) .35s backwards,
      club-bass 1.1s ease-in-out 1.1s infinite;
  }
  #club-root .popup-box::before {
    content: ""; position: absolute; inset: -2px; z-index: 0; pointer-events: none;
    border-radius: 24px;
    background: conic-gradient(from 0deg, #3dfff0, #ff3d7f, #ffd166, #3dfff0, #ff3d7f);
    opacity: .35; filter: blur(16px);
    animation: club-spin 4s linear infinite;
  }
  #club-root .popup-box::after {
    content: ""; position: absolute; inset: 2px; z-index: 0; pointer-events: none;
    border-radius: 20px;
    background:
      linear-gradient(180deg, rgba(244,247,255,.06), transparent 28%),
      rgba(8,6,14,.94);
  }
  @keyframes club-spin { to { transform: rotate(360deg); } }
  @keyframes club-pop {
    0% { transform: scale(.4) translateY(40px); opacity: 0; filter: blur(8px); }
    70% { transform: scale(1.04) translateY(-4px); filter: blur(0); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes club-bass {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.012); }
  }
  #club-root .popup-box > * { position: relative; z-index: 1; }

  #club-root .eq {
    position: absolute; left: 14px; right: 14px; bottom: 10px; height: 28px;
    display: flex; align-items: flex-end; justify-content: center; gap: 3px;
    pointer-events: none; opacity: .55; z-index: 2;
  }
  #club-root .eq i {
    display: block; width: 4px; border-radius: 2px;
    background: linear-gradient(180deg, var(--neon), var(--hot));
    animation: club-eq 0.55s ease-in-out infinite;
  }
  #club-root .eq i:nth-child(odd) { animation-duration: .4s; background: linear-gradient(180deg, var(--gold), var(--hot)); }
  #club-root .eq i:nth-child(3n) { animation-duration: .7s; }
  @keyframes club-eq {
    0%,100% { height: 6px; opacity: .5; }
    50% { height: 26px; opacity: 1; }
  }

  #club-root .popup-close {
    position: absolute; top: -14px; right: -14px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid var(--foam);
    background: radial-gradient(circle at 35% 30%, #ffd166, #ff3d7f 55%, #3a1030);
    color: #fff; font-size: 22px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(255,61,127,.85), 0 0 12px rgba(61,255,240,.45);
    z-index: 30; padding: 0; line-height: 1;
    animation: club-btn 1s ease-in-out infinite;
  }
  @keyframes club-btn {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1) rotate(-8deg); }
  }
  #club-root .popup-close:hover { transform: scale(1.15) rotate(90deg); animation: none; }

  #club-root .popup-img-wrap {
    position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1;
    border: 2px solid rgba(61,255,240,.4);
    box-shadow: 0 0 28px rgba(255,61,127,.25), 0 0 20px rgba(61,255,240,.2);
  }
  #club-root .popup-img-wrap::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(180deg, transparent 40%, rgba(7,6,12,.7)),
      radial-gradient(circle at 30% 20%, rgba(61,255,240,.18), transparent 40%);
  }
  #club-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: -30%; z-index: 2; pointer-events: none;
    background: linear-gradient(115deg, transparent 40%, rgba(255,209,102,.35) 48%, transparent 56%);
    animation: club-shine 2.2s ease-in-out infinite;
  }
  @keyframes club-shine {
    0%,100% { transform: translateX(-35%) skewX(-14deg); opacity: 0; }
    40% { opacity: 1; }
    70% { transform: translateX(35%) skewX(-14deg); opacity: 0; }
  }
  #club-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }

  #club-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 3;
    font-family: "Syne", sans-serif;
    font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    color: #07060c;
    background: linear-gradient(90deg, #3dfff0, #ffd166, #ff3d7f);
    padding: 7px 12px; border-radius: 999px;
    box-shadow: 0 0 18px rgba(61,255,240,.5);
    animation: club-badge .85s ease-in-out infinite;
  }
  @keyframes club-badge {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3px) scale(1.05); }
  }

  #club-root .popup-title {
    margin: 14px 0 4px;
    font-family: "Syne", sans-serif;
    font-size: 26px; font-weight: 800; letter-spacing: 1px;
    color: var(--foam);
    text-shadow:
      0 0 16px rgba(61,255,240,.85),
      0 0 28px rgba(255,61,127,.4);
    animation: club-title 1.2s ease-in-out infinite;
  }
  @keyframes club-title {
    0%,100% { letter-spacing: 1px; filter: brightness(1); }
    50% { letter-spacing: 2.2px; filter: brightness(1.25); }
  }
  #club-root .popup-sub {
    margin: 0 0 14px; font-size: 13px; color: var(--sub); line-height: 1.45;
  }

  #club-root .popup-buttons { display: flex; gap: 10px; margin-bottom: 8px; }
  #club-root .popup-btn {
    flex: 1; padding: 14px 0; border-radius: 999px;
    font-size: 14px; font-weight: 800; letter-spacing: 1.5px;
    text-decoration: none; text-align: center; text-transform: uppercase;
    transition: transform .15s;
  }
  #club-root .popup-btn:hover { transform: translateY(-3px) scale(1.03); }
  #club-root .btn-login {
    background: transparent; color: var(--neon);
    border: 2px solid var(--neon);
    box-shadow: 0 0 16px rgba(61,255,240,.35);
  }
  #club-root .btn-daftar {
    color: #07060c; border: none;
    background: linear-gradient(135deg, #3dfff0, #ffd166 45%, #ff3d7f);
    box-shadow: 0 0 28px rgba(255,61,127,.45);
    animation: club-cta .9s ease-in-out infinite;
  }
  @keyframes club-cta {
    0%,100% { box-shadow: 0 0 14px rgba(61,255,240,.4); transform: scale(1); }
    50% { box-shadow: 0 0 32px rgba(255,61,127,.75), 0 0 18px #ffd166; transform: scale(1.04); }
  }

  #club-root .popup-footer {
    font-size: 11px; color: #9a92b0; line-height: 1.5; padding-bottom: 18px;
  }
  #club-root .popup-footer b {
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255,209,102,.55);
  }

  /* FX layer — laser / sparkles di halaman */
  #club-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important; background: transparent !important;
  }
  #club-root .laser {
    position: absolute; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--c, #3dfff0), transparent);
    box-shadow: 0 0 12px var(--c, #3dfff0);
    animation: club-laser .55s ease-out forwards;
    opacity: .85;
  }
  @keyframes club-laser {
    0% { transform: scaleX(.1) rotate(var(--ang)); opacity: 0; }
    30% { opacity: .95; }
    100% { transform: scaleX(1.3) rotate(var(--ang)) translateX(var(--len)); opacity: 0; }
  }
  #club-root .spark {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px var(--c, #ffd166);
    animation: club-spark .7s ease-out forwards;
  }
  @keyframes club-spark {
    0% { transform: translate(0,0) scale(.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
</style>

<div id="club-root">
  <div id="popup-overlay">
    <div class="spot s1"></div>
    <div class="spot s2"></div>
    <div class="spot s3"></div>
    <div class="strobe"></div>
    <button type="button" class="popup-backdrop" id="club-close-bg" aria-label="Tutup"></button>
    <div class="popup-box">
      <button type="button" class="popup-close" id="club-close-btn" aria-label="Tutup">✕</button>
      <div class="popup-img-wrap">
        <img class="popup-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEjA0X8bAuStiu0kj906_JUJqMUWXo19KNH9B3PqLGQixo70sDDwxKLQWIskOhmCok-T4UPI4OLUMXVmfQG1G0GXr_pPfJKBaZq8YBAL70EIP_cwRdU2uDspQ0bNr-Rcr5K7BI1qOn_CqJgJTtSxWU04XUDJF8yGOtAzlpdkQvO7Z12gtTjt8dfuMpa6rTMC=w642-h642" alt="Promo">
        <span class="popup-badge">Club Night</span>
      </div>
      <div class="popup-title">BONUS MEMBER BARU!</div>
      <p class="popup-sub">Masuk ke lantai dansa — klaim bonus deposit pertamamu</p>
      <div class="popup-buttons">
        <a class="popup-btn btn-login" href="https://al-amwal-staimasi-masasih.pages.dev/">LOGIN</a>
        <a class="popup-btn btn-daftar" href="https://al-amwal-staimasi-masasih.pages.dev/">DAFTAR</a>
      </div>
      <div class="popup-footer">
        <b>Slot Depo 5K</b> · Metode QRIS<br>
        <span>© 2026 Club Night Promo</span>
      </div>
      <div class="eq" aria-hidden="true">
        <i style="animation-delay:0s"></i><i style="animation-delay:.05s"></i>
        <i style="animation-delay:.1s"></i><i style="animation-delay:.15s"></i>
        <i style="animation-delay:.2s"></i><i style="animation-delay:.08s"></i>
        <i style="animation-delay:.18s"></i><i style="animation-delay:.03s"></i>
        <i style="animation-delay:.12s"></i><i style="animation-delay:.22s"></i>
        <i style="animation-delay:.07s"></i><i style="animation-delay:.16s"></i>
      </div>
    </div>
  </div>
  <div id="fx"></div>
</div>

<script>
(function () {
  var root = document.getElementById("club-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = root.querySelector("#fx");
  var timers = [];
  var closed = false;
  var COLORS = ["#3dfff0", "#ff3d7f", "#ffd166", "#b8ff4a", "#ffffff"];

  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (closed) return;
    closed = true;
    root.classList.add("is-closed");
    if (overlay) {
      overlay.classList.add("is-closed");
      overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
    }
    /* laser/spark tetap jalan soft di halaman */
  }

  var b1 = document.getElementById("club-close-btn");
  var b2 = document.getElementById("club-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePopup(e);
  });

  function laser() {
    if (!fx) return;
    var el = document.createElement("div");
    el.className = "laser";
    var c = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.style.setProperty("--c", c);
    el.style.setProperty("--ang", (Math.random() * 50 - 25) + "deg");
    el.style.setProperty("--len", (40 + Math.random() * 80) + "px");
    el.style.left = (8 + Math.random() * 84) + "vw";
    el.style.top = (10 + Math.random() * 75) + "vh";
    el.style.width = (90 + Math.random() * 160) + "px";
    fx.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 600);
  }

  function spark() {
    if (!fx) return;
    var el = document.createElement("div");
    el.className = "spark";
    var c = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.style.setProperty("--c", c);
    el.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    el.style.setProperty("--dy", (-30 - Math.random() * 70) + "px");
    el.style.left = (5 + Math.random() * 90) + "vw";
    el.style.top = (15 + Math.random() * 70) + "vh";
    fx.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 750);
  }

  for (var i = 0; i < 12; i++) setTimeout(function () { laser(); spark(); spark(); }, i * 60);
  timers.push(setInterval(function () { laser(); laser(); }, 140));
  timers.push(setInterval(function () { spark(); spark(); spark(); }, 90));
})();
</script>

</body></html>
