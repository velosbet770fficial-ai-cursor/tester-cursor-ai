<style>

  /* Felt table backdrop */

  #rl-root .popup-img-wrap {

  }

  #rl-root .popup-buttons { display: flex; gap: 10px; }
  #rl-root .popup-btn {
    flex: 1; padding: 14px 0; border-radius: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: 1.5px;

    transition: transform .15s;
  }
  #rl-root .popup-btn:hover { transform: translateY(-3px) scale(1.03); }
  #rl-root .btn-login {

  #rl-root .btn-daftar {

  @keyframes rl-cta {
    0%,100% { transform: scale(1); box-shadow: 0 0 16px rgba(240,199,94,.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 34px rgba(240,199,94,.85), 0 0 16px #e11d48; }

  #rl-root .popup-footer {
    margin-top: 10px; font-size: 11px; color: #9dc4b4; font-weight: 600; line-height: 1.45;
  }
  #rl-root .popup-footer b { color: #f0c75e; text-shadow: 0 0 10px rgba(240,199,94,.6); }

  /* FX chips + sparks */
  #rl-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;

  }
  #rl-root .chip {
    position: absolute; width: 28px; height: 28px; border-radius: 50%;
    border: 3px dashed rgba(255,255,255,.75);

  #rl-root .chip.red { background: radial-gradient(circle at 30% 30%, #ff6b8a, #e11d48 55%, #8b102e); }
  #rl-root .chip.black { background: radial-gradient(circle at 30% 30%, #444, #121212 55%, #000); }
  #rl-root .chip.gold { background: radial-gradient(circle at 30% 30%, #fff6e0, #f0c75e 50%, #8a6a14); }
  #rl-root .chip.green { background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a 55%, #065f32); }
  @keyframes rl-chip {
    0% { transform: translate3d(0,0,0) rotate(0) scale(.5); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--spin)) scale(var(--sc)); opacity: 0; }
  }
  #rl-root .coin {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 30% 28%, #fff8c0, #f0c75e 45%, #8a6a14);
    box-shadow: 0 0 12px rgba(240,199,94,.95);

  #rl-root .spark {
    position: absolute; width: 4px; height: 14px; border-radius: 2px;
    background: linear-gradient(180deg, #fff6e0, transparent);
    box-shadow: 0 0 10px #f0c75e;

  @keyframes rl-spark {
    0% { transform: translate(0,0) scaleY(.3); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scaleY(1.2); opacity: 0; }

</style>

<div id="rl-root">
  <div id="popup-overlay">
    <div class="felt"></div>

<script>
(function () {
  var root = document.getElementById("rl-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = root.querySelector("#fx");
  var timers = [];
  var closed = false;
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  var CHIP = ["red", "black", "gold", "green"];

  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });

  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (closed) return;
    closed = true;
    root.classList.add("is-closed");
    if (overlay) {
      overlay.classList.add("is-closed");
      overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
    }
  }

  var b1 = document.getElementById("rl-close-btn");
  var b2 = document.getElementById("rl-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePopup(e); });

  function chip() {
    if (!fx) return;
    var el = document.createElement("div");
    var kind = Math.random() > 0.35 ? "chip " + CHIP[Math.floor(Math.random() * CHIP.length)] : "coin";
    el.className = kind;
    var fromLeft = Math.random() > 0.5;
    var x = fromLeft ? -40 : W + 10;
    var y = H * (0.15 + Math.random() * 0.7);
    var dx = (fromLeft ? 1 : -1) * (120 + Math.random() * W * 0.55);
    var dy = (Math.random() * 200 - 100);
    var dur = 1.8 + Math.random() * 1.6;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.setProperty("--dx", dx + "px");
    el.style.setProperty("--dy", dy + "px");
    el.style.setProperty("--spin", (Math.random() * 720 - 360) + "deg");
    el.style.setProperty("--sc", String(0.7 + Math.random() * 1.1));
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, dur * 1000 + 40);
  }

  function spark() {
    if (!fx) return;
    var el = document.createElement("div");
    el.className = "spark";
    el.style.left = (10 + Math.random() * 80) + "vw";
    el.style.top = (10 + Math.random() * 75) + "vh";
    el.style.setProperty("--sx", (Math.random() * 40 - 20) + "px");
    el.style.setProperty("--sy", (-30 - Math.random() * 60) + "px");
    el.style.transform = "rotate(" + (Math.random() * 40 - 20) + "deg)";
    fx.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 600);
  }

  function burst() {
    for (var i = 0; i < 10; i++) chip();
    for (var s = 0; s < 8; s++) spark();
  }

  for (var i = 0; i < 18; i++) setTimeout(chip, i * 40);
  setTimeout(burst, 250);
  timers.push(setInterval(function () { chip(); chip(); chip(); chip(); }, 70));
  timers.push(setInterval(function () { spark(); spark(); spark(); }, 100));
  timers.push(setInterval(burst, 1200));
})();
</script>
