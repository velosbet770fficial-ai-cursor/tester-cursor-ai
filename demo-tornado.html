<!--
  DROP-IN: Popup + TORNADO (puting beliung keren) — bisa ditutup
  Overlay TRANSPARAN · saat tutup, SEMUA FX dihentikan & dihapus
-->
<style>
  #tornado-root {
    --bg: rgba(10, 16, 28, 0.94);
    --wind: #8ad4ff;
    --core: #f2f8ff;
    --gold: #ffe566;
    --dust: #c9a66b;
    --sub: #c5d8ea;
    font-family: Arial, Helvetica, sans-serif;
  }
  #tornado-root.is-closed #popup-overlay,
  #tornado-root.is-closed #fx {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #tornado-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(4, 10, 20, .22);
    backdrop-filter: blur(1.5px);
    opacity: 0; visibility: hidden;
    animation: tn-in .4s ease .6s forwards;
  }
  #tornado-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes tn-in { to { opacity: 1; visibility: visible; } }
  #tornado-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #tornado-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 18px; text-align: center;
    background: linear-gradient(165deg, #16324a 0%, #081220 55%, #132838 100%);
    border: 2px solid rgba(138, 212, 255, .8);
    box-shadow:
      0 0 0 1px rgba(255,229,102,.18) inset,
      0 0 50px rgba(138,212,255,.4),
      0 20px 55px rgba(0,0,0,.45);
    overflow: visible;
    animation: tn-pop .65s cubic-bezier(.22,1.35,.36,1) .6s backwards, tn-shake 2.6s ease-in-out 1.4s infinite;
  }
  #tornado-root .popup-box::before {
    content: ""; position: absolute; inset: -5px; border-radius: 22px; z-index: 0; pointer-events: none;
    background: conic-gradient(from 0deg, #8ad4ff, #ffe566, #7ef0c8, #8ad4ff, #ffe566);
    opacity: .5; filter: blur(14px);
    animation: tn-spin 2.2s linear infinite;
  }
  #tornado-root .popup-box::after {
    content: ""; position: absolute; inset: 2px; border-radius: 16px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 0%, rgba(138,212,255,.22), transparent 48%),
      var(--bg);
  }
  @keyframes tn-spin { to { transform: rotate(360deg); } }
  @keyframes tn-pop {
    0% { transform: scale(.35) rotate(-14deg); opacity: 0; }
    70% { transform: scale(1.07) rotate(3deg); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes tn-shake {
    0%,100% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(-3px,2px) rotate(-0.8deg); }
    50% { transform: translate(3px,-2px) rotate(0.7deg); }
    75% { transform: translate(-2px,-1px) rotate(-0.5deg); }
  }
  #tornado-root .popup-box > * { position: relative; z-index: 1; }
  #tornado-root .wind {
    position: absolute; inset: 0; border-radius: 18px; pointer-events: none; z-index: 4; opacity: .4;
    background: repeating-linear-gradient(110deg, transparent, transparent 7px, rgba(138,212,255,.1) 7px, rgba(138,212,255,.1) 9px);
    animation: tn-wind .8s linear infinite;
  }
  @keyframes tn-wind { to { background-position: 48px 24px; } }
  #tornado-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 50px; height: 50px;
    border-radius: 50%; border: 2px solid #f2f8ff;
    background: linear-gradient(145deg, #8ad4ff, #245a8c);
    color: #041018; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 26px rgba(138,212,255,.9); z-index: 30; padding: 0;
    animation: tn-btn .9s ease-in-out infinite;
  }
  @keyframes tn-btn {
    0%,100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.1) rotate(10deg); }
  }
  #tornado-root .popup-close:hover { transform: scale(1.15) rotate(90deg); animation: none; }
  #tornado-root .popup-img-wrap {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
    border: 2px solid rgba(138,212,255,.6);
    box-shadow: 0 0 28px rgba(138,212,255,.35);
  }
  #tornado-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(138,212,255,.16), transparent 30%, rgba(8,16,28,.55));
  }
  #tornado-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #tornado-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .14em; text-transform: uppercase;
    color: #0a1420; background: linear-gradient(90deg, #f2f8ff, #8ad4ff, #ffe566);
    padding: 6px 12px; border-radius: 8px;
    animation: tn-badge .75s ease-in-out infinite;
  }
  @keyframes tn-badge {
    0%,100% { transform: scale(1) rotate(-3deg); }
    50% { transform: scale(1.08) rotate(3deg); }
  }
  #tornado-root .popup-title {
    margin: 16px 0 6px; font-size: 28px; font-weight: bold; letter-spacing: 1px;
    color: #f2f8ff;
    text-shadow: 0 0 20px rgba(138,212,255,.9), 0 0 36px rgba(255,229,102,.4);
    animation: tn-title 1s ease-in-out infinite;
  }
  @keyframes tn-title {
    0%,100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.04); filter: brightness(1.2); }
  }
  #tornado-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #tornado-root .popup-buttons { display: flex; gap: 10px; }
  #tornado-root .popup-btn {
    flex: 1; padding: 14px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #tornado-root .popup-btn:hover { transform: translateY(-3px) scale(1.03); }
  #tornado-root .btn-login {
    background: #081220; color: #8ad4ff; border: 2px solid #8ad4ff;
    box-shadow: 0 0 14px rgba(138,212,255,.35);
  }
  #tornado-root .btn-daftar {
    background: linear-gradient(145deg, #f2f8ff, #8ad4ff); color: #081220; border: none;
    box-shadow: 0 0 26px rgba(138,212,255,.6); animation: tn-cta .85s ease-in-out infinite;
  }
  @keyframes tn-cta {
    0%,100% { box-shadow: 0 0 14px rgba(138,212,255,.45); transform: scale(1); }
    50% { box-shadow: 0 0 36px rgba(138,212,255,.95), 0 0 20px #ffe566; transform: scale(1.04); }
  }

  #tornado-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background: transparent !important;
  }
  #tornado-root #fx.is-closed {
    display: none !important; visibility: hidden !important;
  }

  /* Funnel layers */
  #tornado-root .funnel {
    position: absolute; left: 50%; bottom: -5vh;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    pointer-events: none;
  }
  #tornado-root .funnel.core {
    width: 6vw; height: 92vh;
    background: linear-gradient(180deg,
      rgba(242,248,255,.35),
      rgba(138,212,255,.28) 35%,
      rgba(201,166,107,.2) 70%,
      transparent);
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
    filter: blur(3px); opacity: .75;
    animation: tn-funnel 1.4s ease-in-out infinite;
  }
  #tornado-root .funnel.mid {
    width: 14vw; height: 95vh;
    background: linear-gradient(180deg,
      rgba(138,212,255,.18),
      rgba(138,212,255,.22) 40%,
      rgba(201,166,107,.15) 75%,
      transparent);
    clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
    filter: blur(10px); opacity: .55;
    animation: tn-funnel 1.8s ease-in-out infinite .2s;
  }
  #tornado-root .funnel.outer {
    width: 26vw; height: 98vh;
    background: linear-gradient(180deg,
      rgba(138,212,255,.08),
      rgba(138,212,255,.14) 45%,
      rgba(201,166,107,.1) 80%,
      transparent);
    clip-path: polygon(32% 0, 68% 0, 100% 100%, 0 100%);
    filter: blur(18px); opacity: .4;
    animation: tn-funnel 2.2s ease-in-out infinite .4s;
  }
  @keyframes tn-funnel {
    0%,100% { transform: translateX(-50%) skewX(-6deg) scaleX(1); }
    50% { transform: translateX(-47%) skewX(7deg) scaleX(1.08); }
  }

  #tornado-root .ring {
    position: absolute; left: 50%; bottom: 2vh;
    border: 2px solid rgba(138,212,255,.35);
    border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 20px rgba(138,212,255,.25);
    animation: tn-ring 1.6s ease-out infinite;
  }
  #tornado-root .ring.r2 { animation-delay: .5s; border-color: rgba(255,229,102,.3); }
  #tornado-root .ring.r3 { animation-delay: 1s; border-color: rgba(126,240,200,.28); }
  @keyframes tn-ring {
    0% { width: 40px; height: 14px; opacity: .8; }
    100% { width: 280px; height: 70px; opacity: 0; }
  }

  #tornado-root .flash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 55%, rgba(242,248,255,.28), transparent 45%);
    opacity: 0; animation: tn-flash 3.2s ease-in-out infinite;
  }
  @keyframes tn-flash {
    0%,78%,86%,100% { opacity: 0; }
    81% { opacity: .55; }
    83% { opacity: .1; }
    84.5% { opacity: .4; }
  }

  #tornado-root .debris {
    position: absolute; left: 50%; bottom: 4vh;
    will-change: transform, opacity;
    animation: tn-orbit linear forwards;
  }
  #tornado-root .debris.coin {
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 30% 28%, #fff8b0, #ffe566 42%, #b8860b);
    box-shadow: 0 0 12px rgba(255,229,102,.95), inset 0 0 4px rgba(255,255,255,.5);
  }
  #tornado-root .debris.chip {
    width: 14px; height: 9px; border-radius: 3px;
    box-shadow: 0 0 10px rgba(138,212,255,.8);
  }
  #tornado-root .debris.gem {
    width: 12px; height: 12px;
    background: linear-gradient(135deg, #7ef0c8, #2a9f8a);
    transform: rotate(45deg);
    box-shadow: 0 0 12px rgba(126,240,200,.85);
  }
  #tornado-root .debris.card {
    width: 12px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, #fff, #c8e4ff);
    box-shadow: 0 0 8px rgba(255,255,255,.6);
    border: 1px solid rgba(138,212,255,.5);
  }
  #tornado-root .debris.bolt {
    width: 3px; height: 18px; border-radius: 1px;
    background: linear-gradient(180deg, #fff, #8ad4ff, transparent);
    box-shadow: 0 0 10px #8ad4ff;
  }
  #tornado-root .debris.star {
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 12px solid #ffe566;
    filter: drop-shadow(0 0 8px #ffe566);
  }
  #tornado-root .debris.spark {
    width: 6px; height: 6px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px 3px rgba(138,212,255,1);
  }
  #tornado-root .debris.leaf {
    width: 11px; height: 18px; border-radius: 60% 0 60% 0;
    background: linear-gradient(135deg, #9fe09f, #2f7a3a);
    box-shadow: 0 0 8px rgba(80,160,80,.55);
  }

  /* Spiral naik: radius membesar + putar cepat */
  @keyframes tn-orbit {
    0% {
      transform:
        translate3d(-50%, 0, 0)
        rotate(var(--a0))
        translateX(var(--r0))
        rotate(calc(var(--a0) * -1 + var(--tilt)))
        scale(.35);
      opacity: 0;
    }
    8% { opacity: 1; }
    70% { opacity: .95; }
    100% {
      transform:
        translate3d(-50%, var(--up), 0)
        rotate(var(--a1))
        translateX(var(--r1))
        rotate(calc(var(--a1) * -1 + var(--tilt) + 360deg))
        scale(var(--sc));
      opacity: 0;
    }
  }

  #tornado-root .gust {
    position: absolute; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(242,248,255,.85), transparent);
    animation: tn-gust .45s ease-out forwards;
    filter: blur(.4px);
  }
  @keyframes tn-gust {
    0% { transform: scaleX(.15) rotate(var(--ang)); opacity: 0; }
    25% { opacity: .9; }
    100% { transform: scaleX(1.2) rotate(var(--ang)) translateX(var(--len)); opacity: 0; }
  }

  #tornado-root .dust {
    position: absolute; left: 50%; bottom: 0; width: 55vw; height: 16vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 100%, rgba(201,166,107,.45), rgba(138,212,255,.12) 45%, transparent 70%);
    filter: blur(8px);
    animation: tn-dust 1.2s ease-in-out infinite;
  }
  @keyframes tn-dust {
    0%,100% { opacity: .4; transform: translateX(-50%) scaleX(.9); }
    50% { opacity: .85; transform: translateX(-50%) scaleX(1.35); }
  }
</style>

<div id="tornado-root">
  <div id="popup-overlay">
    <button type="button" class="popup-backdrop" id="tn-close-bg" aria-label="Tutup"></button>
    <div class="popup-box">
      <div class="wind"></div>
      <button type="button" class="popup-close" id="tn-close-btn" aria-label="Tutup">✕</button>
      <div class="popup-img-wrap">
        <img class="popup-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEitTh4uT5bosKFSq2k1EuGGy454eYrtFxO416gMJNJi8tIBM9VjWORLeUM7s3VGQoFd16VPLWQ_5Ga_qbruYPNnKvuO_nH4JJLny7-qgtnLn9-RrPsVjxP46uqtNaPhlPuWt29CYTExGVSVYGwq5N7GdhovXZYB2uhOyi1Vt816Dwcinl4sNrXYFd-HscXC=w616-h616" alt="Promo">
        <span class="popup-badge">Tornado Deal</span>
      </div>
      <div class="popup-title">BONUS MEMBER BARU!</div>
      <p class="popup-sub">Daftar sekarang &amp; klaim bonus deposit pertamamu</p>
      <div class="popup-buttons">
        <a class="popup-btn btn-login" href="https://sflink.ink/velosbet77brand">LOGIN</a>
        <a class="popup-btn btn-daftar" href="https://sflink.my/velosbet77cuan">DAFTAR</a>
      </div>
    </div>
  </div>
  <div id="fx">
    <div class="flash"></div>
    <div class="funnel outer"></div>
    <div class="funnel mid"></div>
    <div class="funnel core"></div>
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="dust"></div>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById("tornado-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = root.querySelector("#fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  var timers = [];
  var closed = false;

  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });

  function stopAll() {
    closed = true;
    for (var i = 0; i < timers.length; i++) clearInterval(timers[i]);
    timers = [];
    if (fx) {
      /* hapus debris/gust dinamis, sisakan struktur dasar lalu hide */
      var kill = fx.querySelectorAll(".debris, .gust");
      for (var k = 0; k < kill.length; k++) kill[k].remove();
      fx.classList.add("is-closed");
      fx.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
    }
  }

  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    stopAll();
    root.classList.add("is-closed");
    if (overlay) {
      overlay.classList.add("is-closed");
      overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
    }
  }

  var b1 = document.getElementById("tn-close-btn");
  var b2 = document.getElementById("tn-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var KINDS = ["coin", "chip", "gem", "card", "bolt", "star", "spark", "leaf"];
  var CHIP_COLORS = [
    "linear-gradient(135deg,#8ad4ff,#245a8c)",
    "linear-gradient(135deg,#ffe566,#c98a10)",
    "linear-gradient(135deg,#ff6b9d,#a01848)",
    "linear-gradient(135deg,#7ef0c8,#1a7a5a)"
  ];

  function debris() {
    if (closed || !fx) return;
    var el = document.createElement("div");
    var kind = KINDS[Math.floor(Math.random() * KINDS.length)];
    el.className = "debris " + kind;

    /* spiral: sempit di bawah, melebar ke atas */
    var r0 = (8 + Math.random() * 28) * (W / 1000);
    var r1 = (90 + Math.random() * 220) * (W / 1000);
    var up = -(0.55 + Math.random() * 0.4) * H;
    var turns = 2.2 + Math.random() * 2.5;
    var dir = Math.random() > 0.35 ? 1 : -1;
    var a0 = Math.random() * 360;
    var a1 = a0 + turns * 360 * dir;
    var sc = 0.55 + Math.random() * 1.25;
    var dur = 1.35 + Math.random() * 1.35;
    var tilt = (Math.random() * 80 - 40);

    el.style.setProperty("--r0", r0 + "px");
    el.style.setProperty("--r1", r1 + "px");
    el.style.setProperty("--up", up + "px");
    el.style.setProperty("--a0", a0 + "deg");
    el.style.setProperty("--a1", a1 + "deg");
    el.style.setProperty("--sc", String(sc));
    el.style.setProperty("--tilt", tilt + "deg");
    el.style.animationDuration = dur + "s";
    el.style.left = (49 + Math.random() * 2) + "%";

    if (kind === "chip") el.style.background = CHIP_COLORS[Math.floor(Math.random() * CHIP_COLORS.length)];
    if (kind === "gem" && Math.random() > 0.5) {
      el.style.background = "linear-gradient(135deg,#8ad4ff,#3a6fd0)";
    }

    fx.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, dur * 1000 + 60);
  }

  function gust() {
    if (closed || !fx) return;
    var el = document.createElement("div");
    el.className = "gust";
    el.style.left = (20 + Math.random() * 60) + "vw";
    el.style.top = (8 + Math.random() * 75) + "vh";
    el.style.width = (70 + Math.random() * 120) + "px";
    el.style.setProperty("--ang", (Math.random() * 70 - 35) + "deg");
    el.style.setProperty("--len", (30 + Math.random() * 60) + "px");
    fx.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 480);
  }

  function burst() {
    if (closed) return;
    for (var i = 0; i < 10; i++) debris();
  }

  /* spawn awal + loop — lebih padat */
  for (var i = 0; i < 36; i++) setTimeout(debris, i * 28);
  timers.push(setInterval(function () {
    debris(); debris(); debris(); debris(); debris(); debris(); debris();
  }, 55));
  timers.push(setInterval(function () { gust(); gust(); gust(); }, 120));
  timers.push(setInterval(burst, 900));
})();
</script>
