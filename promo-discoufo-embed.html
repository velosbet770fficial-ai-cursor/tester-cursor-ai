<style>
  #ufo-root {
    --bg: rgba(4, 0, 24, 0.96);
    --neon: #39ff14;
    --pink: #ff2bd6;
    --blue: #00e5ff;
    --sub: #c8b8ff;
    font-family: Arial Black, Impact, Arial, sans-serif;
  }
  #ufo-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(4, 0, 20, .72); backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden;
    animation: uf-in .4s ease .7s forwards;
  }
  #ufo-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes uf-in { to { opacity: 1; visibility: visible; } }
  #ufo-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #ufo-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 50% 50% 18px 18px / 18% 18% 18px 18px;
    text-align: center;
    background: linear-gradient(180deg, #1a0840 0%, #080218 55%, #120830 100%);
    border: 3px solid #39ff14;
    box-shadow:
      0 0 0 4px rgba(255,43,214,.35),
      0 0 50px rgba(57,255,20,.5),
      0 0 100px rgba(0,229,255,.3),
      0 30px 80px rgba(0,0,0,.85);
    overflow: visible;
    animation: uf-pop .75s cubic-bezier(.2,1.4,.3,1) .7s backwards, uf-hover 2s ease-in-out 1.5s infinite;
  }
  #ufo-root .popup-box::before {
    content: ""; position: absolute; inset: -6px; border-radius: inherit; z-index: 0; pointer-events: none;
    background: conic-gradient(from 0deg, #39ff14, #ff2bd6, #00e5ff, #ffe600, #39ff14);
    opacity: .5; filter: blur(12px);
    animation: uf-spin 1.8s linear infinite;
  }
  #ufo-root .popup-box::after {
    content: ""; position: absolute; inset: 3px; border-radius: inherit; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(57,255,20,.25), transparent 45%),
      radial-gradient(ellipse at 50% 100%, rgba(255,43,214,.2), transparent 40%),
      var(--bg);
  }
  @keyframes uf-spin { to { transform: rotate(360deg); } }
  @keyframes uf-pop {
    0% { transform: translateY(-80px) scale(.3) rotate(20deg); opacity: 0; }
    70% { transform: translateY(10px) scale(1.08) rotate(-3deg); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes uf-hover {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  #ufo-root .popup-box > * { position: relative; z-index: 1; }
  #ufo-root .beam {
    position: absolute; left: 50%; bottom: -40%; width: 70%; height: 80%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(57,255,20,.35), transparent);
    clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
    pointer-events: none; z-index: 0; opacity: .5;
    animation: uf-beam 1.2s ease-in-out infinite;
    filter: blur(4px);
  }
  @keyframes uf-beam {
    0%,100% { opacity: .3; }
    50% { opacity: .7; }
  }
  #ufo-root .popup-close {
    position: absolute; top: -14px; right: -10px; width: 50px; height: 50px;
    border-radius: 50%; border: 3px solid #39ff14;
    background: linear-gradient(145deg, #ff2bd6, #4a0080);
    color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 28px #ff2bd6; z-index: 30; padding: 0;
    animation: uf-btn .9s ease-in-out infinite;
  }
  @keyframes uf-btn {
    0%,100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.1) rotate(15deg); }
  }
  #ufo-root .popup-close:hover { transform: scale(1.2) rotate(90deg); animation: none; }
  #ufo-root .popup-img-wrap {
    position: relative; border-radius: 50%; overflow: hidden; aspect-ratio: 1/1;
    border: 3px solid #00e5ff;
    box-shadow: 0 0 30px rgba(57,255,20,.5), inset 0 0 30px rgba(255,43,214,.25);
    margin-top: 8px;
  }
  #ufo-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(57,255,20,.2), transparent 35%, rgba(40,0,60,.55));
    animation: uf-scanline 1.5s linear infinite;
  }
  @keyframes uf-scanline {
    0% { background-position: 0 0; opacity: .6; }
    100% { opacity: 1; }
  }
  #ufo-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #ufo-root .popup-badge {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .16em; text-transform: uppercase;
    color: #0a0020; background: linear-gradient(90deg, #39ff14, #00e5ff, #ff2bd6);
    padding: 6px 14px; border-radius: 20px;
    box-shadow: 0 0 18px #39ff14; white-space: nowrap;
    animation: uf-badge .7s ease-in-out infinite;
  }
  @keyframes uf-badge {
    0%,100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.08); }
  }
  #ufo-root .popup-title {
    margin: 16px 0 6px; font-size: 26px; font-weight: bold; letter-spacing: 1px;
    color: #39ff14;
    text-shadow: 0 0 16px #39ff14, 0 0 32px #ff2bd6, 2px 2px 0 #00e5ff;
    animation: uf-title .8s ease-in-out infinite;
  }
  @keyframes uf-title {
    0%,100% { transform: scale(1); filter: hue-rotate(0deg); }
    50% { transform: scale(1.05); filter: hue-rotate(40deg); }
  }
  #ufo-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); font-family: Arial, sans-serif; }
  #ufo-root .popup-buttons { display: flex; gap: 10px; }
  #ufo-root .popup-btn {
    flex: 1; padding: 14px 0; border-radius: 999px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
    font-family: Arial, sans-serif;
  }
  #ufo-root .popup-btn:hover { transform: translateY(-3px) scale(1.05); }
  #ufo-root .btn-login {
    background: #0a0020; color: #00e5ff; border: 2px solid #00e5ff;
    box-shadow: 0 0 16px rgba(0,229,255,.45);
  }
  #ufo-root .btn-daftar {
    background: linear-gradient(145deg, #39ff14, #ff2bd6); color: #0a0020; border: none;
    box-shadow: 0 0 28px rgba(57,255,20,.7); animation: uf-cta .9s ease-in-out infinite;
  }
  @keyframes uf-cta {
    0%,100% { box-shadow: 0 0 16px rgba(57,255,20,.5); transform: scale(1); }
    50% { box-shadow: 0 0 40px #ff2bd6, 0 0 20px #39ff14; transform: scale(1.04); }
  }

  #ufo-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(57,255,20,.15), transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(255,43,214,.2), transparent 35%),
      radial-gradient(circle at 80% 60%, rgba(0,229,255,.15), transparent 40%),
      #040016;
  }
  #ufo-root .saucer {
    position: absolute; width: 56px; height: 22px;
    animation: uf-saucer linear forwards;
  }
  #ufo-root .saucer::before {
    content: ""; position: absolute; left: 14px; top: -8px; width: 28px; height: 16px;
    border-radius: 50%; background: radial-gradient(circle at 50% 60%, #00e5ff, #7b00ff);
    box-shadow: 0 0 14px #00e5ff;
  }
  #ufo-root .saucer::after {
    content: ""; position: absolute; left: 0; top: 4px; width: 56px; height: 14px;
    border-radius: 50%; background: linear-gradient(90deg, #39ff14, #ff2bd6, #00e5ff);
    box-shadow: 0 0 16px #39ff14;
  }
  @keyframes uf-saucer {
    0% { transform: translateX(0) translateY(0) rotate(-5deg); opacity: 0; }
    10% { opacity: 1; }
    50% { transform: translateX(var(--mid)) translateY(var(--bob)) rotate(5deg); }
    100% { transform: translateX(var(--end)) translateY(var(--bob2)) rotate(-8deg); opacity: 0; }
  }
  #ufo-root .laser {
    position: absolute; width: 4px;
    background: linear-gradient(180deg, #39ff14, transparent);
    box-shadow: 0 0 14px #39ff14, 0 0 28px #ff2bd6;
    transform-origin: top center;
    animation: uf-laser .5s ease-out forwards;
  }
  @keyframes uf-laser {
    0% { height: 0; opacity: 1; }
    100% { height: var(--len); opacity: 0; }
  }
  #ufo-root .duck {
    position: absolute; font-size: 28px; line-height: 1;
    filter: drop-shadow(0 0 8px #ffe600);
    animation: uf-duck linear forwards;
  }
  @keyframes uf-duck {
    0% { transform: translateY(0) rotate(0) scale(1); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(720deg) scale(1.4); opacity: 0; }
  }
  #ufo-root .orb {
    position: absolute; border-radius: 50%;
    box-shadow: 0 0 20px currentColor;
    animation: uf-orb linear forwards;
  }
  @keyframes uf-orb {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #ufo-root .ring {
    position: absolute; border-radius: 50%; border: 2px solid #39ff14;
    box-shadow: 0 0 20px #ff2bd6; animation: uf-ring .6s ease-out forwards;
  }
  @keyframes uf-ring {
    0% { transform: scale(.1); opacity: 1; }
    100% { transform: scale(4); opacity: 0; }
  }
  #ufo-root .disco {
    position: absolute; width: 14px; height: 14px;
    background: conic-gradient(#39ff14, #ff2bd6, #00e5ff, #ffe600, #39ff14);
    border-radius: 50%; box-shadow: 0 0 12px #fff;
    animation: uf-disco linear forwards;
  }
  @keyframes uf-disco {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(1080deg) translateX(var(--drift)); opacity: .3; }
  }
  #ufo-root .cow {
    position: absolute; font-size: 22px;
    filter: drop-shadow(0 0 6px #fff);
    animation: uf-cow linear forwards;
  }
  @keyframes uf-cow {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-50vh) rotate(180deg) scale(.5); opacity: 0; }
  }
  #ufo-root .strobe {
    position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,.35), transparent 60%);
    opacity: 0; animation: uf-strobe 2.2s ease-in-out infinite;
  }
  @keyframes uf-strobe {
    0%,85%,100% { opacity: 0; }
    88% { opacity: .5; }
    92% { opacity: 0; }
    95% { opacity: .35; }
  }
</style>

<div id="ufo-root">
  <div id="popup-overlay">

<script>
(function () {
  var root = document.getElementById("ufo-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("uf-close-btn");
  var b2 = document.getElementById("uf-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var COLORS = ["#39ff14","#ff2bd6","#00e5ff","#ffe600","#ff6600","#ffffff"];
  var DUCKS = ["🦆","🛸","👽","🐄","🪩","✨","🍌","👁️"];

  function saucer() {
    var el = document.createElement("div");
    el.className = "saucer";
    var fromLeft = Math.random() > 0.5;
    el.style.top = Math.random() * 55 + 5 + "vh";
    el.style.left = fromLeft ? "-10vw" : "110vw";
    el.style.setProperty("--mid", (fromLeft ? 1 : -1) * (Math.random() * 40 + 40) + "vw");
    el.style.setProperty("--end", (fromLeft ? 1 : -1) * (Math.random() * 60 + 90) + "vw");
    el.style.setProperty("--bob", (Math.random() * 40 - 20) + "px");
    el.style.setProperty("--bob2", (Math.random() * 60 - 30) + "px");
    var scale = 0.7 + Math.random() * 1.2;
    el.style.width = (56 * scale) + "px";
    el.style.height = (22 * scale) + "px";
    var dur = Math.random() * 2.5 + 2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () {
      var rect = el.getBoundingClientRect();
      laser(rect.left + rect.width / 2, rect.top + rect.height);
      el.remove();
    }, dur * 1000);
  }

  function laser(x, y) {
    var el = document.createElement("div");
    el.className = "laser";
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.setProperty("--len", (Math.random() * H * 0.4 + H * 0.2) + "px");
    el.style.background = "linear-gradient(180deg," + COLORS[Math.floor(Math.random()*COLORS.length)] + ", transparent)";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, 520);
    boom(x, y + 80 + Math.random() * 100);
  }

  function boom(x, y) {
    for (var i = 0; i < 24; i++) {
      var o = document.createElement("div");
      o.className = "orb";
      var ang = (Math.PI * 2 * i) / 24;
      var dist = Math.random() * 120 + 20;
      var s = Math.random() * 10 + 4;
      o.style.width = s + "px"; o.style.height = s + "px";
      o.style.left = x + "px"; o.style.top = y + "px";
      o.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
      o.style.color = o.style.background;
      o.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      o.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * .55 + .4;
      o.style.animationDuration = dur + "s";
      fx.appendChild(o);
      setTimeout(function (el) { el.remove(); }.bind(null, o), dur * 1000);
    }
    var r = document.createElement("div");
    r.className = "ring";
    r.style.width = "40px"; r.style.height = "40px";
    r.style.left = (x - 20) + "px"; r.style.top = (y - 20) + "px";
    r.style.borderColor = COLORS[Math.floor(Math.random()*COLORS.length)];
    fx.appendChild(r);
    setTimeout(function () { r.remove(); }, 620);
  }

  function duck() {
    var el = document.createElement("div");
    el.className = "duck";
    el.textContent = DUCKS[Math.floor(Math.random() * DUCKS.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.bottom = "-5vh";
    el.style.fontSize = (Math.random() * 24 + 18) + "px";
    var dur = Math.random() * 2.5 + 2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function cow() {
    var el = document.createElement("div");
    el.className = "cow";
    el.textContent = Math.random() > 0.5 ? "🐄" : "🛸";
    el.style.left = Math.random() * 90 + 5 + "vw";
    el.style.top = Math.random() * 40 + 30 + "vh";
    var dur = Math.random() * 1.5 + 1.2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function disco() {
    var el = document.createElement("div");
    el.className = "disco";
    el.style.left = Math.random() * 100 + "vw";
    el.style.top = "-3vh";
    el.style.setProperty("--drift", (Math.random() * 100 - 50) + "px");
    var dur = Math.random() * 2 + 1.5;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  setInterval(function () { saucer(); saucer(); }, 600);
  setInterval(function () { duck(); duck(); duck(); }, 200);
  setInterval(function () { disco(); disco(); disco(); disco(); }, 80);
  setInterval(cow, 900);
  setInterval(function () {
    boom(Math.random()*W*0.8+W*0.1, Math.random()*H*0.5+H*0.2);
  }, 800);
  saucer(); saucer(); duck(); duck();
})();
</script>
