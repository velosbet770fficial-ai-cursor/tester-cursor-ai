<style>

    --pink: #ff4081;
    --sub: #ffd0d8;
    font-family: Arial, Helvetica, sans-serif;
  }
  #fw-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(8, 0, 4, .75); backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden;
    animation: fw-in .4s ease .8s forwards;
  }
  #fw-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes fw-in { to { opacity: 1; visibility: visible; } }
  #fw-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #fw-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 18px; text-align: center;
    background: linear-gradient(165deg, #3a0a18 0%, #120408 55%, #2a0810 100%);
    border: 2px solid rgba(255, 215, 0, .85);
    box-shadow:
      0 0 0 1px rgba(255,23,68,.25) inset,
      0 0 50px rgba(255,215,0,.45),
      0 0 100px rgba(255,23,68,.3),
      0 25px 70px rgba(0,0,0,.75);
    overflow: visible;
    animation: fw-pop .65s cubic-bezier(.22,1.3,.36,1) .8s backwards, fw-pulse 1.2s ease-in-out 1.5s infinite;
  }
  #fw-root .popup-box::before {
    content: ""; position: absolute; inset: -4px; border-radius: 22px; z-index: 0; pointer-events: none;
    background: conic-gradient(from 0deg, #ffd700, #ff1744, #ff4081, #ffd700, #ff1744, #ffd700);
    opacity: .6; filter: blur(12px);
    animation: fw-spin 2s linear infinite;
  }
  #fw-root .popup-box::after {
    content: ""; position: absolute; inset: 2px; border-radius: 16px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,215,0,.2), transparent 45%),
      var(--bg);
  }
  @keyframes fw-spin { to { transform: rotate(360deg); } }
  @keyframes fw-pop {
    0% { transform: scale(.5) rotate(-8deg); opacity: 0; }
    70% { transform: scale(1.08) rotate(2deg); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes fw-pulse {
    0%,100% { box-shadow: 0 0 40px rgba(255,215,0,.4), 0 0 80px rgba(255,23,68,.25), 0 25px 70px rgba(0,0,0,.75); }
    50% { box-shadow: 0 0 70px rgba(255,215,0,.85), 0 0 120px rgba(255,23,68,.55), 0 25px 70px rgba(0,0,0,.75); }
  }
  #fw-root .popup-box > * { position: relative; z-index: 1; }
  #fw-root .flash {
    position: absolute; inset: 0; border-radius: 18px; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, rgba(255,255,200,.5), transparent 60%);
    opacity: 0; animation: fw-flash 2s ease-in-out infinite;
  }
  @keyframes fw-flash {
    0%,80%,100% { opacity: 0; }
    85% { opacity: .7; }
    90% { opacity: 0; }
    93% { opacity: .5; }
  }
  #fw-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 50px; height: 50px;
    border-radius: 50%; border: 2px solid #ffd700;
    background: linear-gradient(145deg, #ff1744, #8b0000);
    color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 28px rgba(255,215,0,.9); z-index: 30; padding: 0;
    transition: transform .2s; animation: fw-btn 1s ease-in-out infinite;
  }
  @keyframes fw-btn {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #fw-root .popup-close:hover { transform: scale(1.15) rotate(90deg); animation: none; }
  #fw-root .popup-img-wrap {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
    border: 2px solid rgba(255,215,0,.6);
    box-shadow: 0 0 30px rgba(255,23,68,.4);
  }
  #fw-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,215,0,.15), transparent 30%, rgba(40,0,10,.55));
  }
  #fw-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #fw-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .14em; text-transform: uppercase;
    color: #2a0a00; background: linear-gradient(90deg, #fff7a0, #ffd700, #ff1744);
    padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 18px rgba(255,215,0,.7);
    animation: fw-badge .8s ease-in-out infinite;
  }
  @keyframes fw-badge {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  #fw-root .popup-title {
    margin: 16px 0 6px; font-size: 28px; font-weight: bold; letter-spacing: 1px;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255,215,0,.9), 0 0 40px rgba(255,23,68,.6), 0 2px 0 #5a1800;
    animation: fw-title 1s ease-in-out infinite;
  }
  @keyframes fw-title {
    0%,100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.04); filter: brightness(1.3); }
  }
  #fw-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #fw-root .popup-buttons { display: flex; gap: 10px; }
  #fw-root .popup-btn {
    flex: 1; padding: 14px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #fw-root .popup-btn:hover { transform: translateY(-3px) scale(1.03); }
  #fw-root .btn-login {
    background: #1a0808; color: #ffd700; border: 2px solid #ffd700;
    box-shadow: 0 0 16px rgba(255,215,0,.4);
  }
  #fw-root .btn-daftar {
    background: linear-gradient(145deg, #ffd700, #ff1744); color: #1a0500; border: none;
    box-shadow: 0 0 28px rgba(255,215,0,.7); animation: fw-cta .9s ease-in-out infinite;
  }
  @keyframes fw-cta {
    0%,100% { box-shadow: 0 0 16px rgba(255,215,0,.5); transform: scale(1); }
    50% { box-shadow: 0 0 40px rgba(255,23,68,.9), 0 0 30px #ffd700; transform: scale(1.03); }
  }

  #fw-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background: radial-gradient(ellipse at 50% 100%, rgba(80,0,20,.5), #050208 70%);
  }
  #fw-root .rocket {
    position: absolute; bottom: -5vh; width: 4px; height: 18px;
    background: linear-gradient(to top, #ff1744, #ffd700, #fff);
    border-radius: 2px; box-shadow: 0 0 10px #ffd700;
    animation: fw-rocket linear forwards;
  }
  @keyframes fw-rocket {
    0% { transform: translateY(0) scaleY(1); opacity: 1; }
    100% { transform: translateY(var(--up)) scaleY(.4); opacity: .3; }
  }
  #fw-root .spark {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    box-shadow: 0 0 10px 2px currentColor;
    animation: fw-spark linear forwards;
  }
  @keyframes fw-spark {
    0% { transform: translate(0,0) scale(1.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #fw-root .trail {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 8px #ffd700;
    animation: fw-trail linear forwards;
  }
  @keyframes fw-trail {
    0% { transform: translate(0,0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
  }
  #fw-root .ring {
    position: absolute; border-radius: 50%; border: 2px solid #ffd700;
    box-shadow: 0 0 20px #ff1744; animation: fw-ring .7s ease-out forwards;
  }
  @keyframes fw-ring {
    0% { transform: scale(.1); opacity: 1; }
    100% { transform: scale(3.5); opacity: 0; }
  }
  #fw-root .confetti {
    position: absolute; top: -5vh; width: 8px; height: 12px;
    animation: fw-conf linear forwards;
  }
  @keyframes fw-conf {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) translateX(var(--drift)); opacity: .4; }
  }
</style>

</div>

<script>
(function () {
  var root = document.getElementById("fw-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("fw-close-btn");
  var b2 = document.getElementById("fw-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var COLORS = ["#ffd700","#ff1744","#ff4081","#ffea00","#ff6d00","#ffffff","#ff80ab","#ffab00"];

  function boom(x, y, big) {
    var n = big ? 56 : 36;
    var c = COLORS[Math.floor(Math.random() * COLORS.length)];
    for (var i = 0; i < n; i++) {
      var s = document.createElement("div");
      s.className = "spark";
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.2;
      var dist = (big ? 180 : 110) * (0.5 + Math.random());
      var col = i % 3 === 0 ? COLORS[Math.floor(Math.random()*COLORS.length)] : c;
      s.style.background = col; s.style.color = col;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.7 + 0.55;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
    for (var t = 0; t < 12; t++) {
      var tr = document.createElement("div");
      tr.className = "trail";
      var a2 = Math.random() * Math.PI * 2;
      var d2 = Math.random() * 80 + 20;
      tr.style.left = x + "px"; tr.style.top = y + "px";
      tr.style.setProperty("--dx", Math.cos(a2) * d2 + "px");
      tr.style.setProperty("--dy", Math.sin(a2) * d2 + "px");
      tr.style.background = c;
      var td = Math.random() * 0.5 + 0.4;
      tr.style.animationDuration = td + "s";
      fx.appendChild(tr);
      setTimeout(function (el) { el.remove(); }.bind(null, tr), td * 1000);
    }
    var r = document.createElement("div");
    r.className = "ring";
    var rs = big ? 80 : 50;
    r.style.width = rs + "px"; r.style.height = rs + "px";
    r.style.left = (x - rs/2) + "px"; r.style.top = (y - rs/2) + "px";
    r.style.borderColor = c;
    fx.appendChild(r);
    setTimeout(function () { r.remove(); }, 750);
  }

  function launch() {
    var el = document.createElement("div");
    el.className = "rocket";
    var x = Math.random() * W * 0.85 + W * 0.075;
    el.style.left = x + "px";
    var up = -(Math.random() * H * 0.45 + H * 0.35);
    el.style.setProperty("--up", up + "px");
    var dur = Math.random() * 0.5 + 0.55;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () {
      el.remove();
      boom(x, H + up, Math.random() > 0.4);
    }, dur * 1000);
  }

  function confetti() {
    var el = document.createElement("div");
    el.className = "confetti";
    el.style.left = Math.random() * 100 + "vw";
    el.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
    el.style.setProperty("--drift", (Math.random() * 100 - 50) + "px");
    var dur = Math.random() * 2 + 2;
    el.style.animationDuration = dur + "s";
    if (Math.random() > 0.5) el.style.borderRadius = "50%";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  setInterval(function () { launch(); launch(); launch(); }, 280);
  setInterval(function () { confetti(); confetti(); confetti(); confetti(); }, 80);
  boom(W*0.3, H*0.35, true);
  boom(W*0.7, H*0.4, true);
  setTimeout(function () { boom(W/2, H*0.3, true); }, 400);
  setInterval(function () {
    boom(Math.random()*W*0.8+W*0.1, Math.random()*H*0.45+H*0.15, true);
  }, 900);
})();
</script>
