<!--
  DROP-IN: Popup HUTAN / FOREST — pohon, kunang-kunang, daun, kabut
  Overlay transparan · tutup = modal hilang, FX hutan TETAP HIDUP
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Source+Sans+3:wght@600;700;800&display=swap');

  #ft-root {
    --moss: #1f6b3a;
    --deep: #0a1f12;
    --leaf: #3d9b5c;
    --lime: #8fd96a;
    --amber: #e8b84a;
    --bark: #2a1810;
    --mist: rgba(180, 220, 190, .12);
    --cream: #f3f7e8;
    --ink: #0d1f14;
    font-family: "Source Sans 3", system-ui, sans-serif;
  }

  #ft-root.is-closed #popup-overlay {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  #ft-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
    background:
      radial-gradient(ellipse 75% 55% at 50% 100%, rgba(20,90,45,.4), transparent 55%),
      radial-gradient(ellipse 50% 40% at 20% 15%, rgba(143,217,106,.1), transparent 50%),
      radial-gradient(ellipse 45% 35% at 85% 20%, rgba(232,184,74,.08), transparent 45%),
      rgba(6, 18, 10, .32);
    backdrop-filter: blur(1.5px);
    opacity: 0; visibility: hidden;
    animation: ft-in .4s ease .3s forwards;
    overflow: hidden;
  }
  #ft-root #popup-overlay.is-closed { display: none !important; animation: none !important; }
  @keyframes ft-in { to { opacity: 1; visibility: visible; } }

  #ft-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; padding: 0; margin: 0;
    background: transparent; cursor: pointer; z-index: 1;
  }

  /* ===== FX layer (outside overlay — keeps running after close) ===== */
  #ft-root #fx {
    position: fixed; inset: 0; z-index: 2147483646;
    pointer-events: none; overflow: hidden;
  }

  #ft-root .canopy {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 90% 40% at 50% -5%, rgba(8,40,20,.75), transparent 60%),
      radial-gradient(ellipse 40% 50% at 0% 40%, rgba(10,35,18,.55), transparent 55%),
      radial-gradient(ellipse 40% 50% at 100% 45%, rgba(10,35,18,.55), transparent 55%);
  }

  /* Tree silhouettes */
  #ft-root .tree {
    position: absolute; bottom: 0;
    width: 0; height: 0;
    border-left: solid transparent;
    border-right: solid transparent;
    border-bottom-style: solid;
    filter: drop-shadow(0 0 12px rgba(61,155,92,.25));
    animation: ft-sway 6s ease-in-out infinite;
  }
  #ft-root .tree::after {
    content: "";
    position: absolute; left: 50%; bottom: -8px;
    width: 8px; height: 28px; margin-left: -4px;
    background: linear-gradient(180deg, #3a2214, #1a0e08);
  }
  @keyframes ft-sway {
    0%,100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.8deg); }
  }

  /* Ground mist */
  #ft-root .fog {
    position: absolute; left: -10%; right: -10%; bottom: 0; height: 38%;
    background:
      radial-gradient(ellipse 60% 80% at 30% 100%, rgba(180,220,190,.22), transparent 70%),
      radial-gradient(ellipse 50% 70% at 70% 100%, rgba(140,200,160,.18), transparent 70%);
    animation: ft-fog 8s ease-in-out infinite;
    filter: blur(8px);
  }
  @keyframes ft-fog {
    0%,100% { transform: translateX(-3%) scaleY(1); opacity: .7; }
    50% { transform: translateX(4%) scaleY(1.08); opacity: 1; }
  }

  /* Fireflies */
  #ft-root .firefly {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: #e8ff9a;
    box-shadow: 0 0 10px #c8ff4a, 0 0 22px rgba(200,255,74,.7);
    animation: ft-fly 5s ease-in-out infinite;
  }
  @keyframes ft-fly {
    0%,100% { opacity: .2; transform: translate(0,0) scale(.6); }
    25% { opacity: 1; transform: translate(18px, -22px) scale(1.2); }
    50% { opacity: .4; transform: translate(-12px, -40px) scale(.8); }
    75% { opacity: 1; transform: translate(22px, -18px) scale(1.1); }
  }

  /* Falling leaves */
  #ft-root .leaf {
    position: absolute; width: 14px; height: 14px;
    background: linear-gradient(135deg, #3d9b5c, #8fd96a 50%, #e8b84a);
    border-radius: 2px 70% 2px 70%;
    animation: ft-leaf linear infinite;
    box-shadow: 0 0 8px rgba(143,217,106,.35);
  }
  #ft-root .leaf.amber {
    background: linear-gradient(135deg, #c45c26, #e8b84a 55%, #8fd96a);
  }
  @keyframes ft-leaf {
    0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
    8% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) translateX(40px); opacity: .15; }
  }

  /* Soft spores / pollen */
  #ft-root .spore {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: rgba(232,184,74,.7);
    box-shadow: 0 0 8px rgba(232,184,74,.6);
    animation: ft-spore linear infinite;
  }
  @keyframes ft-spore {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    15% { opacity: .8; }
    100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
  }

  /* ===== Modal ===== */
  #ft-root .popup-box {
    position: relative; z-index: 2;
    width: min(92vw, 380px);
    background:
      linear-gradient(180deg, #1a3d24 0%, #0f2818 45%, #0a1a10 100%);
    border-radius: 16px;
    border: 2px solid rgba(143,217,106,.45);
    box-shadow:
      0 0 0 5px rgba(232,184,74,.15),
      0 22px 50px rgba(0,0,0,.5),
      0 0 40px rgba(61,155,92,.3),
      inset 0 1px 0 rgba(232,255,180,.12);
    overflow: hidden;
    animation: ft-pop .55s cubic-bezier(.22,1.4,.36,1) .45s both;
  }
  @keyframes ft-pop {
    from { opacity: 0; transform: scale(.88) translateY(24px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Vine corners */
  #ft-root .vine {
    position: absolute; width: 48px; height: 48px; pointer-events: none; z-index: 4;
    opacity: .85;
  }
  #ft-root .vine.tl {
    top: -2px; left: -2px;
    background:
      radial-gradient(circle at 0 0, transparent 55%, rgba(143,217,106,.7) 56% 62%, transparent 63%),
      linear-gradient(135deg, rgba(61,155,92,.9) 0 8px, transparent 8px);
  }
  #ft-root .vine.tr {
    top: -2px; right: -2px; transform: scaleX(-1);
    background:
      radial-gradient(circle at 0 0, transparent 55%, rgba(143,217,106,.7) 56% 62%, transparent 63%),
      linear-gradient(135deg, rgba(61,155,92,.9) 0 8px, transparent 8px);
  }
  #ft-root .vine.bl {
    bottom: -2px; left: -2px; transform: scaleY(-1);
    background:
      radial-gradient(circle at 0 0, transparent 55%, rgba(232,184,74,.55) 56% 62%, transparent 63%),
      linear-gradient(135deg, rgba(61,155,92,.75) 0 8px, transparent 8px);
  }
  #ft-root .vine.br {
    bottom: -2px; right: -2px; transform: scale(-1);
    background:
      radial-gradient(circle at 0 0, transparent 55%, rgba(232,184,74,.55) 56% 62%, transparent 63%),
      linear-gradient(135deg, rgba(61,155,92,.75) 0 8px, transparent 8px);
  }

  #ft-root .popup-close {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 34px; height: 34px; border: none; border-radius: 50%;
    background: rgba(143,217,106,.15); color: var(--cream);
    font-size: 18px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .2s;
  }
  #ft-root .popup-close:hover { background: rgba(232,184,74,.35); transform: scale(1.08); }

  #ft-root .banner {
    text-align: center; padding: 18px 16px 4px;
    font-family: "Cinzel", serif;
    font-size: clamp(1.05rem, 4.2vw, 1.3rem);
    font-weight: 900; letter-spacing: .08em;
    background: linear-gradient(90deg, #8fd96a, #e8b84a, #c8ff8a, #8fd96a);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: ft-shine 3.5s linear infinite;
  }
  @keyframes ft-shine { to { background-position: 200% center; } }

  #ft-root .popup-sub {
    text-align: center; font-size: .74rem; font-weight: 800;
    color: rgba(200,230,180,.65); letter-spacing: .14em; text-transform: uppercase;
    margin: 0 0 10px;
  }

  #ft-root .popup-img-wrap {
    margin: 0 18px; border-radius: 12px; overflow: hidden;
    border: 2px solid rgba(232,184,74,.45);
    box-shadow:
      0 8px 24px rgba(0,0,0,.35),
      0 0 20px rgba(61,155,92,.25);
    aspect-ratio: 1; background: #0a1a10; position: relative;
  }
  #ft-root .popup-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  #ft-root .popup-badge {
    position: absolute; left: 10px; top: 10px;
    font-family: "Cinzel", serif; font-size: .62rem; font-weight: 800;
    background: linear-gradient(135deg, #1f6b3a, #3d9b5c);
    color: #f3f7e8; padding: 5px 10px; border-radius: 6px;
    border: 1px solid rgba(232,184,74,.4);
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }

  #ft-root .popup-title {
    text-align: center; font-family: "Cinzel", serif;
    font-size: 1.12rem; font-weight: 800; color: var(--cream);
    margin: 14px 16px 4px; letter-spacing: .04em;
  }
  #ft-root .popup-desc {
    text-align: center; font-size: .88rem; font-weight: 700;
    color: rgba(200,230,180,.75); margin: 0 18px 6px; line-height: 1.4;
  }

  #ft-root .popup-buttons {
    display: flex; gap: 10px; padding: 14px 18px 18px; justify-content: center;
  }
  #ft-root .popup-btn {
    flex: 1; max-width: 150px; text-align: center; text-decoration: none;
    font-family: "Cinzel", serif; font-size: .88rem; font-weight: 800;
    letter-spacing: .06em; padding: 12px 10px; border-radius: 10px;
    transition: transform .2s, box-shadow .2s;
    border: 1px solid rgba(255,255,255,.2); color: #fff;
  }
  #ft-root .popup-btn:hover { transform: translateY(-3px) scale(1.03); }
  #ft-root .btn-login {
    background: linear-gradient(135deg, #2a7a45, #1a4d2c);
    box-shadow: 0 6px 18px rgba(31,107,58,.5);
  }
  #ft-root .btn-daftar {
    background: linear-gradient(135deg, #e8b84a, #c45c26);
    color: #1a1008;
    box-shadow: 0 6px 18px rgba(232,184,74,.45);
    animation: ft-pulse 1.7s ease-in-out infinite;
  }
  @keyframes ft-pulse {
    0%,100% { box-shadow: 0 6px 18px rgba(232,184,74,.4); }
    50% { box-shadow: 0 8px 28px rgba(143,217,106,.55); }
  }

  #ft-root .popup-footer {
    text-align: center; font-size: .72rem; font-weight: 700;
    color: rgba(180,210,160,.45); padding: 0 16px 16px; line-height: 1.45;
  }
  #ft-root .popup-footer b { color: var(--amber); }

  @media (max-width: 420px) {
    #ft-root .popup-box { width: min(94vw, 360px); }
    #ft-root .banner { font-size: 1rem; }
    #ft-root .popup-btn { font-size: .8rem; padding: 11px 8px; }
  }
</style>

<div id="ft-root">
  <div id="popup-overlay" role="dialog" aria-modal="true" aria-label="Promo hutan">
    <button type="button" class="popup-backdrop" id="ft-close-bg" aria-label="Tutup"></button>
    <div class="popup-box">
      <div class="vine tl" aria-hidden="true"></div>
      <div class="vine tr" aria-hidden="true"></div>
      <div class="vine bl" aria-hidden="true"></div>
      <div class="vine br" aria-hidden="true"></div>
      <button type="button" class="popup-close" id="ft-close-btn" aria-label="Tutup">✕</button>
      <div class="banner">WILD FOREST BONUS</div>
      <p class="popup-sub">Masuk hutan · klaim harta</p>
      <div class="popup-img-wrap">
        <img class="popup-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEjA0X8bAuStiu0kj906_JUJqMUWXo19KNH9B3PqLGQixo70sDDwxKLQWIskOhmCok-T4UPI4OLUMXVmfQG1G0GXr_pPfJKBaZq8YBAL70EIP_cwRdU2uDspQ0bNr-Rcr5K7BI1qOn_CqJgJTtSxWU04XUDJF8yGOtAzlpdkQvO7Z12gtTjt8dfuMpa6rTMC=w642-h642" alt="Promo">
        <span class="popup-badge">FOREST</span>
      </div>
      <div class="popup-title">BONUS MEMBER BARU!</div>
      <p class="popup-desc">Jelajahi rimba keberuntungan — klaim bonus deposit pertamamu</p>
      <div class="popup-buttons">
        <a class="popup-btn btn-login" href="https://al-amwal-staimasi-masasih.pages.dev/">LOGIN</a>
        <a class="popup-btn btn-daftar" href="https://al-amwal-staimasi-masasih.pages.dev/">DAFTAR</a>
      </div>
      <div class="popup-footer">
        <b>Slot Depo 5K</b> · QRIS Instant<br>
        <span>© 2026 Forest Promo</span>
      </div>
    </div>
  </div>

  <div id="fx" aria-hidden="true">
    <div class="canopy"></div>
    <div class="fog"></div>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById("ft-root");
  if (!root || root.dataset.bound === "1") return;
  root.dataset.bound = "1";

  var overlay = document.getElementById("popup-overlay");
  var fx = root.querySelector("#fx");
  var closed = false;

  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (closed) return;
    closed = true;
    root.classList.add("is-closed");
    if (overlay) {
      overlay.classList.add("is-closed");
      overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
    }
  }

  var b1 = document.getElementById("ft-close-btn");
  var b2 = document.getElementById("ft-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePopup(e); });

  if (!fx) return;

  /* Tree silhouettes along bottom */
  var trees = [
    { left: "2%", h: 180, w: 70, delay: "0s", color: "#0d2e18" },
    { left: "12%", h: 240, w: 90, delay: ".4s", color: "#0a2414" },
    { left: "22%", h: 160, w: 60, delay: ".8s", color: "#123820" },
    { left: "68%", h: 200, w: 75, delay: ".2s", color: "#0d2e18" },
    { left: "78%", h: 260, w: 95, delay: ".6s", color: "#0a2414" },
    { left: "90%", h: 170, w: 65, delay: "1s", color: "#123820" },
    { left: "48%", h: 140, w: 50, delay: ".3s", color: "#0f301c" },
    { left: "58%", h: 190, w: 72, delay: ".9s", color: "#0d2e18" }
  ];
  for (var t = 0; t < trees.length; t++) {
    var tr = document.createElement("div");
    tr.className = "tree";
    var tw = trees[t].w, th = trees[t].h;
    tr.style.left = trees[t].left;
    tr.style.borderLeftWidth = (tw / 2) + "px";
    tr.style.borderRightWidth = (tw / 2) + "px";
    tr.style.borderBottomWidth = th + "px";
    tr.style.borderBottomColor = trees[t].color;
    tr.style.animationDelay = trees[t].delay;
    tr.style.animationDuration = (5.5 + Math.random() * 2) + "s";
    fx.appendChild(tr);
  }

  /* Fireflies */
  for (var f = 0; f < 28; f++) {
    var ff = document.createElement("div");
    ff.className = "firefly";
    ff.style.left = (5 + Math.random() * 90) + "%";
    ff.style.top = (10 + Math.random() * 70) + "%";
    ff.style.animationDelay = (Math.random() * 5) + "s";
    ff.style.animationDuration = (3.5 + Math.random() * 4) + "s";
    var s = 3 + Math.random() * 4;
    ff.style.width = s + "px";
    ff.style.height = s + "px";
    fx.appendChild(ff);
  }

  /* Falling leaves */
  for (var L = 0; L < 24; L++) {
    var leaf = document.createElement("div");
    leaf.className = "leaf" + (Math.random() > 0.55 ? " amber" : "");
    leaf.style.left = Math.random() * 100 + "%";
    leaf.style.animationDuration = (6 + Math.random() * 7) + "s";
    leaf.style.animationDelay = (Math.random() * 6) + "s";
    leaf.style.width = (10 + Math.random() * 10) + "px";
    leaf.style.height = (10 + Math.random() * 10) + "px";
    fx.appendChild(leaf);
  }

  /* Rising spores / pollen */
  for (var s = 0; s < 18; s++) {
    var sp = document.createElement("div");
    sp.className = "spore";
    sp.style.left = (5 + Math.random() * 90) + "%";
    sp.style.animationDuration = (8 + Math.random() * 10) + "s";
    sp.style.animationDelay = (Math.random() * 8) + "s";
    fx.appendChild(sp);
  }
})();
</script>
