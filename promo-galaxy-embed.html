<style>
  #galaxy-root {
    --bg: rgba(8, 4, 22, 0.96);
    --violet: #c084fc;
    --cyan: #67e8f9;
    --gold: #fde68a;
    --sub: #d8c8f0;
    font-family: Arial, Helvetica, sans-serif;
  }
  #galaxy-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(4, 0, 14, .82); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    animation: gx-in .45s ease 1s forwards;
  }
  #galaxy-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes gx-in { to { opacity: 1; visibility: visible; } }
  #galaxy-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #galaxy-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 22px; text-align: center;
    background: linear-gradient(165deg, #1a0a38 0%, #0a0418 55%, #1e0840 100%);
    border: 1.5px solid rgba(192, 132, 252, .7);
    box-shadow:
      0 0 0 1px rgba(103,232,249,.15) inset,
      0 0 40px rgba(168,85,247,.4),
      0 0 80px rgba(103,232,249,.18),
      0 25px 70px rgba(0,0,0,.7);
    overflow: visible;
    animation: gx-pop .7s cubic-bezier(.22,1.2,.36,1) 1s backwards;
  }
  #galaxy-root .popup-box::before {
    content: ""; position: absolute; inset: -2px; border-radius: 24px; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(192,132,252,.55), transparent 40%, rgba(103,232,249,.4));
    opacity: .55; filter: blur(10px);
    animation: gx-aura 3s ease-in-out infinite;
  }
  #galaxy-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 21px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 0%, rgba(192,132,252,.25), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(103,232,249,.15), transparent 40%),
      var(--bg);
  }
  @keyframes gx-aura {
    0%,100% { opacity: .4; }
    50% { opacity: .75; }
  }
  @keyframes gx-pop {
    0% { transform: translateY(40px) scale(.85) rotate(-2deg); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #galaxy-root .popup-box > * { position: relative; z-index: 1; }
  #galaxy-root .orbit {
    position: absolute; inset: -18px; border-radius: 50%; pointer-events: none; z-index: 0;
    border: 1px dashed rgba(192,132,252,.35);
    animation: gx-orbit 12s linear infinite;
  }
  #galaxy-root .orbit::after {
    content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px;
    margin-left: -4px; border-radius: 50%;
    background: #67e8f9; box-shadow: 0 0 12px #67e8f9;
  }
  @keyframes gx-orbit { to { transform: rotate(360deg); } }
  #galaxy-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #fde68a;
    background: linear-gradient(145deg, #c084fc, #6d28d9);
    color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(192,132,252,.85); z-index: 30; padding: 0;
    transition: transform .2s;
  }
  #galaxy-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }
  #galaxy-root .popup-img-wrap {
    position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(192,132,252,.5);
    box-shadow: 0 0 28px rgba(103,232,249,.25);
  }
  #galaxy-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(192,132,252,.15), transparent 30%, rgba(10,0,30,.55));
  }
  #galaxy-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #galaxy-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .14em; text-transform: uppercase;
    color: #1a0530; background: linear-gradient(90deg, #fde68a, #c084fc, #67e8f9);
    padding: 6px 10px; border-radius: 999px; box-shadow: 0 0 16px rgba(192,132,252,.55);
  }
  #galaxy-root .popup-title {
    margin: 16px 0 6px; font-size: 27px; font-weight: bold; letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(90deg, #fde68a, #c084fc, #67e8f9, #fde68a);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gx-title 3s linear infinite;
    filter: drop-shadow(0 0 12px rgba(192,132,252,.5));
  }
  @keyframes gx-title {
    to { background-position: 200% center; }
  }
  #galaxy-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #galaxy-root .popup-buttons { display: flex; gap: 10px; }
  #galaxy-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 14px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #galaxy-root .popup-btn:hover { transform: translateY(-3px); }
  #galaxy-root .btn-login {
    background: #0a0418; color: var(--cyan); border: 1.5px solid var(--cyan);
    box-shadow: 0 0 14px rgba(103,232,249,.35);
  }
  #galaxy-root .btn-daftar {
    background: linear-gradient(145deg, #fde68a, #c084fc 45%, #7c3aed); color: #1a0530; border: none;
    box-shadow: 0 0 22px rgba(192,132,252,.6); animation: gx-cta 1.5s ease-in-out infinite;
  }
  @keyframes gx-cta {
    0%,100% { box-shadow: 0 0 14px rgba(192,132,252,.4); }
    50% { box-shadow: 0 0 34px rgba(103,232,249,.7), 0 0 40px rgba(192,132,252,.7); }
  }

  #galaxy-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(124,58,237,.35), transparent 45%),
      radial-gradient(ellipse at 70% 60%, rgba(14,165,233,.25), transparent 40%),
      radial-gradient(ellipse at 50% 100%, rgba(236,72,153,.2), transparent 50%),
      #050214;
  }
  #galaxy-root .nebula {
    position: absolute; border-radius: 50%; filter: blur(40px);
    animation: gx-nebula 8s ease-in-out infinite alternate;
  }
  @keyframes gx-nebula {
    from { transform: scale(1) translate(0,0); opacity: .5; }
    to { transform: scale(1.25) translate(20px, -15px); opacity: .85; }
  }
  #galaxy-root .star {
    position: absolute; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px #fff, 0 0 12px #c084fc;
    animation: gx-twinkle ease-in-out infinite;
  }
  @keyframes gx-twinkle {
    0%,100% { opacity: .25; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  #galaxy-root .meteor {
    position: absolute; width: 90px; height: 2px;
    background: linear-gradient(90deg, transparent, #fff, #67e8f9, transparent);
    box-shadow: 0 0 10px #67e8f9;
    border-radius: 2px;
    animation: gx-meteor linear forwards;
    transform: rotate(35deg);
  }
  @keyframes gx-meteor {
    0% { transform: translate(0,0) rotate(35deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(70vw, 70vh) rotate(35deg); opacity: 0; }
  }
  #galaxy-root .spark {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #fde68a; box-shadow: 0 0 12px 3px rgba(192,132,252,.9);
    animation: gx-spark linear forwards;
  }
  @keyframes gx-spark {
    0% { transform: translate(0,0) scale(1.3); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #galaxy-root .ring {
    position: absolute; border: 1px solid rgba(103,232,249,.5);
    border-radius: 50%; box-shadow: 0 0 20px rgba(192,132,252,.4);
    animation: gx-ring .9s ease-out forwards;
  }
  @keyframes gx-ring {
    0% { transform: scale(.2); opacity: .9; }
    100% { transform: scale(2.6); opacity: 0; }
  }
</style>

<script>
(function () {
  var root = document.getElementById("galaxy-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("gx-close-btn");
  var b2 = document.getElementById("gx-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  function stars() {
    for (var i = 0; i < 70; i++) {
      var el = document.createElement("div");
      el.className = "star";
      var s = Math.random() * 2.8 + 1;
      el.style.width = s + "px"; el.style.height = s + "px";
      el.style.left = Math.random() * 100 + "vw";
      el.style.top = Math.random() * 100 + "vh";
      el.style.animationDuration = (Math.random() * 2.5 + 1) + "s";
      el.style.animationDelay = (Math.random() * 2) + "s";
      if (i % 5 === 0) el.style.boxShadow = "0 0 8px #fff, 0 0 16px #67e8f9";
      fx.appendChild(el);
    }
  }
  function meteor() {
    var el = document.createElement("div");
    el.className = "meteor";
    el.style.left = Math.random() * 70 + "vw";
    el.style.top = Math.random() * 30 + "vh";
    el.style.width = (Math.random() * 80 + 60) + "px";
    var dur = Math.random() * 0.7 + 0.55;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function burst(x, y) {
    for (var i = 0; i < 32; i++) {
      var s = document.createElement("div");
      s.className = "spark";
      var ang = (Math.PI * 2 * i) / 32;
      var dist = Math.random() * 130 + 40;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      if (i % 3 === 0) s.style.background = "#67e8f9";
      if (i % 3 === 1) s.style.background = "#c084fc";
      var dur = Math.random() * 0.65 + 0.5;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
    var r = document.createElement("div");
    r.className = "ring";
    r.style.width = "60px"; r.style.height = "60px";
    r.style.left = (x - 30) + "px"; r.style.top = (y - 30) + "px";
    fx.appendChild(r);
    setTimeout(function () { r.remove(); }, 950);
  }

  stars();
  setInterval(function () { meteor(); meteor(); }, 500);
  function bang() { burst(Math.random()*W*0.8+W*0.1, Math.random()*H*0.5+H*0.15); }
  bang(); setTimeout(bang, 700); setInterval(bang, 1800);
  setInterval(function () { burst(W/2, H*0.35); }, 4000);
})();
</script>
