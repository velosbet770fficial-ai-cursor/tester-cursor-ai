  #soup-root .popup-title {

  #soup-root .goo {

  #soup-root .tri {

  @keyframes sp-tri {

  #soup-root .textbit {
    position: absolute; font-size: 14px; font-weight: bold; color: #ffe600;

  @keyframes sp-text {
    0% { transform: translateY(0) skewX(0); opacity: 0; }

  #soup-root .slash {

<script>
(function () {
  var root = document.getElementById("soup-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("sp-close-btn");
  var b2 = document.getElementById("sp-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var WORDS = ["ERROR","BONUS???","404 CUAN","NYAM","GLITCH","HAHA","APA","LAGI","WOW","???"];
  var COLORS = ["#ff00aa","#00ffcc","#ffe600","#7b00ff","#ff6600","#00ff66","#ffffff"];

  function eye() {
    var el = document.createElement("div");
    el.className = "eye";
    el.style.left = Math.random() * W + "px";
    el.style.top = Math.random() * H + "px";
    el.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
    el.style.setProperty("--dy", (Math.random() * 200 - 100) + "px");
    var s = 0.6 + Math.random() * 1.4;
    el.style.transform = "scale(" + s + ")";
    var dur = Math.random() * 1.5 + 1;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function goo() {
    var el = document.createElement("div");
    el.className = "goo";
    var s = Math.random() * 50 + 20;
    el.style.width = s + "px"; el.style.height = s + "px";
    el.style.left = Math.random() * W + "px";
    el.style.top = Math.random() * H + "px";
    el.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
    el.style.setProperty("--dy", (Math.random() * 160 - 80) + "px");
    el.style.background = "radial-gradient(circle at 30% 30%," + COLORS[Math.floor(Math.random()*COLORS.length)] + "," + COLORS[Math.floor(Math.random()*COLORS.length)] + ")";
    var dur = Math.random() * 1.2 + .8;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function tri() {
    var el = document.createElement("div");
    el.className = "tri";
    el.style.left = Math.random() * 100 + "vw";
    el.style.top = "-5vh";
    el.style.borderBottomColor = COLORS[Math.floor(Math.random()*COLORS.length)];
    var dur = Math.random() * 2 + 1.5;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function textbit() {
    var el = document.createElement("div");
    el.className = "textbit";
    el.textContent = WORDS[Math.floor(Math.random() * WORDS.length)];
    el.style.left = Math.random() * 90 + 5 + "vw";
    el.style.top = Math.random() * 80 + 10 + "vh";
    el.style.color = COLORS[Math.floor(Math.random()*COLORS.length)];
    el.style.fontSize = (Math.random() * 18 + 12) + "px";
    var dur = Math.random() * 1.5 + 1;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function slash() {
    var el = document.createElement("div");
    el.className = "slash";
    el.style.left = Math.random() * W + "px";
    el.style.top = Math.random() * H + "px";
    el.style.width = (Math.random() * 180 + 80) + "px";
    el.style.setProperty("--ang", (Math.random() * 360) + "deg");
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, 360);
  }

  function burst(x, y) {
    for (var i = 0; i < 30; i++) {
      var p = document.createElement("div");
      p.className = "pixel";
      var ang = (Math.PI * 2 * i) / 30;
      var dist = Math.random() * 140 + 30;
      p.style.left = x + "px"; p.style.top = y + "px";
      p.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
      p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      p.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * .6 + .4;
      p.style.animationDuration = dur + "s";
      fx.appendChild(p);
      setTimeout(function (el) { el.remove(); }.bind(null, p), dur * 1000);
    }
  }

  setInterval(function () { eye(); eye(); }, 220);
  setInterval(function () { goo(); goo(); goo(); }, 140);
  setInterval(function () { tri(); tri(); tri(); }, 120);
  setInterval(function () { textbit(); textbit(); }, 280);
  setInterval(slash, 180);
  function bang() { burst(Math.random()*W*0.8+W*0.1, Math.random()*H*0.6+H*0.15); }
  bang(); setInterval(bang, 700);
})();
