<!--
  DROP-IN: Popup + GOLD RUSH (hujan koin emas) — bisa ditutup

<style>
  #gold-root {
    --bg: #0c0a07;
    --card: linear-gradient(165deg, #1a140c 0%, #0d0b08 55%, #1c1208 100%);
    --gold: #f5d061;
    --gold2: #c8962e;
    --ink: #2a1a00;
    --sub: #d9c39a;
    font-family: Georgia, "Times New Roman", serif;
  }

  #gold-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(0,0,0,.8); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    animation: g-in .45s ease 1s forwards;
  }
  #gold-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes g-in { to { opacity: 1; visibility: visible; } }

  #gold-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }

  #gold-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 22px 20px 20px; border-radius: 18px; text-align: center;
    background: var(--card);
    border: 2px solid var(--gold);
    box-shadow:
      0 0 0 1px rgba(245,208,97,.25) inset,
      0 0 50px rgba(200,150,40,.35),
      0 25px 70px rgba(0,0,0,.7);
    overflow: visible;
    animation: box-up .65s cubic-bezier(.22,1.2,.36,1) 1s backwards;
  }
  #gold-root .popup-box::before {
    content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(245,208,97,.18), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(200,120,30,.12), transparent 40%);
  }
  @keyframes box-up {
    0% { transform: translateY(40px) scale(.9); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #gold-root .popup-box > * { position: relative; z-index: 1; }

  #gold-root .filigree {
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    width: 120px; height: 10px; pointer-events: none; z-index: 4;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: .7;
  }
  #gold-root .filigree::before,
  #gold-root .filigree::after {
    content: "◆"; position: absolute; top: -6px; color: var(--gold);
    font-size: 10px; text-shadow: 0 0 8px rgba(245,208,97,.8);
  }
  #gold-root .filigree::before { left: 0; }
  #gold-root .filigree::after { right: 0; }

  #gold-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #ffe9a8;
    background: linear-gradient(145deg, #f5d061, #a86b12);
    color: #2a1a00; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(245,208,97,.7); z-index: 30; padding: 0;
    font-family: Arial, sans-serif; transition: transform .2s;
  }
  #gold-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }

  #gold-root .popup-img-wrap {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(245,208,97,.55);
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #gold-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 55%, rgba(20,10,0,.55));
  }
  #gold-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #gold-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-family: Arial, sans-serif; font-size: 11px; font-weight: bold;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
    background: linear-gradient(90deg, #ffe9a8, #f5d061, #c8962e);
    padding: 6px 10px; border-radius: 6px;
    box-shadow: 0 0 16px rgba(245,208,97,.55);
  }
  #gold-root .popup-title {
    margin: 16px 0 6px; font-size: 28px; font-weight: bold; letter-spacing: 1px;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(245,208,97,.55), 0 2px 0 #5a3a08;
  }
  #gold-root .popup-sub {
    margin: 0 0 16px; font-family: Arial, sans-serif; font-size: 13px; color: var(--sub);
  }
  #gold-root .popup-buttons { display: flex; gap: 10px; font-family: Arial, sans-serif; }
  #gold-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 10px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #gold-root .popup-btn:hover { transform: translateY(-3px); }
  #gold-root .btn-login {
    background: #120e09; color: var(--gold);
    border: 1.5px solid var(--gold); box-shadow: 0 0 14px rgba(245,208,97,.3);
  }
  #gold-root .btn-daftar {
    background: linear-gradient(145deg, #ffe08a, #d4a017); color: var(--ink); border: none;
    box-shadow: 0 0 22px rgba(245,208,97,.55);
    animation: gold-cta 1.5s ease-in-out infinite;
  }
  @keyframes gold-cta {
    0%,100% { box-shadow: 0 0 14px rgba(245,208,97,.4); }
    50% { box-shadow: 0 0 34px rgba(245,208,97,.95); }
  }

  /* FX */
  #gold-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
  }
  #gold-root .coin {
    position: absolute; top: -8vh; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6c8 0%, #f5d061 35%, #c8962e 70%, #8a5a10 100%);
    border: 2px solid #ffe9a8;
    box-shadow: 0 0 12px rgba(245,208,97,.7), inset 0 -3px 6px rgba(0,0,0,.25);
    animation: coin-fall linear forwards;
  }
  #gold-root .coin::after {
    content: "¥"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: inherit; font-weight: bold; color: #8a5a10;
    font-family: Arial, sans-serif; opacity: .75;
  }
  @keyframes coin-fall {
    0% { transform: translate3d(0,0,0) rotateY(0) rotate(0); opacity: 1; }
    100% { transform: translate3d(var(--drift), 115vh, 0) rotateY(720deg) rotate(180deg); opacity: .85; }
  }
  #gold-root .dust {
    position: absolute; border-radius: 50%;
    background: #ffe9a8; box-shadow: 0 0 8px 2px rgba(245,208,97,.9);
    animation: dust-fall linear forwards;
  }
  @keyframes dust-fall {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), 100vh) scale(.2); opacity: 0; }
  }
  #gold-root .ribbon {
    position: absolute; top: -5vh; width: 8px; height: 28px; border-radius: 2px;
    animation: ribbon-fall linear forwards;
  }
  @keyframes ribbon-fall {
    0% { transform: translate3d(0,0,0) rotate(0); opacity: 1; }
    100% { transform: translate3d(var(--drift), 115vh, 0) rotate(540deg); opacity: .7; }
  }
  #gold-root .burst-spark {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #fff6c8; box-shadow: 0 0 10px 3px rgba(245,208,97,1);
    animation: burst-out linear forwards;
  }
  @keyframes burst-out {
    0% { transform: translate(0,0) scale(1.2); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #gold-root .glow-floor {
    position: absolute; left: 50%; bottom: -80px; transform: translateX(-50%);
    width: 150vw; height: 240px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(245,208,97,.35) 0%, rgba(160,90,20,.15) 40%, transparent 70%);
    animation: floor-pulse 2.2s ease-in-out infinite;
  }
  @keyframes floor-pulse {
    0%,100% { opacity: .55; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleY(1.3); }
  }
  #gold-root .shimmer {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 40%, rgba(255,230,150,.08) 50%, transparent 60%);
    animation: shimmer-move 3.5s linear infinite;
  }
  @keyframes shimmer-move {
    0% { transform: translateX(-30%); }
    100% { transform: translateX(30%); }
  }
</style>

<div id="gold-root">
  <div id="popup-overlay">

    <div class="popup-box">
      <div class="filigree"></div>
      <button type="button" class="popup-close" id="g-close-btn" aria-label="Tutup">✕</button>
      <div class="popup-img-wrap">
        <img class="popup-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEitTh4uT5bosKFSq2k1EuGGy454eYrtFxO416gMJNJi8tIBM9VjWORLeUM7s3VGQoFd16VPLWQ_5Ga_qbruYPNnKvuO_nH4JJLny7-qgtnLn9-RrPsVjxP46uqtNaPhlPuWt29CYTExGVSVYGwq5N7GdhovXZYB2uhOyi1Vt816Dwcinl4sNrXYFd-HscXC=w616-h616" alt="Promo">
        <span class="popup-badge">Jackpot Ready</span>
      </div>
      <div class="popup-title">BONUS MEMBER BARU!</div>
      <p class="popup-sub">Daftar sekarang &amp; klaim bonus deposit pertamamu</p>
      <div class="popup-buttons">
        <a class="popup-btn btn-login" href="https://sflink.ink/velosbet77brand">LOGIN</a>

  <div id="fx">
    <div class="glow-floor"></div>

<script>
(function () {
  var root = document.getElementById("gold-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });

  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("g-close-btn");
  var b2 = document.getElementById("g-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var RIBBON = ["#f5d061", "#ff6b3d", "#ffe9a8", "#c8962e", "#fff"];

  function coin() {
    var el = document.createElement("div");
    el.className = "coin";
    var size = Math.random() * 18 + 14;
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = (size * 0.55) + "px";
    el.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
    var dur = Math.random() * 2.2 + 2.2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000 + 40);
  }

  function dust() {
    var el = document.createElement("div");
    el.className = "dust";
    var s = Math.random() * 4 + 2;
    el.style.width = s + "px"; el.style.height = s + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.top = "-2vh";
    el.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
    var dur = Math.random() * 2 + 1.8;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function ribbon() {
    var el = document.createElement("div");
    el.className = "ribbon";
    el.style.left = Math.random() * 100 + "vw";
    el.style.background = RIBBON[Math.floor(Math.random() * RIBBON.length)];
    el.style.setProperty("--drift", (Math.random() * 100 - 50) + "px");
    var dur = Math.random() * 2 + 2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function burst(x, y) {
    for (var i = 0; i < 36; i++) {
      var s = document.createElement("div");
      s.className = "burst-spark";
      var ang = (Math.PI * 2 * i) / 36;
      var dist = Math.random() * 140 + 40;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.6 + 0.5;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  /* hujan deras */
  setInterval(function () {
    coin(); coin();
    dust(); dust(); dust();
  }, 90);

  setInterval(function () {
    ribbon(); ribbon();
  }, 180);

  /* ledakan emas */
  function bang() {
    burst(Math.random() * W * 0.8 + W * 0.1, Math.random() * H * 0.5 + H * 0.15);
  }
  bang();
  setTimeout(bang, 700);
  setInterval(bang, 1800);
  setInterval(function () { burst(W / 2, H / 2); }, 4000);
})();
</script>
