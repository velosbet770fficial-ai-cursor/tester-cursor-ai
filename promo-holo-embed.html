  #holo-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 14px; text-align: center;
    background: linear-gradient(160deg, #0c1228 0%, #060812 50%, #12081a 100%);
    border: 1.5px solid rgba(0, 255, 240, .7);
    box-shadow:

      0 0 30px rgba(0,255,240,.35),
      0 0 60px rgba(255,0,170,.25),
      0 25px 70px rgba(0,0,0,.75);
    overflow: visible;
    animation: hg-pop .7s cubic-bezier(.22,1.2,.36,1) 1s backwards, hg-shake 4s ease-in-out 2s infinite;
  }
  #holo-root .popup-box::before {
    content: ""; position: absolute; inset: -3px; border-radius: 16px; z-index: 0; pointer-events: none;
    background: linear-gradient(90deg, #00fff0, #ff00aa, #b8ff3d, #00fff0);
    background-size: 300% 100%;
    opacity: .55; filter: blur(10px);
    animation: hg-border 2.5s linear infinite;
  }
  #holo-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 13px; z-index: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,255,240,.04) 2px 4px),
      var(--bg);
  }
  @keyframes hg-border {
    from { background-position: 0 0; }
    to { background-position: 300% 0; }
  }
  @keyframes hg-pop {
    0% { transform: translateY(36px) scale(.86) skewX(-4deg); opacity: 0; filter: hue-rotate(90deg); }
    100% { transform: none; opacity: 1; filter: none; }
  }
  @keyframes hg-shake {
    0%,90%,100% { transform: none; }
    92% { transform: translate(-2px, 1px); }
    94% { transform: translate(3px, -1px); }
    96% { transform: translate(-1px, 2px); }
  }
  #holo-root .popup-box > * { position: relative; z-index: 1; }
  #holo-root .scan {
    position: absolute; inset: 0; border-radius: 14px; pointer-events: none; z-index: 4;
    background: linear-gradient(180deg, transparent, rgba(0,255,240,.12), transparent);
    background-size: 100% 40%;
    animation: hg-scan 2.2s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes hg-scan {
    from { background-position: 0 -40%; }
    to { background-position: 0 140%; }
  }
  #holo-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #00fff0;
    background: linear-gradient(145deg, #ff00aa, #1a0030);
    color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255,0,170,.8), 0 0 10px #00fff0; z-index: 30; padding: 0;
    font-family: Arial, sans-serif; transition: transform .2s;

  #holo-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }
  #holo-root .popup-img-wrap {
    position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(0,255,240,.5);
    box-shadow: 0 0 24px rgba(255,0,170,.35);
  }
  #holo-root .popup-img-wrap::before,
  #holo-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    mix-blend-mode: screen; opacity: .35;
  }
  #holo-root .popup-img-wrap::before {
    background: #00fff0; mix-blend-mode: multiply; opacity: .2;
    animation: hg-rgb 1.5s steps(2) infinite;
    transform: translate(2px, 0);

  #holo-root .popup-img-wrap::after {

  @keyframes hg-title {
    0%,100% { text-shadow: 2px 0 #ff00aa, -2px 0 #00fff0, 0 0 18px rgba(0,255,240,.7); }
    50% { text-shadow: -2px 0 #ff00aa, 2px 0 #00fff0, 0 0 24px rgba(255,0,170,.8); }
  }
  #holo-root .popup-sub {
    margin: 0 0 16px; font-size: 13px; color: var(--sub);
    font-family: Arial, Helvetica, sans-serif;
  }
  #holo-root .popup-buttons { display: flex; gap: 10px; font-family: Arial, sans-serif; }
  #holo-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 8px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #holo-root .popup-btn:hover { transform: translateY(-3px); }
  #holo-root .btn-login {
    background: #050510; color: var(--c1); border: 1.5px solid var(--c1);
    box-shadow: 0 0 14px rgba(0,255,240,.35);
  }
  #holo-root .btn-daftar {
    background: linear-gradient(145deg, #ff4dc4, #ff00aa 40%, #7a00ff); color: #fff; border: none;
    box-shadow: 0 0 22px rgba(255,0,170,.6); animation: hg-cta 1.2s ease-in-out infinite;
  }
  @keyframes hg-cta {
    0%,100% { box-shadow: 0 0 14px rgba(255,0,170,.45); }
    50% { box-shadow: 0 0 34px rgba(0,255,240,.85), 0 0 28px rgba(255,0,170,.7); }
  }

  #holo-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,0,170,.18), transparent 40%),
      radial-gradient(ellipse at 80% 70%, rgba(0,255,240,.15), transparent 45%),
      #05060f;
  }
  #holo-root .grid {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(0,255,240,.06) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,0,170,.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: hg-grid 6s linear infinite;
    mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 80%);
  }
  @keyframes hg-grid {
    from { background-position: 0 0; }
    to { background-position: 40px 40px; }
  }
  #holo-root .bar {
    position: absolute; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, transparent, #00fff0, #ff00aa, transparent);
    box-shadow: 0 0 12px #00fff0;
    animation: hg-bar linear forwards;
  }
  @keyframes hg-bar {
    0% { opacity: 0; transform: scaleX(0); }
    20% { opacity: 1; transform: scaleX(1); }
    100% { opacity: 0; transform: translateY(30px) scaleX(1); }
  }
  #holo-root .shard {
    position: absolute; width: 2px;
    background: linear-gradient(to bottom, transparent, #00fff0, #ff00aa);
    box-shadow: 0 0 8px #00fff0;
    animation: hg-shard linear forwards;
  }
  @keyframes hg-shard {
    0% { transform: translateY(-10vh) rotate(10deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(-20deg); opacity: 0; }
  }
  #holo-root .pixel {
    position: absolute; width: 6px; height: 6px;
    box-shadow: 0 0 8px currentColor;
    animation: hg-pixel linear forwards;
  }
  @keyframes hg-pixel {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #holo-root .noise {
    position: absolute; inset: 0; opacity: .08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation: hg-noise .2s steps(2) infinite;
  }
  @keyframes hg-noise {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(-1%, 1%); }
  }
</style>

<script>
(function () {
  var root = document.getElementById("holo-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("hg-close-btn");
  var b2 = document.getElementById("hg-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var COLORS = ["#00fff0", "#ff00aa", "#b8ff3d", "#7a5cff"];

  function bar() {
    var el = document.createElement("div");
    el.className = "bar";
    el.style.top = Math.random() * 100 + "vh";
    el.style.height = (Math.random() * 4 + 1) + "px";
    var dur = Math.random() * 0.35 + 0.2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function shard() {
    var el = document.createElement("div");
    el.className = "shard";
    el.style.left = Math.random() * 100 + "vw";
    el.style.height = (Math.random() * 60 + 30) + "px";
    var dur = Math.random() * 1.2 + 0.8;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function burst(x, y) {
    for (var i = 0; i < 36; i++) {
      var s = document.createElement("div");
      s.className = "pixel";
      var ang = (Math.PI * 2 * i) / 36;
      var dist = Math.random() * 140 + 40;
      var c = COLORS[i % COLORS.length];
      s.style.background = c; s.style.color = c;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.55 + 0.45;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  setInterval(function () { bar(); bar(); shard(); }, 140);
  function bang() { burst(Math.random()*W*0.8+W*0.1, Math.random()*H*0.55+H*0.15); }
  bang(); setTimeout(bang, 600); setInterval(bang, 1600);
  setInterval(function () { burst(W/2, H*0.4); }, 3800);
})();
</script>
