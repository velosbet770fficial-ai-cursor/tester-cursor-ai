  DROP-IN: Popup + ICE CRYSTAL — bisa ditutup

<style>
  #ice-root {
    --bg: rgba(4, 14, 28, 0.94);
    --ice: #b8f0ff;
    --ice2: #5ec8ff;
    --deep: #082033;
    --sub: #c5e6f5;
    font-family: Arial, Helvetica, sans-serif;
  }
  #ice-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(0, 12, 24, .78); backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden;
    animation: ice-in .45s ease 1s forwards;
  }
  #ice-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes ice-in { to { opacity: 1; visibility: visible; } }
  #ice-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #ice-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 20px; text-align: center;
    background: linear-gradient(165deg, #0a2238 0%, #061420 60%, #0c2a40 100%);
    border: 1.5px solid rgba(184, 240, 255, .65);
    box-shadow: 0 0 40px rgba(94, 200, 255, .35), 0 0 90px rgba(100, 180, 255, .2), 0 25px 70px rgba(0,0,0,.65);
    overflow: visible;
    animation: ice-pop .65s cubic-bezier(.22,1.2,.36,1) 1s backwards;
  }
  #ice-root .popup-box::before {
    content: ""; position: absolute; inset: -2px; border-radius: 22px; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(184,240,255,.5), transparent 40%, rgba(94,200,255,.35));
    opacity: .55; filter: blur(8px);
  }
  #ice-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 19px; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(184,240,255,.08), transparent 35%), var(--bg);
  }
  @keyframes ice-pop {
    0% { transform: translateY(40px) scale(.88); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #ice-root .popup-box > * { position: relative; z-index: 1; }
  #ice-root .frost {
    position: absolute; inset: 0; border-radius: 20px; pointer-events: none; z-index: 3; opacity: .35;
    background:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,.35) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,.3) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 30% 80%, rgba(184,240,255,.35) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,.25) 0 1px, transparent 2px);
  }
  #ice-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #e8faff;
    background: linear-gradient(145deg, #b8f0ff, #3a9fd8);
    color: #032033; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(94,200,255,.75); z-index: 30; padding: 0;
    transition: transform .2s;
  }
  #ice-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }
  #ice-root .popup-img-wrap {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(184,240,255,.45);
    box-shadow: 0 0 24px rgba(94,200,255,.25);
  }
  #ice-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(184,240,255,.12), transparent 30%, rgba(0,20,40,.5));
  }
  #ice-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #ice-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .12em; text-transform: uppercase;
    color: #032033; background: linear-gradient(90deg, #e8faff, #5ec8ff);
    padding: 6px 10px; border-radius: 8px; box-shadow: 0 0 14px rgba(94,200,255,.55);
  }
  #ice-root .popup-title {
    margin: 16px 0 6px; font-size: 27px; font-weight: bold; letter-spacing: 1px;
    color: var(--ice); text-shadow: 0 0 20px rgba(94,200,255,.7);
  }
  #ice-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #ice-root .popup-buttons { display: flex; gap: 10px; }
  #ice-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #ice-root .popup-btn:hover { transform: translateY(-3px); }
  #ice-root .btn-login {
    background: #061624; color: var(--ice); border: 1.5px solid var(--ice2);
    box-shadow: 0 0 14px rgba(94,200,255,.35);
  }
  #ice-root .btn-daftar {
    background: linear-gradient(145deg, #e8faff, #5ec8ff); color: #032033; border: none;
    box-shadow: 0 0 22px rgba(94,200,255,.55); animation: ice-cta 1.5s ease-in-out infinite;
  }
  @keyframes ice-cta {
    0%,100% { box-shadow: 0 0 14px rgba(94,200,255,.4); }
    50% { box-shadow: 0 0 32px rgba(184,240,255,.95); }
  }

  #ice-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
  }
  #ice-root .flake {
    position: absolute; top: -8vh; color: #e8faff;
    text-shadow: 0 0 10px rgba(184,240,255,.9);
    animation: flake-fall linear forwards;
    font-family: Arial, sans-serif; line-height: 1;
  }
  @keyframes flake-fall {
    0% { transform: translate3d(0,0,0) rotate(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate3d(var(--drift), 115vh, 0) rotate(360deg); opacity: .7; }
  }
  #ice-root .shard {
    position: absolute; top: -6vh; width: 3px;
    background: linear-gradient(to bottom, transparent, #e8faff, #5ec8ff);
    box-shadow: 0 0 10px rgba(94,200,255,.8);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    animation: shard-fall linear forwards;
  }
  @keyframes shard-fall {
    0% { transform: translate3d(0,0,0) rotate(var(--rot)); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate3d(var(--drift), 115vh, 0) rotate(calc(var(--rot) + 180deg)); opacity: .6; }
  }
  #ice-root .frostbit {
    position: absolute; border-radius: 50%;
    background: #fff; box-shadow: 0 0 8px 2px rgba(184,240,255,.9);
    animation: frost-fall linear forwards;
  }
  @keyframes frost-fall {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), 100vh) scale(.2); opacity: 0; }
  }
  #ice-root .crystal-burst {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #e8faff; box-shadow: 0 0 12px 3px rgba(94,200,255,1);
    animation: cburst linear forwards;
  }
  @keyframes cburst {
    0% { transform: translate(0,0) scale(1.2); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #ice-root .aurora {
    position: absolute; left: 50%; bottom: -90px; transform: translateX(-50%);
    width: 160vw; height: 260px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(94,200,255,.35) 0%, rgba(120,180,255,.15) 40%, transparent 70%);
    animation: aurora 2.4s ease-in-out infinite;
  }
  @keyframes aurora {
    0%,100% { opacity: .5; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleY(1.35); }
  }
  #ice-root .mist {
    position: absolute; top: -40px; left: 0; width: 100%; height: 200px;
    background: linear-gradient(180deg, rgba(180,230,255,.18), transparent);
    animation: mist 4s ease-in-out infinite alternate;
  }
  @keyframes mist {
    from { opacity: .4; }
    to { opacity: .85; }
  }
</style>

<script>
(function () {
  var root = document.getElementById("ice-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("i-close-btn");
  var b2 = document.getElementById("i-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var FLAKES = ["❄", "✦", "✧", "·", "❄"];

  function flake() {
    var el = document.createElement("div");
    el.className = "flake";
    el.textContent = FLAKES[Math.floor(Math.random() * FLAKES.length)];
    var size = Math.random() * 16 + 10;
    el.style.fontSize = size + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.setProperty("--drift", (Math.random() * 100 - 50) + "px");
    var dur = Math.random() * 3 + 2.5;
    el.style.animationDuration = dur + "s";
    el.style.opacity = (Math.random() * 0.5 + 0.4).toFixed(2);
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000 + 40);
  }
  function shard() {
    var el = document.createElement("div");
    el.className = "shard";
    el.style.left = Math.random() * 100 + "vw";
    el.style.height = (Math.random() * 28 + 16) + "px";
    el.style.setProperty("--drift", (Math.random() * 60 - 30) + "px");
    el.style.setProperty("--rot", (Math.random() * 40 - 20) + "deg");
    var dur = Math.random() * 1.8 + 1.4;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function frost() {
    var el = document.createElement("div");
    el.className = "frostbit";
    var s = Math.random() * 3 + 1.5;
    el.style.width = s + "px"; el.style.height = s + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.top = "-2vh";
    el.style.setProperty("--dx", (Math.random() * 40 - 20) + "px");
    var dur = Math.random() * 2.2 + 1.8;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function burst(x, y) {
    for (var i = 0; i < 32; i++) {
      var s = document.createElement("div");
      s.className = "crystal-burst";
      var ang = (Math.PI * 2 * i) / 32;
      var dist = Math.random() * 130 + 40;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.6 + 0.5;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  setInterval(function () { flake(); flake(); frost(); frost(); }, 100);
  setInterval(function () { shard(); shard(); }, 160);
  function bang() { burst(Math.random()*W*0.8+W*0.1, Math.random()*H*0.5+H*0.15); }
  bang(); setTimeout(bang, 800); setInterval(bang, 2000);
  setInterval(function () { burst(W/2, H*0.35); }, 4200);
})();
</script>
