<style>
  #kraken-root {

    --gold: #ffd76a;
    --coral: #ff6b6b;
    --foam: #e8fff8;

    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  }
  #kraken-root.is-closed #popup-overlay {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #kraken-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background:
      radial-gradient(ellipse at 50% 70%, rgba(30,230,193,.12), transparent 55%),
      rgba(2, 10, 16, .24);
    backdrop-filter: blur(1.5px);
    opacity: 0; visibility: hidden;
    animation: kr-in .45s ease .55s forwards;
  }
  #kraken-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes kr-in { to { opacity: 1; visibility: visible; } }

  #kraken-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }

  #kraken-root .popup-box {
    position: relative; z-index: 2; width: min(372px, 93vw);
    padding: 20px; border-radius: 22px 18px 26px 20px;
    text-align: center;
    background:
      radial-gradient(circle at 20% 0%, rgba(200,255,74,.18), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(30,230,193,.2), transparent 45%),
      linear-gradient(165deg, #0a2a28 0%, #031018 52%, #0d2420 100%);
    border: 2px solid rgba(30,230,193,.85);
    box-shadow:
      0 0 0 1px rgba(200,255,74,.2) inset,
      0 0 48px rgba(30,230,193,.45),
      0 0 80px rgba(200,255,74,.12),
      0 22px 50px rgba(0,0,0,.5);
    overflow: visible;
    animation:
      kr-rise .7s cubic-bezier(.2,1.4,.3,1) .55s backwards,
      kr-bob 3.2s ease-in-out 1.3s infinite;
  }
  #kraken-root .popup-box::before {
    content: ""; position: absolute; inset: -6px; z-index: 0; pointer-events: none;
    border-radius: 26px 22px 30px 24px;
    background: conic-gradient(from 120deg, #1ee6c1, #c8ff4a, #ffd76a, #1ee6c1, #c8ff4a);
    opacity: .42; filter: blur(16px);
    animation: kr-spin 3.5s linear infinite;
  }
  #kraken-root .popup-box::after {
    content: ""; position: absolute; inset: 2px; z-index: 0; pointer-events: none;
    border-radius: 20px 16px 24px 18px;
    background:
      linear-gradient(180deg, rgba(232,255,248,.08), transparent 28%),
      rgba(3,16,24,.94);
  }
  @keyframes kr-spin { to { transform: rotate(360deg); } }
  @keyframes kr-rise {
    0% { transform: translateY(80px) scale(.55) rotate(-8deg); opacity: 0; filter: blur(8px); }
    70% { transform: translateY(-8px) scale(1.04) rotate(2deg); filter: blur(0); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes kr-bob {
    0%,100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-7px) rotate(.6deg); }
  }
  #kraken-root .popup-box > * { position: relative; z-index: 1; }

  #kraken-root .bubbles {
    position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
    pointer-events: none; z-index: 3; opacity: .55;
  }
  #kraken-root .bubbles i {
    position: absolute; bottom: -10px; width: 6px; height: 6px; border-radius: 50%;
    background: rgba(232,255,248,.7); box-shadow: 0 0 8px rgba(30,230,193,.8);
    animation: kr-bubble linear infinite;
  }
  @keyframes kr-bubble {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translateY(-280px) scale(1.2); opacity: 0; }
  }

  #kraken-root .popup-close {
    position: absolute; top: -18px; right: -18px; width: 52px; height: 52px;
    border-radius: 50%; border: 2px solid var(--foam);
    background: radial-gradient(circle at 35% 30%, #c8ff4a, #1ee6c1 55%, #0a4a42);
    color: #031018; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;

  }
  @keyframes kr-btn {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.12) rotate(-8deg); }
  }
  #kraken-root .popup-close:hover { transform: scale(1.18) rotate(90deg); animation: none; }

  #kraken-root .popup-img-wrap {
    position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1;

  #kraken-root .popup-img-wrap::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;

  #kraken-root .popup-badge {

  @keyframes kr-cta {

    50% { box-shadow: 0 0 34px rgba(200,255,74,.9), 0 0 18px #1ee6c1; transform: scale(1.045); }

  /* ===== FX LAYER ===== */
  #kraken-root #fx {

  #kraken-root .abyss {

  #kraken-root .eye {

  /* Tentacles = CSS ribbons with suckers */
  #kraken-root .tentacle {
    position: absolute; width: 54px; height: 120vh;

  #kraken-root .tentacle::after {

  @keyframes kr-suck {

  #kraken-root .tentacle.t1 { left: -2vw; bottom: -15vh; animation: kr-whip1 3.2s ease-in-out infinite; }
  #kraken-root .tentacle.t2 { left: 10vw; bottom: -20vh; width: 42px; animation: kr-whip2 2.7s ease-in-out infinite .2s; }
  #kraken-root .tentacle.t3 { right: -2vw; left: auto; bottom: -15vh; animation: kr-whip3 3s ease-in-out infinite .1s; }
  #kraken-root .tentacle.t4 { right: 9vw; left: auto; bottom: -22vh; width: 46px; animation: kr-whip4 2.5s ease-in-out infinite .35s; }

  @keyframes kr-whip1 {

  #kraken-root .ink {
    position: absolute; border-radius: 50%;

  @keyframes kr-ink {

    25% { opacity: .85; }

  }

  #kraken-root .loot {
    position: absolute; will-change: transform, opacity;
    animation: kr-loot linear forwards;
  }
  #kraken-root .loot.coin {
    width: 15px; height: 15px; border-radius: 50%;

  }
  #kraken-root .loot.pearl {
    width: 11px; height: 11px; border-radius: 50%;

  #kraken-root .loot.gem {

  #kraken-root .loot.bubble {

  #kraken-root .loot.skull {
    width: 14px; height: 14px; border-radius: 45% 45% 40% 40%;

  }
  #kraken-root .loot.star {
    width: 0; height: 0;

    border-right: 7px solid transparent;
    border-bottom: 12px solid #ffd76a;

  }
  @keyframes kr-loot {
    0% {
      transform: translate3d(0, 0, 0) rotate(0) scale(.4);
      opacity: 0;
    }
    10% { opacity: 1; }
    100% {
      transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--spin)) scale(var(--sc));
      opacity: 0;
    }
  }

  #kraken-root .spark {
    position: absolute; width: 3px; height: 18px; border-radius: 2px;
    background: linear-gradient(180deg, #c8ff4a, transparent);

    animation: kr-spark .55s ease-out forwards;
  }
  @keyframes kr-spark {
    0% { transform: translate(0,0) scaleY(.3); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scaleY(1.2); opacity: 0; }
  }

  #kraken-root .ripple {
    position: absolute; left: 50%; bottom: 8vh;

  #kraken-root .ripple.r2 { animation-delay: .65s; border-color: rgba(200,255,74,.3); }

  @keyframes kr-ripple {
    0% { width: 30px; height: 12px; opacity: .8; }

<script>
(function () {
  var root = document.getElementById("kraken-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = root.querySelector("#fx");
  var bubblesBox = document.getElementById("kr-bubbles");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  var timers = [];
  var timeouts = [];
  var closed = false;

  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });

  function trackTimeout(fn, ms) {
    var id = setTimeout(fn, ms);
    timeouts.push(id);
    return id;
  }

  /* Tutup = modal saja hilang. Tentakel / mata / loot TETAP jalan. */
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (closed) return;
    closed = true;
    root.classList.add("is-closed");
    if (overlay) {
      overlay.classList.add("is-closed");
      overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
    }
  }

  var b1 = document.getElementById("kr-close-btn");
  var b2 = document.getElementById("kr-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePopup(e);
  });

  /* bubble accents inside modal */
  if (bubblesBox) {
    for (var bi = 0; bi < 10; bi++) {
      var bub = document.createElement("i");
      bub.style.left = (8 + Math.random() * 84) + "%";
      bub.style.width = bub.style.height = (4 + Math.random() * 7) + "px";
      bub.style.animationDuration = (2.2 + Math.random() * 2.5) + "s";
      bub.style.animationDelay = (Math.random() * 2) + "s";
      bubblesBox.appendChild(bub);
    }
  }

  var KINDS = ["coin", "pearl", "gem", "bubble", "skull", "star"];

  function loot() {
    if (!fx) return;
    var el = document.createElement("div");
    var kind = KINDS[Math.floor(Math.random() * KINDS.length)];
    el.className = "loot " + kind;

    var fromLeft = Math.random() > 0.5;
    var x = fromLeft ? (-20 + Math.random() * 30) : (W - 10 - Math.random() * 30);
    var y = H * (0.35 + Math.random() * 0.55);
    var dx = (fromLeft ? 1 : -1) * (80 + Math.random() * (W * 0.45));
    var dy = -(120 + Math.random() * (H * 0.55));
    var dur = 1.6 + Math.random() * 1.6;
    var spin = (Math.random() * 720 - 360) + "deg";
    var sc = 0.7 + Math.random() * 1.3;

    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.setProperty("--dx", dx + "px");
    el.style.setProperty("--dy", dy + "px");
    el.style.setProperty("--spin", spin);
    el.style.setProperty("--sc", String(sc));
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    trackTimeout(function () { if (el.parentNode) el.remove(); }, dur * 1000 + 40);
  }

  function ink() {
    if (!fx) return;
    var el = document.createElement("div");
    el.className = "ink";
    var size = 80 + Math.random() * 160;
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = (Math.random() * 90) + "vw";
    el.style.top = (40 + Math.random() * 50) + "vh";
    fx.appendChild(el);
    trackTimeout(function () { if (el.parentNode) el.remove(); }, 1900);
  }

  function spark() {
    if (!fx) return;
    var el = document.createElement("div");
    el.className = "spark";
    el.style.left = (10 + Math.random() * 80) + "vw";
    el.style.top = (15 + Math.random() * 70) + "vh";
    el.style.setProperty("--sx", (Math.random() * 60 - 30) + "px");
    el.style.setProperty("--sy", (-40 - Math.random() * 80) + "px");
    el.style.transform = "rotate(" + (Math.random() * 50 - 25) + "deg)";
    fx.appendChild(el);
    trackTimeout(function () { if (el.parentNode) el.remove(); }, 600);
  }

  function burst() {
    for (var i = 0; i < 8; i++) loot();
    ink();
    for (var s = 0; s < 6; s++) spark();
  }

  for (var i = 0; i < 24; i++) trackTimeout(loot, i * 40);
  trackTimeout(burst, 200);
  timers.push(setInterval(function () {
    loot(); loot(); loot(); loot(); loot();
  }, 70));
  timers.push(setInterval(function () { ink(); spark(); spark(); }, 280));
  timers.push(setInterval(burst, 1100));
})();
</script>
