<style>
  #lava-root {
    --bg: rgba(18, 4, 2, 0.96);
    --fire: #ff6a00;
    --lava: #ff2d00;
    --ember: #ffcc66;
    --deep: #1a0602;
    --sub: #ffd0b0;
    font-family: Arial, Helvetica, sans-serif;
  }
  #lava-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(12, 2, 0, .8); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    animation: lv-in .45s ease 1s forwards;
  }
  #lava-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes lv-in { to { opacity: 1; visibility: visible; } }
  #lava-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #lava-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 18px; text-align: center;
    background: linear-gradient(165deg, #2a0c04 0%, #120402 55%, #3a1006 100%);
    border: 1.5px solid rgba(255, 106, 0, .75);
    box-shadow:
      0 0 0 1px rgba(255,200,80,.15) inset,
      0 0 40px rgba(255,80,0,.4),
      0 0 90px rgba(255,40,0,.22),
      0 25px 70px rgba(0,0,0,.7);
    overflow: visible;
    animation: lv-pop .65s cubic-bezier(.22,1.2,.36,1) 1s backwards;
  }
  #lava-root .popup-box::before {
    content: ""; position: absolute; inset: -2px; border-radius: 20px; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,200,80,.5), transparent 40%, rgba(255,60,0,.4));
    opacity: .55; filter: blur(8px);
  }
  #lava-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 17px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 110%, rgba(255,80,0,.28), transparent 50%),
      linear-gradient(180deg, rgba(255,180,60,.1), transparent 40%),
      var(--bg);
  }
  @keyframes lv-pop {
    0% { transform: translateY(40px) scale(.88); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #lava-root .popup-box > * { position: relative; z-index: 1; }
  #lava-root .heat {
    position: absolute; inset: 0; border-radius: 18px; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,80,0,.22), transparent 55%);
    animation: lv-heat 1.6s ease-in-out infinite;
  }
  @keyframes lv-heat {
    0%,100% { opacity: .45; }
    50% { opacity: .9; }
  }
  #lava-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #ffe0a0;
    background: linear-gradient(145deg, #ffcc66, #ff3d00);
    color: #2a0a00; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255,80,0,.8); z-index: 30; padding: 0;
    transition: transform .2s;
  }
  #lava-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }
  #lava-root .popup-img-wrap {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(255,140,40,.55);
    box-shadow: 0 0 24px rgba(255,80,0,.3);
  }
  #lava-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,180,60,.12), transparent 30%, rgba(40,8,0,.55));
  }
  #lava-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #lava-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .12em; text-transform: uppercase;
    color: #2a0a00; background: linear-gradient(90deg, #ffe0a0, #ff6a00);
    padding: 6px 10px; border-radius: 8px; box-shadow: 0 0 14px rgba(255,100,0,.6);
  }
  #lava-root .popup-title {
    margin: 16px 0 6px; font-size: 27px; font-weight: bold; letter-spacing: 1px;
    color: #ffcc66;
    text-shadow: 0 0 18px rgba(255,100,0,.85), 0 2px 0 #5a1800;
  }
  #lava-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #lava-root .popup-buttons { display: flex; gap: 10px; }
  #lava-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #lava-root .popup-btn:hover { transform: translateY(-3px); }
  #lava-root .btn-login {
    background: #1a0802; color: #ffcc66; border: 1.5px solid #ff6a00;
    box-shadow: 0 0 14px rgba(255,100,0,.35);
  }
  #lava-root .btn-daftar {
    background: linear-gradient(145deg, #ffe0a0, #ff4d00); color: #2a0a00; border: none;
    box-shadow: 0 0 22px rgba(255,80,0,.6); animation: lv-cta 1.4s ease-in-out infinite;
  }
  @keyframes lv-cta {
    0%,100% { box-shadow: 0 0 14px rgba(255,80,0,.45); }
    50% { box-shadow: 0 0 34px rgba(255,160,40,.95); }
  }

  #lava-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
  }
  #lava-root .ember {
    position: absolute; bottom: -4vh; border-radius: 50%;
    background: radial-gradient(circle, #fff6c8 0%, #ffcc66 30%, #ff6a00 70%, transparent 100%);
    box-shadow: 0 0 10px 2px rgba(255,100,0,.8);
    animation: ember-up linear forwards;
  }
  @keyframes ember-up {
    0% { transform: translate3d(0,0,0) scale(1); opacity: 1; }
    100% { transform: translate3d(var(--drift), -115vh, 0) scale(.2); opacity: 0; }
  }
  #lava-root .spark {
    position: absolute; bottom: 0; width: 3px; height: 3px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 8px 2px #ff6a00;
    animation: spark-up linear forwards;
  }
  @keyframes spark-up {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #lava-root .flame {
    position: absolute; bottom: -8vh; width: 18px;
    background: linear-gradient(to top, #ff2d00, #ff6a00, #ffcc66, transparent);
    border-radius: 50% 50% 20% 20%;
    filter: blur(1px);
    box-shadow: 0 0 18px rgba(255,80,0,.8);
    animation: flame-rise linear forwards;
    transform-origin: bottom center;
  }
  @keyframes flame-rise {
    0% { transform: translate3d(0,0,0) scaleY(1) scaleX(1); opacity: .9; }
    50% { transform: translate3d(var(--wiggle), -50vh, 0) scaleY(1.3) scaleX(.7); opacity: .8; }
    100% { transform: translate3d(calc(var(--wiggle) * -1), -110vh, 0) scaleY(.4) scaleX(.3); opacity: 0; }
  }
  #lava-root .lava-burst {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: #ffcc66; box-shadow: 0 0 14px 3px #ff3d00;
    animation: lava-burst linear forwards;
  }
  @keyframes lava-burst {
    0% { transform: translate(0,0) scale(1.3); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #lava-root .magma {
    position: absolute; left: 50%; bottom: -100px; transform: translateX(-50%);
    width: 160vw; height: 280px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(255,60,0,.55) 0%, rgba(255,100,0,.25) 40%, transparent 70%);
    animation: magma 1.8s ease-in-out infinite;
  }
  @keyframes magma {
    0%,100% { opacity: .55; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleY(1.4); }
  }
  #lava-root .haze {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 45%;
    background: linear-gradient(0deg, rgba(80,10,0,.45), transparent);
    animation: haze 3s ease-in-out infinite alternate;
  }
  @keyframes haze {
    from { opacity: .5; }
    to { opacity: .95; }
  }
</style>

<script>
(function () {
  var root = document.getElementById("lava-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("lv-close-btn");
  var b2 = document.getElementById("lv-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  function ember() {
    var el = document.createElement("div");
    el.className = "ember";
    var s = Math.random() * 8 + 4;
    el.style.width = s + "px"; el.style.height = s + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
    var dur = Math.random() * 2.8 + 2.2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000 + 40);
  }
  function flame() {
    var el = document.createElement("div");
    el.className = "flame";
    el.style.left = Math.random() * 100 + "vw";
    el.style.height = (Math.random() * 50 + 40) + "px";
    el.style.width = (Math.random() * 14 + 10) + "px";
    el.style.setProperty("--wiggle", (Math.random() * 40 - 20) + "px");
    var dur = Math.random() * 2 + 1.6;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function spark() {
    var el = document.createElement("div");
    el.className = "spark";
    el.style.left = Math.random() * 100 + "vw";
    el.style.bottom = Math.random() * 20 + "vh";
    el.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
    el.style.setProperty("--dy", (-Math.random() * 120 - 40) + "px");
    var dur = Math.random() * 0.8 + 0.5;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function burst(x, y) {
    for (var i = 0; i < 36; i++) {
      var s = document.createElement("div");
      s.className = "lava-burst";
      var ang = (Math.PI * 2 * i) / 36;
      var dist = Math.random() * 140 + 50;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.65 + 0.5;
      s.style.animationDuration = dur + "s";
      if (i % 3 === 0) s.style.background = "#ff2d00";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  setInterval(function () { ember(); ember(); spark(); }, 90);
  setInterval(function () { flame(); flame(); }, 140);
  function bang() { burst(Math.random()*W*0.8+W*0.1, Math.random()*H*0.45+H*0.35); }
  bang(); setTimeout(bang, 700); setInterval(bang, 1900);
  setInterval(function () { burst(W/2, H*0.7); }, 4000);
})();
</script>
