<style>
  #ocean-root {
    --bg: rgba(2, 18, 32, 0.96);
    --aqua: #3de7ff;
    --deep: #0a4d6e;
    --foam: #e8fbff;
    --sub: #a8d8e8;
    font-family: Arial, Helvetica, sans-serif;
  }
  #ocean-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(0, 10, 22, .8); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    animation: oc-in .45s ease 1s forwards;
  }
  #ocean-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes oc-in { to { opacity: 1; visibility: visible; } }
  #ocean-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #ocean-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 18px; text-align: center;
    background: linear-gradient(165deg, #06324a 0%, #021820 55%, #0a3a52 100%);
    border: 1.5px solid rgba(61, 231, 255, .65);
    box-shadow:
      0 0 0 1px rgba(61,231,255,.12) inset,
      0 0 40px rgba(20,160,200,.35),
      0 25px 70px rgba(0,0,0,.7);
    overflow: visible;
    animation: oc-pop .65s cubic-bezier(.22,1.2,.36,1) 1s backwards;
  }
  #ocean-root .popup-box::before {
    content: ""; position: absolute; inset: -2px; border-radius: 20px; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(61,231,255,.45), transparent 40%, rgba(10,100,160,.35));
    opacity: .5; filter: blur(8px);
  }
  #ocean-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 17px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(61,231,255,.15), transparent 45%),
      linear-gradient(180deg, rgba(61,231,255,.06), transparent 40%),
      var(--bg);
  }
  @keyframes oc-pop {
    0% { transform: translateY(40px) scale(.88); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #ocean-root .popup-box > * { position: relative; z-index: 1; }
  #ocean-root .caustic {
    position: absolute; inset: 0; border-radius: 18px; pointer-events: none; z-index: 3; opacity: .35;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(61,231,255,.35), transparent 40%),
      radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.2), transparent 35%);
    animation: oc-caustic 3s ease-in-out infinite alternate;
  }
  @keyframes oc-caustic {
    from { opacity: .25; transform: scale(1); }
    to { opacity: .5; transform: scale(1.05); }
  }
  #ocean-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #e8fbff;
    background: linear-gradient(145deg, #3de7ff, #0a6e9a);
    color: #021820; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(61,231,255,.75); z-index: 30; padding: 0;
    transition: transform .2s;
  }
  #ocean-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }
  #ocean-root .popup-img-wrap {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(61,231,255,.45);
    box-shadow: 0 0 24px rgba(20,160,200,.28);
  }
  #ocean-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(61,231,255,.1), transparent 30%, rgba(0,20,40,.55));
  }
  #ocean-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #ocean-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .12em; text-transform: uppercase;
    color: #021820; background: linear-gradient(90deg, #e8fbff, #3de7ff);
    padding: 6px 10px; border-radius: 8px; box-shadow: 0 0 14px rgba(61,231,255,.55);
  }
  #ocean-root .popup-title {
    margin: 16px 0 6px; font-size: 27px; font-weight: bold; letter-spacing: 1px;
    color: var(--aqua); text-shadow: 0 0 18px rgba(61,231,255,.7);
  }
  #ocean-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #ocean-root .popup-buttons { display: flex; gap: 10px; }
  #ocean-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #ocean-root .popup-btn:hover { transform: translateY(-3px); }
  #ocean-root .btn-login {
    background: #021820; color: var(--aqua); border: 1.5px solid var(--aqua);
    box-shadow: 0 0 14px rgba(61,231,255,.3);
  }
  #ocean-root .btn-daftar {
    background: linear-gradient(145deg, #e8fbff, #3de7ff); color: #021820; border: none;
    box-shadow: 0 0 22px rgba(61,231,255,.55); animation: oc-cta 1.5s ease-in-out infinite;
  }
  @keyframes oc-cta {
    0%,100% { box-shadow: 0 0 14px rgba(61,231,255,.4); }
    50% { box-shadow: 0 0 32px rgba(61,231,255,.95); }
  }

  #ocean-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background: linear-gradient(180deg, #041828 0%, #063550 40%, #021018 100%);
  }
  #ocean-root .ray {
    position: absolute; top: -10%; left: 50%; width: 8vw; height: 120%;
    background: linear-gradient(180deg, rgba(61,231,255,.18), transparent 70%);
    transform-origin: top center;
    animation: oc-ray 6s ease-in-out infinite;
    filter: blur(8px);
  }
  @keyframes oc-ray {
    0%,100% { opacity: .35; transform: translateX(-50%) rotate(-8deg) skewX(-6deg); }
    50% { opacity: .7; transform: translateX(-50%) rotate(8deg) skewX(6deg); }
  }
  #ocean-root .bubble {
    position: absolute; bottom: -6vh; border-radius: 50%;
    border: 1px solid rgba(232,251,255,.55);
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), rgba(61,231,255,.15) 45%, transparent 70%);
    box-shadow: 0 0 10px rgba(61,231,255,.35);
    animation: oc-bubble linear forwards;
  }
  @keyframes oc-bubble {
    0% { transform: translate3d(0,0,0) scale(1); opacity: 0; }
    10% { opacity: .9; }
    100% { transform: translate3d(var(--drift), -115vh, 0) scale(.6); opacity: 0; }
  }
  #ocean-root .fish {
    position: absolute; color: rgba(61,231,255,.55);
    font-size: 18px; text-shadow: 0 0 8px rgba(61,231,255,.5);
    animation: oc-fish linear forwards;
  }
  @keyframes oc-fish {
    0% { transform: translateX(0) scaleX(var(--flip)); opacity: 0; }
    10% { opacity: .7; }
    100% { transform: translateX(var(--swim)) scaleX(var(--flip)); opacity: 0; }
  }
  #ocean-root .spark {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #e8fbff; box-shadow: 0 0 10px 2px rgba(61,231,255,.9);
    animation: oc-spark linear forwards;
  }
  @keyframes oc-spark {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #ocean-root .wave {
    position: absolute; left: 50%; bottom: -80px; transform: translateX(-50%);
    width: 160vw; height: 220px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(61,231,255,.3) 0%, rgba(10,80,120,.2) 40%, transparent 70%);
    animation: oc-wave 2.2s ease-in-out infinite;
  }
  @keyframes oc-wave {
    0%,100% { opacity: .5; transform: translateX(-50%) scaleY(1); }
    50% { opacity: .95; transform: translateX(-50%) scaleY(1.35); }
  }
</style>

<div id="ocean-root">

      <div class="caustic"></div>

      <div class="popup-img-wrap">
        <img class="popup-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEitTh4uT5bosKFSq2k1EuGGy454eYrtFxO416gMJNJi8tIBM9VjWORLeUM7s3VGQoFd16VPLWQ_5Ga_qbruYPNnKvuO_nH4JJLny7-qgtnLn9-RrPsVjxP46uqtNaPhlPuWt29CYTExGVSVYGwq5N7GdhovXZYB2uhOyi1Vt816Dwcinl4sNrXYFd-HscXC=w616-h616" alt="Promo">

        <a class="popup-btn btn-login" href="https://sflink.ink/velosbet77brand">LOGIN</a>

<script>
(function () {
  var root = document.getElementById("ocean-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("oc-close-btn");
  var b2 = document.getElementById("oc-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  function bubble() {
    var el = document.createElement("div");
    el.className = "bubble";
    var s = Math.random() * 18 + 6;
    el.style.width = s + "px"; el.style.height = s + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
    var dur = Math.random() * 3 + 2.5;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000 + 40);
  }
  function fish() {
    var el = document.createElement("div");
    el.className = "fish";
    el.textContent = Math.random() > 0.5 ? "≽" : "≼";
    var fromLeft = Math.random() > 0.5;
    el.style.top = Math.random() * 70 + 10 + "vh";
    el.style.left = fromLeft ? "-5vw" : "105vw";
    el.style.setProperty("--flip", fromLeft ? "1" : "-1");
    el.style.setProperty("--swim", fromLeft ? "110vw" : "-110vw");
    var dur = Math.random() * 4 + 5;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function burst(x, y) {
    for (var i = 0; i < 24; i++) {
      var s = document.createElement("div");
      s.className = "spark";
      var ang = (Math.PI * 2 * i) / 24;
      var dist = Math.random() * 100 + 30;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.6 + 0.45;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  setInterval(function () { bubble(); bubble(); bubble(); }, 120);
  setInterval(fish, 2200);
  function bang() { burst(Math.random()*W*0.8+W*0.1, Math.random()*H*0.5+H*0.2); }
  bang(); setTimeout(bang, 900); setInterval(bang, 2200);
})();
</script>
