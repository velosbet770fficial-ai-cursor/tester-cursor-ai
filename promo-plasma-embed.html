<style>
  #plasma-root {
    --bg: rgba(8, 6, 18, 0.92);
    --line: rgba(255, 120, 220, 0.65);
    --g1: rgba(0, 255, 220, 0.55);
    --g2: rgba(255, 60, 180, 0.45);
    --g3: rgba(255, 210, 80, 0.4);
    --title: #ffe37a;
    --sub: #d8c8ff;
    font-family: Arial, Helvetica, sans-serif;
  }

  #plasma-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(0,0,0,0.72); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    animation: p-in 0.45s ease 1s forwards;
  }
  #plasma-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes p-in { to { opacity: 1; visibility: visible; } }

  #plasma-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }

  #plasma-root .popup-box {
    position: relative; z-index: 2; width: min(360px, 92vw);
    padding: 20px; border-radius: 22px; text-align: center;
    background: var(--bg); border: 1px solid var(--line);
    box-shadow: 0 20px 70px rgba(0,0,0,.65), 0 0 50px var(--g1), 0 0 90px var(--g2);
    overflow: visible;
    animation: box-pop 0.65s cubic-bezier(.22,1.2,.36,1) 1s backwards;
  }
  #plasma-root .popup-box::before {
    content: ""; position: absolute; inset: -42% -22%;
    background: conic-gradient(from 0deg, transparent, var(--g1), transparent, var(--g2), transparent, var(--g3), transparent);
    opacity: .4; animation: spin 6s linear infinite; z-index: 0;
    pointer-events: none; border-radius: 22px;
  }
  #plasma-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 21px;
    background: linear-gradient(165deg, rgba(255,255,255,.08), transparent 40%), var(--bg);
    z-index: 0; pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes box-pop {
    0% { transform: translateY(45px) scale(.85); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #plasma-root .popup-box > * { position: relative; z-index: 1; }

  #plasma-root .corner {
    position: absolute; width: 16px; height: 16px; z-index: 5; pointer-events: none;
    border: 2px solid #7dffe8; box-shadow: 0 0 12px rgba(0,255,220,.7);
  }
  #plasma-root .corner.tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
  #plasma-root .corner.tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; border-color: #ff4fd8; }
  #plasma-root .corner.bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; border-color: #ffd24d; }
  #plasma-root .corner.br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

  #plasma-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #fff;
    background: linear-gradient(145deg, #ff4fd8, #7a1cff);
    color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255,80,200,.7); z-index: 30; padding: 0;
    transition: transform .2s;
  }
  #plasma-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }

  #plasma-root .popup-img-wrap {
    position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(255,180,80,.4);
  }
  #plasma-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.55));
  }
  #plasma-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #plasma-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .1em; text-transform: uppercase;
    color: #1a1200; background: linear-gradient(90deg, #ffe08a, #ff9a1a);
    padding: 6px 10px; border-radius: 8px;
  }
  #plasma-root .popup-title {
    margin: 16px 0 6px; font-size: 26px; font-weight: bold; letter-spacing: 1px;
    color: var(--title); text-shadow: 0 0 20px rgba(255,200,80,.7);
  }
  #plasma-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #plasma-root .popup-buttons { display: flex; gap: 10px; }
  #plasma-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #plasma-root .popup-btn:hover { transform: translateY(-3px); }
  #plasma-root .btn-login {
    background: linear-gradient(160deg, #1a1230, #0a0716); color: #ffe08a;
    border: 1.5px solid #ffe08a; box-shadow: 0 0 14px rgba(255,210,77,.35);
  }
  #plasma-root .btn-daftar {
    background: linear-gradient(145deg, #ffd24d, #ff9a1a); color: #4a2600; border: none;
    box-shadow: 0 0 22px rgba(255,160,30,.55); animation: cta 1.5s ease-in-out infinite;
  }
  @keyframes cta {
    0%,100% { box-shadow: 0 0 14px rgba(255,160,30,.45); }
    50% { box-shadow: 0 0 34px rgba(255,190,50,.95); }
  }

  /* ===== FX LAYER ===== */
  #plasma-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
  }

  #plasma-root .orb {
    position: absolute; border-radius: 50%; filter: blur(1px);
    box-shadow: 0 0 40px currentColor, 0 0 80px currentColor;
    animation: orb-float 4s ease-in-out infinite;
  }
  @keyframes orb-float {
    0%,100% { transform: translateY(0) scale(1); opacity: .75; }
    50% { transform: translateY(-18px) scale(1.15); opacity: 1; }
  }

  #plasma-root .spark {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 8px 2px rgba(255,255,255,.9);
    animation: spark-move linear forwards;
  }
  @keyframes spark-move {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  #plasma-root .streak {
    position: absolute; width: 2px; border-radius: 4px;
    background: linear-gradient(to bottom, transparent, #fff, transparent);
    box-shadow: 0 0 10px rgba(0,255,220,.8);
    animation: streak-fall linear forwards;
  }
  @keyframes streak-fall {
    0% { transform: translate3d(0,0,0) rotate(20deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate3d(-80px, 110vh, 0) rotate(20deg); opacity: 0; }
  }

  #plasma-root .ring {
    position: absolute; border-radius: 50%;
    border: 2px solid rgba(0,255,220,.7);
    box-shadow: 0 0 30px rgba(255,80,200,.45), inset 0 0 20px rgba(0,255,220,.25);
    transform: translate(-50%,-50%) scale(.1); opacity: 0;
    animation: ring-boom .9s ease-out forwards;
  }
  @keyframes ring-boom {
    0% { transform: translate(-50%,-50%) scale(.1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  }

  #plasma-root .wave {
    position: absolute; left: 50%; bottom: -40px; transform: translateX(-50%);
    width: 140vw; height: 220px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(255,80,200,.28) 0%, rgba(0,255,220,.18) 40%, transparent 70%);
    animation: wave 2.4s ease-in-out infinite;
  }
  @keyframes wave {
    0%,100% { opacity: .5; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleY(1.35); }
  }

  #plasma-root .scan {
    position: absolute; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #7dffe8, #ff4fd8, transparent);
    box-shadow: 0 0 20px rgba(0,255,220,.8);
    animation: scan 3.2s linear infinite;
    opacity: .7;
  }
  @keyframes scan {
    0% { top: -5%; }
    100% { top: 105%; }
  }
</style>

<div id="plasma-root">

<script>
(function () {
  var root = document.getElementById("plasma-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });

  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("p-close-btn");
  var b2 = document.getElementById("p-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var COLORS = ["#7dffe8", "#ff4fd8", "#ffd24d", "#7a9dff", "#fff"];

  /* ORB ENERGI */
  function spawnOrbs() {
    for (var i = 0; i < 8; i++) {
      var o = document.createElement("div");
      o.className = "orb";
      var s = Math.random() * 50 + 30;
      o.style.width = s + "px"; o.style.height = s + "px";
      o.style.left = Math.random() * 90 + 5 + "vw";
      o.style.top = Math.random() * 70 + 10 + "vh";
      o.style.color = COLORS[i % COLORS.length];
      o.style.background = "radial-gradient(circle, " + COLORS[i % COLORS.length] + " 0%, transparent 70%)";
      o.style.animationDelay = (Math.random() * 2) + "s";
      o.style.animationDuration = (Math.random() * 2 + 3) + "s";
      fx.appendChild(o);
    }
  }

  /* SPARK LEDAKAN */
  function burst(x, y, n) {
    n = n || 28;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("div");
      s.className = "spark";
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      var dist = (Math.random() * 120 + 40);
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.6 + 0.5;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  /* STREAK JATUH */
  function streak() {
    var el = document.createElement("div");
    el.className = "streak";
    el.style.left = Math.random() * 100 + "vw";
    el.style.top = "-10vh";
    el.style.height = (Math.random() * 80 + 40) + "px";
    el.style.background = "linear-gradient(to bottom, transparent, " + COLORS[Math.floor(Math.random()*COLORS.length)] + ", transparent)";
    var dur = Math.random() * 0.7 + 0.5;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000 + 50);
  }

  /* SHOCKWAVE RING */
  function ring(x, y, big) {
    var r = document.createElement("div");
    r.className = "ring";
    var size = big ? 420 : 220;
    r.style.width = size + "px"; r.style.height = size + "px";
    r.style.left = x + "px"; r.style.top = y + "px";
    r.style.borderColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    fx.appendChild(r);
    burst(x, y, big ? 40 : 22);
    setTimeout(function () { r.remove(); }, 900);
  }

  spawnOrbs();

  /* hujan streak deras */
  setInterval(function () {
    for (var i = 0; i < 4; i++) streak();
  }, 120);

  /* ledakan berkala */
  function boom() {
    var x = Math.random() * W * 0.8 + W * 0.1;
    var y = Math.random() * H * 0.6 + H * 0.1;
    ring(x, y, Math.random() > 0.55);
  }
  boom();
  setTimeout(boom, 600);
  setTimeout(boom, 1200);
  setInterval(boom, 1600);

  /* burst tengah kadang */
  setInterval(function () {
    ring(W / 2, H / 2, true);
  }, 4500);
})();
</script>
