<style>
  #plasma-root {
    --bg: rgba(6, 4, 16, 0.94);
    --title: #ffe37a;
    --sub: #e0d0ff;
    font-family: Arial, Helvetica, sans-serif;
  }
  #plasma-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(0,0,0,.78); backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden;
    animation: p-in .4s ease .9s forwards;
  }
  #plasma-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes p-in { to { opacity: 1; visibility: visible; } }

  #plasma-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #plasma-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 22px; text-align: center;
    background: var(--bg); border: 1px solid rgba(255,120,220,.7);
    box-shadow: 0 0 40px rgba(0,255,220,.45), 0 0 90px rgba(255,60,180,.4), 0 25px 80px rgba(0,0,0,.7);
    overflow: visible;
    animation: box-pop .6s cubic-bezier(.22,1.25,.36,1) .9s backwards;
  }
  #plasma-root .popup-box::before {
    content: ""; position: absolute; inset: -48% -28%;
    background: conic-gradient(from 0deg,#7dffe8,#ff4fd8,#ffd24d,#7a9dff,#7dffe8);
    opacity: .45; animation: spin 4s linear infinite; z-index: 0;
    pointer-events: none; filter: blur(6px);
  }
  #plasma-root .popup-box::after {
    content: ""; position: absolute; inset: 2px; border-radius: 20px;
    background: linear-gradient(165deg, rgba(255,255,255,.1), transparent 40%), var(--bg);
    z-index: 0; pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes box-pop {
    0% { transform: translateY(50px) scale(.8); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #plasma-root .popup-box > * { position: relative; z-index: 1; }

  #plasma-root .corner {
    position: absolute; width: 18px; height: 18px; z-index: 5; pointer-events: none;
    border: 2px solid #7dffe8; box-shadow: 0 0 14px rgba(0,255,220,.9);
    animation: corner-pulse 1.4s ease-in-out infinite;
  }
  #plasma-root .corner.tl { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
  #plasma-root .corner.tr { top: 8px; right: 8px; border-left: 0; border-bottom: 0; border-color: #ff4fd8; animation-delay: .2s; }
  #plasma-root .corner.bl { bottom: 8px; left: 8px; border-right: 0; border-top: 0; border-color: #ffd24d; animation-delay: .4s; }
  #plasma-root .corner.br { bottom: 8px; right: 8px; border-left: 0; border-top: 0; animation-delay: .6s; }
  @keyframes corner-pulse {
    0%,100% { opacity: .5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  #plasma-root .popup-close {
    position: absolute; top: -18px; right: -18px; width: 52px; height: 52px;
    border-radius: 50%; border: 2px solid #fff;
    background: linear-gradient(145deg, #ff4fd8, #7a1cff);
    color: #fff; font-size: 26px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 28px rgba(255,80,200,.9); z-index: 30; padding: 0;
    transition: transform .2s;
  }
  #plasma-root .popup-close:hover { transform: scale(1.15) rotate(90deg); }

  #plasma-root .popup-img-wrap {
    position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(255,180,80,.5);
    box-shadow: 0 0 30px rgba(255,80,200,.25);
  }
  #plasma-root .popup-img-wrap::before {
    content: ""; position: absolute; inset: -50%; z-index: 1; pointer-events: none;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.25) 50%, transparent 60%);
    animation: shine 2.8s ease-in-out infinite;
  }
  #plasma-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.55));
  }
  @keyframes shine {
    0% { transform: translateX(-40%) rotate(20deg); }
    100% { transform: translateX(40%) rotate(20deg); }
  }
  #plasma-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #plasma-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .12em; text-transform: uppercase;
    color: #1a1200; background: linear-gradient(90deg, #ffe08a, #ff9a1a);
    padding: 6px 10px; border-radius: 8px;
    animation: badge-glow 1.4s ease-in-out infinite;
  }
  @keyframes badge-glow {
    0%,100% { box-shadow: 0 0 8px rgba(255,180,40,.4); }
    50% { box-shadow: 0 0 22px rgba(255,180,40,1); }
  }
  #plasma-root .popup-title {
    margin: 16px 0 6px; font-size: 28px; font-weight: bold; letter-spacing: 1px;
    color: var(--title); text-shadow: 0 0 18px rgba(255,200,80,.85), 0 0 40px rgba(255,80,200,.4);
    animation: title-pulse 1.8s ease-in-out infinite;
  }
  @keyframes title-pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  #plasma-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #plasma-root .popup-buttons { display: flex; gap: 10px; }
  #plasma-root .popup-btn {
    flex: 1; padding: 14px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #plasma-root .popup-btn:hover { transform: translateY(-3px) scale(1.03); }
  #plasma-root .btn-login {
    background: linear-gradient(160deg, #1a1230, #0a0716); color: #ffe08a;
    border: 1.5px solid #ffe08a; box-shadow: 0 0 18px rgba(255,210,77,.45);
  }
  #plasma-root .btn-daftar {
    background: linear-gradient(145deg, #ffd24d, #ff9a1a); color: #4a2600; border: none;
    animation: cta 1.2s ease-in-out infinite;
  }
  @keyframes cta {
    0%,100% { box-shadow: 0 0 14px rgba(255,160,30,.5); transform: scale(1); }
    50% { box-shadow: 0 0 40px rgba(255,190,50,1); transform: scale(1.04); }
  }

  #plasma-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
  }
  #plasma-root .orb {
    position: absolute; border-radius: 50%;
    box-shadow: 0 0 50px currentColor, 0 0 100px currentColor;
    animation: orb-float 3s ease-in-out infinite;
  }
  @keyframes orb-float {
    0%,100% { transform: translateY(0) scale(1); opacity: .7; }
    50% { transform: translateY(-28px) scale(1.25); opacity: 1; }
  }
  #plasma-root .spark {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px 3px rgba(255,255,255,1);
    animation: spark-move linear forwards;
  }
  @keyframes spark-move {
    0% { transform: translate(0,0) scale(1.3); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #plasma-root .streak {
    position: absolute; width: 3px; border-radius: 5px;
    animation: streak-fall linear forwards;
  }
  @keyframes streak-fall {
    0% { transform: translate3d(0,0,0) rotate(22deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate3d(-100px, 120vh, 0) rotate(22deg); opacity: 0; }
  }
  #plasma-root .ring {
    position: absolute; border-radius: 50%;
    border: 3px solid #7dffe8;
    box-shadow: 0 0 40px rgba(255,80,200,.6), inset 0 0 30px rgba(0,255,220,.35);
    transform: translate(-50%,-50%) scale(.08); opacity: 0;
    animation: ring-boom .85s ease-out forwards;
  }
  @keyframes ring-boom {
    0% { transform: translate(-50%,-50%) scale(.08); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  }
  #plasma-root .flash {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), rgba(255,80,200,.2) 40%, transparent 70%);
  }
  @keyframes flash-bang {
    0% { opacity: 0; } 10% { opacity: .9; } 25% { opacity: .15; }
    40% { opacity: .7; } 100% { opacity: 0; }
  }
  #plasma-root .wave {
    position: absolute; left: 50%; bottom: -60px; transform: translateX(-50%);
    width: 160vw; height: 280px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(255,80,200,.4) 0%, rgba(0,255,220,.25) 35%, transparent 70%);
    animation: wave 1.8s ease-in-out infinite;
  }
  @keyframes wave {
    0%,100% { opacity: .55; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleY(1.45); }
  }
  #plasma-root .scan {
    position: absolute; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, transparent, #7dffe8, #ff4fd8, #ffd24d, transparent);
    box-shadow: 0 0 28px rgba(0,255,220,1); opacity: .85;
    animation: scan 2.2s linear infinite;
  }
  @keyframes scan { 0% { top: -8%; } 100% { top: 108%; } }
  #plasma-root .hex {
    position: absolute; width: 40px; height: 40px;
    border: 1px solid rgba(125,255,232,.45);
    transform: rotate(45deg);
    box-shadow: 0 0 16px rgba(125,255,232,.35);
    animation: hex-fade 2.5s ease-out forwards;
  }
  @keyframes hex-fade {
    0% { opacity: 0; transform: rotate(45deg) scale(.4); }
    30% { opacity: .9; }
    100% { opacity: 0; transform: rotate(45deg) scale(1.6) translateY(-40px); }
  }
  #plasma-root.shake #fx { animation: quake .3s linear; }
  @keyframes quake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-4px, 2px); }
    50% { transform: translate(4px, -3px); }
    75% { transform: translate(-2px, 2px); }
  }
</style>

<div id="plasma-root">
  <div id="popup-overlay">

    <div class="popup-box">
      <span class="corner tl"></span><span class="corner tr"></span>

<script>
(function () {
  var root = document.getElementById("plasma-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var flash = document.getElementById("p-flash");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });

  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("p-close-btn");
  var b2 = document.getElementById("p-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  var COLORS = ["#7dffe8", "#ff4fd8", "#ffd24d", "#7a9dff", "#fff", "#ff6b3d"];

  function spawnOrbs() {
    for (var i = 0; i < 14; i++) {
      var o = document.createElement("div"); o.className = "orb";
      var s = Math.random() * 70 + 35;
      o.style.width = s + "px"; o.style.height = s + "px";
      o.style.left = Math.random() * 92 + 2 + "vw";
      o.style.top = Math.random() * 75 + 5 + "vh";
      var c = COLORS[i % COLORS.length];
      o.style.color = c;
      o.style.background = "radial-gradient(circle, " + c + " 0%, transparent 70%)";
      o.style.animationDelay = (Math.random() * 2) + "s";
      o.style.animationDuration = (Math.random() * 1.5 + 2.2) + "s";
      fx.appendChild(o);
    }
  }

  function burst(x, y, n) {
    n = n || 45;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("div"); s.className = "spark";
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      var dist = Math.random() * 180 + 50;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      s.style.width = (Math.random() * 4 + 2) + "px";
      s.style.height = s.style.width;
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.7 + 0.45;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  function streak() {
    var el = document.createElement("div"); el.className = "streak";
    var c = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.style.left = Math.random() * 110 - 5 + "vw";
    el.style.top = "-12vh";
    el.style.height = (Math.random() * 100 + 50) + "px";
    el.style.background = "linear-gradient(to bottom, transparent, " + c + ", transparent)";
    el.style.boxShadow = "0 0 12px " + c;
    var dur = Math.random() * 0.45 + 0.35;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000 + 40);
  }

  function hex() {
    var h = document.createElement("div"); h.className = "hex";
    h.style.left = Math.random() * 90 + 5 + "vw";
    h.style.top = Math.random() * 70 + 10 + "vh";
    h.style.borderColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    fx.appendChild(h);
    setTimeout(function () { h.remove(); }, 2500);
  }

  function ring(x, y, big) {
    var r = document.createElement("div"); r.className = "ring";
    var size = big ? 520 : 280;
    r.style.width = size + "px"; r.style.height = size + "px";
    r.style.left = x + "px"; r.style.top = y + "px";
    r.style.borderColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    fx.appendChild(r);
    burst(x, y, big ? 55 : 32);
    setTimeout(function () { r.remove(); }, 850);
  }

  function bang(big) {
    if (flash) {
      flash.style.animation = "none";
      void flash.offsetWidth;
      flash.style.animation = "flash-bang .55s ease-out forwards";
    }
    root.classList.remove("shake");
    void root.offsetWidth;
    root.classList.add("shake");
    var x = Math.random() * W * 0.8 + W * 0.1;
    var y = Math.random() * H * 0.55 + H * 0.1;
    ring(x, y, big);
    if (big) {
      setTimeout(function () { ring(x + 40, y - 30, false); }, 80);
      setTimeout(function () { ring(x - 50, y + 20, false); }, 140);
    }
  }

  spawnOrbs();

  /* hujan streak SANGAT deras */
  setInterval(function () {
    for (var i = 0; i < 8; i++) streak();
  }, 80);

  /* hex floating */
  setInterval(hex, 400);

  /* ledakan terus */
  bang(true);
  setTimeout(function () { bang(true); }, 500);
  setTimeout(function () { bang(false); }, 900);
  setInterval(function () { bang(Math.random() > 0.4); }, 1100);

  /* mega center boom */
  setInterval(function () {
    if (flash) {
      flash.style.animation = "none";
      void flash.offsetWidth;
      flash.style.animation = "flash-bang .7s ease-out forwards";
    }
    root.classList.remove("shake"); void root.offsetWidth; root.classList.add("shake");
    ring(W / 2, H / 2, true);
    setTimeout(function () { ring(W * 0.3, H * 0.4, true); }, 100);
    setTimeout(function () { ring(W * 0.7, H * 0.35, true); }, 180);
  }, 3200);
})();
</script>
