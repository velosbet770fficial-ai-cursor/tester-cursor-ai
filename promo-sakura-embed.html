<!--
  DROP-IN: Popup + SAKURA (kelopak bunga) — bisa ditutup
-->
<style>
  #sakura-root {
    --bg: rgba(28, 10, 18, 0.95);
    --pink: #ff8fb8;
    --rose: #ff4d8d;
    --cream: #fff0f5;
    --sub: #f5c4d4;
    font-family: Georgia, "Times New Roman", serif;
  }
  #sakura-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(18, 4, 10, .78); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    animation: sk-in .45s ease 1s forwards;
  }
  #sakura-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes sk-in { to { opacity: 1; visibility: visible; } }
  #sakura-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #sakura-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 20px; text-align: center;
    background: linear-gradient(165deg, #3a1524 0%, #1a0810 55%, #2e101c 100%);
    border: 1.5px solid rgba(255, 143, 184, .7);
    box-shadow:
      0 0 0 1px rgba(255,240,245,.1) inset,
      0 0 40px rgba(255,77,141,.35),
      0 25px 70px rgba(0,0,0,.65);
    overflow: visible;
    animation: sk-pop .65s cubic-bezier(.22,1.2,.36,1) 1s backwards;
  }
  #sakura-root .popup-box::before {
    content: ""; position: absolute; inset: -2px; border-radius: 22px; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,143,184,.5), transparent 40%, rgba(255,77,141,.35));
    opacity: .55; filter: blur(8px);
  }
  #sakura-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 19px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 80% 0%, rgba(255,143,184,.18), transparent 40%),
      linear-gradient(180deg, rgba(255,240,245,.06), transparent 40%),
      var(--bg);
  }
  @keyframes sk-pop {
    0% { transform: translateY(40px) scale(.88); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #sakura-root .popup-box > * { position: relative; z-index: 1; }
  #sakura-root .softglow {
    position: absolute; inset: 0; border-radius: 20px; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,77,141,.2), transparent 55%);
    animation: sk-glow 2s ease-in-out infinite;
  }
  @keyframes sk-glow {
    0%,100% { opacity: .4; }
    50% { opacity: .85; }
  }
  #sakura-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #fff0f5;
    background: linear-gradient(145deg, #ff8fb8, #ff4d8d);
    color: #2a0814; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255,77,141,.75); z-index: 30; padding: 0;
    font-family: Arial, sans-serif; transition: transform .2s;
  }
  #sakura-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }
  #sakura-root .popup-img-wrap {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(255,143,184,.5);
    box-shadow: 0 0 24px rgba(255,77,141,.28);
  }
  #sakura-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,143,184,.12), transparent 30%, rgba(30,8,16,.55));
  }
  #sakura-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #sakura-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-family: Arial, sans-serif; font-size: 11px; font-weight: bold;
    letter-spacing: .12em; text-transform: uppercase;
    color: #2a0814; background: linear-gradient(90deg, #fff0f5, #ff8fb8);
    padding: 6px 10px; border-radius: 8px; box-shadow: 0 0 14px rgba(255,77,141,.55);
  }
  #sakura-root .popup-title {
    margin: 16px 0 6px; font-size: 27px; font-weight: bold; letter-spacing: 1px;
    color: var(--cream); text-shadow: 0 0 18px rgba(255,77,141,.7), 0 2px 0 #5a1830;
  }
  #sakura-root .popup-sub {
    margin: 0 0 16px; font-family: Arial, sans-serif; font-size: 13px; color: var(--sub);
  }
  #sakura-root .popup-buttons { display: flex; gap: 10px; font-family: Arial, sans-serif; }
  #sakura-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #sakura-root .popup-btn:hover { transform: translateY(-3px); }
  #sakura-root .btn-login {
    background: #1a0810; color: var(--pink); border: 1.5px solid var(--rose);
    box-shadow: 0 0 14px rgba(255,77,141,.3);
  }
  #sakura-root .btn-daftar {
    background: linear-gradient(145deg, #fff0f5, #ff4d8d); color: #2a0814; border: none;
    box-shadow: 0 0 22px rgba(255,77,141,.55); animation: sk-cta 1.5s ease-in-out infinite;
  }
  @keyframes sk-cta {
    0%,100% { box-shadow: 0 0 14px rgba(255,77,141,.4); }
    50% { box-shadow: 0 0 32px rgba(255,143,184,.95); }
  }

  #sakura-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,120,160,.22), transparent 50%),
      linear-gradient(180deg, #2a1018 0%, #14080e 50%, #1a0a12 100%);
  }
  #sakura-root .petal {
    position: absolute; top: -8vh;
    width: 14px; height: 14px;
    background: radial-gradient(ellipse at 30% 30%, #fff0f5, #ff8fb8 55%, #ff4d8d);
    border-radius: 12px 1px 12px 1px;
    box-shadow: 0 0 8px rgba(255,143,184,.6);
    animation: sk-fall linear forwards;
  }
  @keyframes sk-fall {
    0% { transform: translate3d(0,0,0) rotate(0) scale(1); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate3d(var(--drift), 115vh, 0) rotate(var(--spin)); opacity: .55; }
  }
  #sakura-root .dot {
    position: absolute; top: -4vh; border-radius: 50%;
    background: #ffc0d4; box-shadow: 0 0 8px rgba(255,143,184,.8);
    animation: sk-dot linear forwards;
  }
  @keyframes sk-dot {
    0% { transform: translate(0,0); opacity: 1; }
    100% { transform: translate(var(--dx), 100vh); opacity: 0; }
  }
  #sakura-root .bloom {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #fff0f5; box-shadow: 0 0 12px 3px rgba(255,77,141,.9);
    animation: sk-bloom linear forwards;
  }
  @keyframes sk-bloom {
    0% { transform: translate(0,0) scale(1.2); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #sakura-root .mist {
    position: absolute; top: -30px; left: 0; width: 100%; height: 180px;
    background: linear-gradient(180deg, rgba(255,180,200,.2), transparent);
    animation: sk-mist 4s ease-in-out infinite alternate;
  }
  @keyframes sk-mist {
    from { opacity: .4; }
    to { opacity: .85; }
  }
  #sakura-root .glowfloor {
    position: absolute; left: 50%; bottom: -90px; transform: translateX(-50%);
    width: 160vw; height: 240px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(255,77,141,.35) 0%, rgba(255,143,184,.15) 40%, transparent 70%);
    animation: sk-floor 2.4s ease-in-out infinite;
  }
  @keyframes sk-floor {
    0%,100% { opacity: .5; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleY(1.3); }
  }
</style>

<div id="sakura-root">

      <button type="button" class="popup-close" id="sk-close-btn" aria-label="Tutup">✕</button>
      <div class="popup-img-wrap">
        <img class="popup-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEitTh4uT5bosKFSq2k1EuGGy454eYrtFxO416gMJNJi8tIBM9VjWORLeUM7s3VGQoFd16VPLWQ_5Ga_qbruYPNnKvuO_nH4JJLny7-qgtnLn9-RrPsVjxP46uqtNaPhlPuWt29CYTExGVSVYGwq5N7GdhovXZYB2uhOyi1Vt816Dwcinl4sNrXYFd-HscXC=w616-h616" alt="Promo">

        <a class="popup-btn btn-login" href="https://sflink.ink/velosbet77brand">LOGIN</a>

<script>
(function () {
  var root = document.getElementById("sakura-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("sk-close-btn");
  var b2 = document.getElementById("sk-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  function petal() {
    var el = document.createElement("div");
    el.className = "petal";
    var s = Math.random() * 10 + 10;
    el.style.width = s + "px"; el.style.height = s + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.setProperty("--drift", (Math.random() * 140 - 40) + "px");
    el.style.setProperty("--spin", (Math.random() * 400 + 200) + "deg");
    var dur = Math.random() * 3 + 3;
    el.style.animationDuration = dur + "s";
    if (Math.random() > 0.5) {
      el.style.background = "radial-gradient(ellipse at 30% 30%, #fff, #ffb0cc 55%, #ff6aa0)";
    }
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000 + 40);
  }
  function dot() {
    var el = document.createElement("div");
    el.className = "dot";
    var s = Math.random() * 3 + 2;
    el.style.width = s + "px"; el.style.height = s + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.setProperty("--dx", (Math.random() * 40 - 20) + "px");
    var dur = Math.random() * 2.5 + 2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function bloom(x, y) {
    for (var i = 0; i < 28; i++) {
      var s = document.createElement("div");
      s.className = "bloom";
      var ang = (Math.PI * 2 * i) / 28;
      var dist = Math.random() * 120 + 40;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.6 + 0.5;
      s.style.animationDuration = dur + "s";
      if (i % 2 === 0) s.style.background = "#ff4d8d";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  setInterval(function () { petal(); petal(); dot(); }, 100);
  function bang() { bloom(Math.random()*W*0.8+W*0.1, Math.random()*H*0.45+H*0.15); }
  bang(); setTimeout(bang, 800); setInterval(bang, 2000);
  setInterval(function () { bloom(W/2, H*0.35); }, 4200);
})();
</script>
