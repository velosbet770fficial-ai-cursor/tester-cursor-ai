<style>
  #storm-root {
    --bg-card: rgba(8, 12, 24, 0.88);
    --stroke: rgba(120, 200, 255, 0.55);
    --glow: rgba(80, 180, 255, 0.4);
    --glow-soft: rgba(160, 100, 255, 0.22);
    --title: #b8e7ff;
    --sub: #c9d4e8;
    --btn-login-bg: linear-gradient(160deg, #10182a, #070c16);
    --btn-login-fg: #9fd9ff;
    --btn-login-border: #7ec8ff;
    --btn-daftar-bg: linear-gradient(145deg, #6ec8ff, #3a7dff);
    --btn-daftar-fg: #041022;
    --close-bg: linear-gradient(145deg, #5aa8ff, #2a4fd8);
    font-family: Arial, Helvetica, sans-serif;
  }

  #storm-root #popup-state {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  #storm-root #popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(2, 6, 16, 0.72);
    backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    animation: storm-appear 0.55s ease 1.2s forwards;
    box-sizing: border-box;
  }
  @keyframes storm-appear {
    to { opacity: 1; visibility: visible; }
  }
  #storm-root #popup-state:checked ~ #popup-overlay,
  #storm-root #popup-overlay.is-closed {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
    animation: none !important;
  }

  #storm-root .popup-backdrop {
    position: absolute;
    inset: 0;
    margin: 0;
    cursor: pointer;
    z-index: 0;
  }

  #storm-root .popup-box {
    position: relative;
    z-index: 1;
    width: min(360px, 92vw);
    padding: 20px;
    border-radius: 22px;
    text-align: center;
    background: var(--bg-card);
    border: 1px solid var(--stroke);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.55),
      0 0 50px var(--glow),
      0 0 90px var(--glow-soft);
    overflow: visible;
    animation: storm-in 0.65s cubic-bezier(0.22, 1.2, 0.36, 1) 1.2s backwards;
    box-sizing: border-box;
  }
  #storm-root .popup-box::before {
    content: "";
    position: absolute;
    inset: -35% -15%;
    background: conic-gradient(from 120deg, transparent, var(--glow), transparent, var(--glow-soft), transparent);
    opacity: 0.3;
    animation: storm-rim 9s linear infinite;
    z-index: 0;
    pointer-events: none;
    border-radius: 22px;
  }
  #storm-root .popup-box::after {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 21px;
    background: linear-gradient(180deg, rgba(140,200,255,0.08), transparent 40%), var(--bg-card);
    z-index: 0;
    pointer-events: none;
  }
  @keyframes storm-rim { to { transform: rotate(360deg); } }
  @keyframes storm-in {
    0%   { transform: translateY(36px) scale(0.9); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  #storm-root .popup-box > * { position: relative; z-index: 1; }

  /* Pernak-pernik sudut */
  #storm-root .ornament {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(140, 210, 255, 0.7);
    z-index: 4;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(100, 180, 255, 0.5);
  }
  #storm-root .ornament.tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; border-radius: 4px 0 0 0; }
  #storm-root .ornament.tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; border-radius: 0 4px 0 0; }
  #storm-root .ornament.bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; border-radius: 0 0 0 4px; }
  #storm-root .ornament.br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; border-radius: 0 0 4px 0; }

  #storm-root .sparkle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #dff4ff;
    box-shadow: 0 0 8px 2px rgba(150, 220, 255, 0.9);
    z-index: 4;
    pointer-events: none;
    animation: sparkle-twinkle 2.2s ease-in-out infinite;
  }
  #storm-root .sparkle.s1 { top: 28px; left: 34px; animation-delay: 0s; }
  #storm-root .sparkle.s2 { top: 42px; right: 38px; animation-delay: 0.6s; }
  #storm-root .sparkle.s3 { bottom: 58px; left: 28px; animation-delay: 1.1s; }
  @keyframes sparkle-twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.25); }
  }

  #storm-root .popup-close {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--close-bg);
    border: 2px solid rgba(220, 240, 255, 0.65);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    line-height: 40px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 18px var(--glow);
    transition: transform 0.2s;
    user-select: none;
    z-index: 10;
  }
  #storm-root .popup-close:hover,
  #storm-root .popup-close:active { transform: scale(1.1) rotate(90deg); }

  #storm-root .popup-img-wrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(140, 210, 255, 0.35);
  }
  #storm-root .popup-img-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,10,30,0.55));
    pointer-events: none;
  }
  #storm-root .popup-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #storm-root .popup-badge {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 2;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #041022;
    background: linear-gradient(90deg, #9fd9ff, #6a9dff);
    padding: 6px 10px;
    border-radius: 8px;
  }

  #storm-root .popup-title {
    margin: 18px 0 6px;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 1px;
    color: var(--title);
    text-shadow: 0 0 20px var(--glow);
  }
  #storm-root .popup-sub {
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--sub);
  }
  #storm-root .popup-buttons {
    display: flex;
    gap: 10px;
  }
  #storm-root .popup-btn {
    flex: 1;
    padding: 13px 0;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    text-decoration: none;
    text-align: center;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #storm-root .popup-btn:hover { transform: translateY(-3px); }
  #storm-root .btn-login {
    background: var(--btn-login-bg);
    color: var(--btn-login-fg);
    border: 1.5px solid var(--btn-login-border);
    box-shadow: 0 0 14px var(--glow);
  }
  #storm-root .btn-daftar {
    background: var(--btn-daftar-bg);
    color: var(--btn-daftar-fg);
    border: none;
    box-shadow: 0 0 22px var(--glow);
    animation: storm-cta 1.8s ease-in-out infinite;
  }
  @keyframes storm-cta {
    0%, 100% { box-shadow: 0 0 14px var(--glow); }
    50% { box-shadow: 0 0 28px var(--glow); }
  }

  /* ===== STORM LAYER ===== */
  #storm-root #storm-canvas {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 999999 !important;
    pointer-events: none !important;
    overflow: hidden !important;
  }

  #storm-root .raindrop {
    position: absolute;
    top: -10vh;
    width: 2px;
    border-radius: 2px;
    background: linear-gradient(to bottom, transparent, rgba(180, 220, 255, 0.85));
    animation: rain-fall linear infinite;
  }
  @keyframes rain-fall {
    to { transform: translateY(115vh) translateX(-20px); }
  }

  #storm-root .lightning-bolt {
    position: absolute;
    width: 3px;
    background: linear-gradient(180deg, #fff, #9fd9ff, transparent);
    box-shadow: 0 0 12px 3px rgba(180, 230, 255, 0.9), 0 0 30px 8px rgba(80, 160, 255, 0.45);
    opacity: 0;
    transform-origin: top center;
    border-radius: 2px;
  }
  @keyframes bolt-flash {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    20%  { opacity: 0.2; }
    30%  { opacity: 1; }
    100% { opacity: 0; }
  }

  #storm-root .flash-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 20%, rgba(220,240,255,0.55), rgba(80,140,255,0.12) 40%, transparent 70%);
    opacity: 0;
    pointer-events: none;
  }
  @keyframes sky-flash {
    0%   { opacity: 0; }
    8%   { opacity: 0.85; }
    16%  { opacity: 0.15; }
    24%  { opacity: 0.7; }
    100% { opacity: 0; }
  }

  #storm-root .storm-glow {
    position: absolute;
    bottom: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 140vw;
    height: 220px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(60, 120, 255, 0.28) 0%,
      rgba(100, 80, 200, 0.12) 45%,
      transparent 75%);
    animation: storm-pulse 2.8s ease-in-out infinite;
  }
  @keyframes storm-pulse {
    0%, 100% { opacity: 0.5; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleY(1.2); }
  }

  #storm-root .cloud-mist {
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    height: 180px;
    background: linear-gradient(180deg, rgba(10, 20, 40, 0.55), transparent);
    animation: mist-drift 6s ease-in-out infinite alternate;
  }
  @keyframes mist-drift {
    from { opacity: 0.45; }
    to { opacity: 0.8; }
  }
</style>

      <span class="ornament tl"></span>

<script>
(function () {
  var root = document.getElementById("storm-root");
  if (!root) return;

  /* ===== CLOSE POPUP (CSS + JS fallback) ===== */
  var state = root.querySelector("#popup-state");
  var overlay = root.querySelector("#popup-overlay");
  function closePopup() {
    if (state) state.checked = true;
    if (overlay) overlay.classList.add("is-closed");
  }
  root.querySelectorAll('label[for="popup-state"]').forEach(function (el) {
    el.addEventListener("click", function (e) {
      e.preventDefault();
      closePopup();
    });
  });

  /* ===== HUJAN ===== */
  var canvas = root.querySelector("#storm-canvas");
  var flash = root.querySelector("#storm-flash");
  var W = window.innerWidth;
  window.addEventListener("resize", function () { W = window.innerWidth; });

  function spawnRain() {
    var n = Math.min(70, Math.floor(W / 18));
    for (var i = 0; i < n; i++) {
      var d = document.createElement("div");
      d.className = "raindrop";
      var left = Math.random() * 100;
      var h = Math.random() * 18 + 10;
      var dur = Math.random() * 0.55 + 0.45;
      var delay = Math.random() * 2;
      d.style.left = left + "vw";
      d.style.height = h + "px";
      d.style.opacity = (Math.random() * 0.5 + 0.35).toFixed(2);
      d.style.animationDuration = dur + "s";
      d.style.animationDelay = delay + "s";
      canvas.appendChild(d);
    }
  }

  /* ===== PETIR ===== */
  function spawnBolt() {
    var bolt = document.createElement("div");
    bolt.className = "lightning-bolt";
    var left = Math.random() * 80 + 10;
    var h = Math.random() * 35 + 25;
    var skew = (Math.random() * 24 - 12).toFixed(1);
    bolt.style.left = left + "vw";
    bolt.style.top = "-2vh";
    bolt.style.height = h + "vh";
    bolt.style.transform = "skewX(" + skew + "deg)";
    bolt.style.animation = "bolt-flash 0.55s ease-out forwards";
    canvas.appendChild(bolt);
    setTimeout(function () { bolt.remove(); }, 600);
  }

  function thunder() {
    if (flash) {
      flash.style.animation = "none";
      void flash.offsetWidth;
      flash.style.animation = "sky-flash 0.7s ease-out forwards";
    }
    spawnBolt();
    if (Math.random() > 0.4) {
      setTimeout(spawnBolt, 80);
    }
    if (Math.random() > 0.65) {
      setTimeout(spawnBolt, 160);
    }
  }

  spawnRain();
  thunder();
  setTimeout(thunder, 900);

  setInterval(function () {
    if (Math.random() > 0.35) thunder();
  }, 2800);
})();
</script>
