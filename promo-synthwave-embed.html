<style>
  #sw-root {
    --bg: rgba(12, 4, 24, 0.96);
    --pink: #ff2bd6;
    --cyan: #00f0ff;
    --sun: #ff8a3d;
    --sub: #e8c8ff;
    font-family: Arial, Helvetica, sans-serif;
  }
  #sw-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(6, 0, 16, .82); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    animation: sw-in .45s ease 1s forwards;
  }
  #sw-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes sw-in { to { opacity: 1; visibility: visible; } }
  #sw-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #sw-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 16px; text-align: center;
    background: linear-gradient(165deg, #1a0830 0%, #0a0414 55%, #180828 100%);
    border: 1.5px solid rgba(255, 43, 214, .7);
    box-shadow:
      0 0 0 1px rgba(0,240,255,.15) inset,
      0 0 36px rgba(255,43,214,.4),
      0 0 80px rgba(0,240,255,.18),
      0 25px 70px rgba(0,0,0,.7);
    overflow: visible;
    animation: sw-pop .65s cubic-bezier(.22,1.2,.36,1) 1s backwards;
  }
  #sw-root .popup-box::before {
    content: ""; position: absolute; inset: -2px; border-radius: 18px; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,43,214,.5), transparent 40%, rgba(0,240,255,.4));
    opacity: .55; filter: blur(8px);
  }
  #sw-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 15px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,138,61,.18), transparent 45%),
      linear-gradient(180deg, rgba(255,43,214,.08), transparent 40%),
      var(--bg);
  }
  @keyframes sw-pop {
    0% { transform: translateY(40px) scale(.88); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #sw-root .popup-box > * { position: relative; z-index: 1; }
  #sw-root .chrome {
    position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 3;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.08) 50%, transparent 60%);
    background-size: 200% 100%;
    animation: sw-chrome 3.2s linear infinite;
  }
  @keyframes sw-chrome {
    from { background-position: 100% 0; }
    to { background-position: -100% 0; }
  }
  #sw-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #00f0ff;
    background: linear-gradient(145deg, #ff2bd6, #7a00ff);
    color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255,43,214,.8); z-index: 30; padding: 0;
    transition: transform .2s;
  }
  #sw-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }
  #sw-root .popup-img-wrap {
    position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(0,240,255,.5);
    box-shadow: 0 0 24px rgba(255,43,214,.3);
  }
  #sw-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,43,214,.12), transparent 30%, rgba(10,0,24,.55));
  }
  #sw-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #sw-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .14em; text-transform: uppercase;
    color: #120018; background: linear-gradient(90deg, #00f0ff, #ff2bd6);
    padding: 6px 10px; border-radius: 6px; box-shadow: 0 0 14px rgba(255,43,214,.55);
  }
  #sw-root .popup-title {
    margin: 16px 0 6px; font-size: 27px; font-weight: bold; letter-spacing: 1px;
    color: #fff;
    text-shadow:
      0 0 10px rgba(255,43,214,.9),
      0 0 24px rgba(0,240,255,.55),
      2px 0 #ff2bd6, -2px 0 #00f0ff;
  }
  #sw-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #sw-root .popup-buttons { display: flex; gap: 10px; }
  #sw-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 10px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #sw-root .popup-btn:hover { transform: translateY(-3px); }
  #sw-root .btn-login {
    background: #120018; color: var(--cyan); border: 1.5px solid var(--cyan);
    box-shadow: 0 0 14px rgba(0,240,255,.35);
  }
  #sw-root .btn-daftar {
    background: linear-gradient(145deg, #ff6ad8, #ff2bd6 40%, #7a00ff); color: #fff; border: none;
    box-shadow: 0 0 22px rgba(255,43,214,.6); animation: sw-cta 1.4s ease-in-out infinite;
  }
  @keyframes sw-cta {
    0%,100% { box-shadow: 0 0 14px rgba(255,43,214,.45); }
    50% { box-shadow: 0 0 34px rgba(0,240,255,.85), 0 0 40px rgba(255,43,214,.7); }
  }

  #sw-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(255,100,40,.28) 0%, transparent 40%),
      linear-gradient(180deg, #0a0018 0%, #1a0640 42%, #2a0850 55%, #0a0414 55%, #05020c 100%);
  }
  #sw-root .sun {
    position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%);
    width: min(42vw, 280px); height: min(42vw, 280px); border-radius: 50%;
    background: linear-gradient(180deg, #ffef9a 0%, #ff8a3d 45%, #ff2bd6 100%);
    box-shadow: 0 0 60px rgba(255,138,61,.7), 0 0 120px rgba(255,43,214,.4);
    animation: sw-sun 3s ease-in-out infinite;
  }
  #sw-root .sun::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: repeating-linear-gradient(
      180deg,
      transparent 0 10px,
      rgba(10,0,24,.35) 10px 14px
    );
    clip-path: inset(48% 0 0 0);
  }
  @keyframes sw-sun {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.15); }
  }
  #sw-root .horizon {
    position: absolute; left: 0; top: 55%; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #ff2bd6, #00f0ff, #ff2bd6, transparent);
    box-shadow: 0 0 20px #ff2bd6, 0 0 40px #00f0ff;
    opacity: .9;
  }
  #sw-root .grid {
    position: absolute; left: 50%; top: 55%; transform: translateX(-50%);
    width: 200vw; height: 50vh;
    background:
      linear-gradient(90deg, rgba(255,43,214,.55) 1px, transparent 1px),
      linear-gradient(0deg, rgba(0,240,255,.45) 1px, transparent 1px);
    background-size: 60px 40px;
    transform-origin: top center;
    transform: translateX(-50%) perspective(400px) rotateX(65deg);
    animation: sw-grid 1.2s linear infinite;
    mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent 85%);
  }
  @keyframes sw-grid {
    from { background-position: 0 0; }
    to { background-position: 0 40px; }
  }
  #sw-root .star {
    position: absolute; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px #fff, 0 0 12px #00f0ff;
    animation: sw-twinkle ease-in-out infinite;
  }
  @keyframes sw-twinkle {
    0%,100% { opacity: .3; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  #sw-root .streak {
    position: absolute; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #00f0ff, #ff2bd6, transparent);
    box-shadow: 0 0 10px #ff2bd6;
    animation: sw-streak linear forwards;
  }
  @keyframes sw-streak {
    0% { transform: translateX(-20vw); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateX(120vw); opacity: 0; }
  }
  #sw-root .orb {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ff2bd6 40%, transparent 70%);
    box-shadow: 0 0 16px #ff2bd6;
    animation: sw-orb linear forwards;
  }
  @keyframes sw-orb {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #sw-root .scan {
    position: absolute; left: 0; width: 100%; height: 80px;
    background: linear-gradient(180deg, transparent, rgba(0,240,255,.12), transparent);
    animation: sw-scan 4s linear infinite;
  }
  @keyframes sw-scan {
    from { top: -80px; }
    to { top: 100%; }
  }
</style>

<script>
(function () {
  var root = document.getElementById("sw-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("sw-close-btn");
  var b2 = document.getElementById("sw-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  function stars() {
    for (var i = 0; i < 55; i++) {
      var el = document.createElement("div");
      el.className = "star";
      var s = Math.random() * 2.5 + 1;
      el.style.width = s + "px"; el.style.height = s + "px";
      el.style.left = Math.random() * 100 + "vw";
      el.style.top = Math.random() * 52 + "vh";
      el.style.animationDuration = (Math.random() * 2.5 + 1.2) + "s";
      el.style.animationDelay = (Math.random() * 2) + "s";
      fx.appendChild(el);
    }
  }
  function streak() {
    var el = document.createElement("div");
    el.className = "streak";
    el.style.top = Math.random() * 48 + "vh";
    el.style.width = (Math.random() * 120 + 80) + "px";
    var dur = Math.random() * 1.2 + 0.8;
    el.style.animationDuration = dur + "s";
    if (Math.random() > 0.5) {
      el.style.background = "linear-gradient(90deg, transparent, #ff2bd6, #00f0ff, transparent)";
    }
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }
  function burst(x, y) {
    for (var i = 0; i < 28; i++) {
      var s = document.createElement("div");
      s.className = "orb";
      var ang = (Math.PI * 2 * i) / 28;
      var dist = Math.random() * 120 + 40;
      var size = Math.random() * 5 + 3;
      s.style.width = size + "px"; s.style.height = size + "px";
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      if (i % 2 === 0) s.style.background = "radial-gradient(circle, #fff 0%, #00f0ff 40%, transparent 70%)";
      var dur = Math.random() * 0.6 + 0.5;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  stars();
  setInterval(function () { streak(); streak(); }, 280);
  function bang() { burst(Math.random()*W*0.8+W*0.1, Math.random()*H*0.4+H*0.1); }
  bang(); setTimeout(bang, 800); setInterval(bang, 2000);
  setInterval(function () { burst(W/2, H*0.32); }, 4200);
})();
</script>
