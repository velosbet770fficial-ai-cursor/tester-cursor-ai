<style>
  #uw-root {
    --bg: rgba(0, 12, 28, 0.97);
    --teal: #1affd5;
    --bio: #7bffb2;
    --deep: #003050;
    --sub: #8ec8d8;
    font-family: Arial, Helvetica, sans-serif;
  }
  #uw-root #popup-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
    background: rgba(0, 6, 18, .82); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    animation: uw-in .45s ease .9s forwards;
  }
  #uw-root #popup-overlay.is-closed {
    display: none !important; opacity: 0 !important;
    visibility: hidden !important; pointer-events: none !important;
    animation: none !important;
  }
  @keyframes uw-in { to { opacity: 1; visibility: visible; } }
  #uw-root .popup-backdrop {
    position: absolute; inset: 0; border: 0; margin: 0; padding: 0;
    background: transparent; cursor: pointer; z-index: 0;
  }
  #uw-root .popup-box {
    position: relative; z-index: 2; width: min(370px, 93vw);
    padding: 20px; border-radius: 18px; text-align: center;
    background: linear-gradient(165deg, #024056 0%, #011018 55%, #052a40 100%);
    border: 1.5px solid rgba(26, 255, 213, .7);
    box-shadow:
      0 0 0 1px rgba(26,255,213,.15) inset,
      0 0 45px rgba(0,180,160,.4),
      0 0 90px rgba(0,80,140,.35),
      0 25px 70px rgba(0,0,0,.75);
    overflow: visible;
    animation: uw-pop .7s cubic-bezier(.22,1.2,.36,1) .9s backwards, uw-glow 2.4s ease-in-out 1.6s infinite;
  }
  #uw-root .popup-box::before {
    content: ""; position: absolute; inset: -3px; border-radius: 21px; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(26,255,213,.5), transparent 40%, rgba(123,255,178,.35));
    opacity: .45; filter: blur(10px);
    animation: uw-rim 3s ease-in-out infinite alternate;
  }
  #uw-root .popup-box::after {
    content: ""; position: absolute; inset: 1px; border-radius: 17px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(26,255,213,.18), transparent 48%),
      radial-gradient(ellipse at 80% 100%, rgba(0,100,160,.2), transparent 40%),
      var(--bg);
  }
  @keyframes uw-rim {
    from { opacity: .3; }
    to { opacity: .6; }
  }
  @keyframes uw-pop {
    0% { transform: translateY(50px) scale(.85); opacity: 0; filter: blur(6px); }
    100% { transform: none; opacity: 1; filter: none; }
  }
  @keyframes uw-glow {
    0%,100% { box-shadow: 0 0 40px rgba(0,180,160,.35), 0 0 80px rgba(0,80,140,.3), 0 25px 70px rgba(0,0,0,.75); }
    50% { box-shadow: 0 0 70px rgba(26,255,213,.65), 0 0 120px rgba(0,120,180,.5), 0 25px 70px rgba(0,0,0,.75); }
  }
  #uw-root .popup-box > * { position: relative; z-index: 1; }
  #uw-root .caustic {
    position: absolute; inset: 0; border-radius: 18px; pointer-events: none; z-index: 3; opacity: .4;
    background:
      radial-gradient(ellipse at 25% 8%, rgba(26,255,213,.4), transparent 38%),
      radial-gradient(ellipse at 75% 18%, rgba(255,255,255,.22), transparent 32%),
      radial-gradient(ellipse at 50% 90%, rgba(123,255,178,.2), transparent 40%);
    animation: uw-caustic 2.8s ease-in-out infinite alternate;
  }
  @keyframes uw-caustic {
    from { opacity: .28; transform: scale(1) translateY(0); }
    to { opacity: .55; transform: scale(1.06) translateY(-4px); }
  }
  #uw-root .popup-close {
    position: absolute; top: -16px; right: -16px; width: 48px; height: 48px;
    border-radius: 50%; border: 2px solid #d8fff6;
    background: linear-gradient(145deg, #1affd5, #067a8a);
    color: #011018; font-size: 24px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(26,255,213,.8); z-index: 30; padding: 0;
    transition: transform .2s;
  }
  #uw-root .popup-close:hover { transform: scale(1.12) rotate(90deg); }
  #uw-root .popup-img-wrap {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1/1;
    border: 1px solid rgba(26,255,213,.5);
    box-shadow: 0 0 28px rgba(0,160,140,.35);
  }
  #uw-root .popup-img-wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(26,255,213,.12), transparent 28%, rgba(0,10,30,.6));
  }
  #uw-root .popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #uw-root .popup-badge {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: bold; letter-spacing: .12em; text-transform: uppercase;
    color: #011018; background: linear-gradient(90deg, #d8fff6, #1affd5, #7bffb2);
    padding: 6px 10px; border-radius: 8px; box-shadow: 0 0 16px rgba(26,255,213,.6);
  }
  #uw-root .popup-title {
    margin: 16px 0 6px; font-size: 27px; font-weight: bold; letter-spacing: 1px;
    color: var(--teal);
    text-shadow: 0 0 18px rgba(26,255,213,.8), 0 0 36px rgba(0,140,160,.5);
    animation: uw-title 2s ease-in-out infinite;
  }
  @keyframes uw-title {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }
  #uw-root .popup-sub { margin: 0 0 16px; font-size: 13px; color: var(--sub); }
  #uw-root .popup-buttons { display: flex; gap: 10px; }
  #uw-root .popup-btn {
    flex: 1; padding: 13px 0; border-radius: 12px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; text-decoration: none; text-align: center; transition: transform .15s;
  }
  #uw-root .popup-btn:hover { transform: translateY(-3px); }
  #uw-root .btn-login {
    background: #011018; color: var(--teal); border: 1.5px solid var(--teal);
    box-shadow: 0 0 14px rgba(26,255,213,.3);
  }
  #uw-root .btn-daftar {
    background: linear-gradient(145deg, #d8fff6, #1affd5); color: #011018; border: none;
    box-shadow: 0 0 22px rgba(26,255,213,.55); animation: uw-cta 1.5s ease-in-out infinite;
  }
  @keyframes uw-cta {
    0%,100% { box-shadow: 0 0 14px rgba(26,255,213,.4); }
    50% { box-shadow: 0 0 34px rgba(26,255,213,.95), 0 0 20px #7bffb2; }
  }

  #uw-root #fx {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 999998 !important; pointer-events: none !important;
    overflow: hidden !important;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(30,120,160,.35), transparent 45%),
      linear-gradient(180deg, #031828 0%, #012038 35%, #000c18 70%, #00060e 100%);
  }
  #uw-root .ray {
    position: absolute; top: -8%; width: 7vw; height: 70%;
    background: linear-gradient(180deg, rgba(26,255,213,.2), rgba(0,100,160,.08), transparent 85%);
    transform-origin: top center;
    animation: uw-ray 7s ease-in-out infinite;
    filter: blur(10px);
  }
  @keyframes uw-ray {
    0%,100% { opacity: .3; transform: rotate(-10deg) skewX(-8deg); }
    50% { opacity: .75; transform: rotate(10deg) skewX(8deg); }
  }
  #uw-root .bubble {
    position: absolute; bottom: -6vh; border-radius: 50%;
    border: 1px solid rgba(216,255,246,.5);
    background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.6), rgba(26,255,213,.18) 42%, transparent 70%);
    box-shadow: 0 0 12px rgba(26,255,213,.4);
    animation: uw-bubble linear forwards;
  }
  @keyframes uw-bubble {
    0% { transform: translate3d(0,0,0) scale(1); opacity: 0; }
    8% { opacity: .95; }
    100% { transform: translate3d(var(--drift), -118vh, 0) scale(.55); opacity: 0; }
  }
  #uw-root .plankton {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #7bffb2; box-shadow: 0 0 8px 2px rgba(123,255,178,.9);
    animation: uw-plank linear forwards;
  }
  @keyframes uw-plank {
    0% { transform: translate(0,0) scale(1); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
  }
  #uw-root .jelly {
    position: absolute; width: 28px; height: 34px;
    animation: uw-jelly linear forwards;
    filter: drop-shadow(0 0 10px rgba(26,255,213,.7));
  }
  #uw-root .jelly::before {
    content: ""; position: absolute; left: 2px; top: 0; width: 24px; height: 16px;
    border-radius: 50% 50% 40% 40%;
    background: radial-gradient(ellipse at 50% 30%, rgba(216,255,246,.85), rgba(26,255,213,.35) 60%, transparent);
    border: 1px solid rgba(26,255,213,.45);
  }
  #uw-root .jelly::after {
    content: ""; position: absolute; left: 6px; top: 14px; width: 16px; height: 18px;
    background:
      linear-gradient(180deg, rgba(26,255,213,.5), transparent),
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(123,255,178,.45) 3px, rgba(123,255,178,.45) 4px);
    opacity: .7;
  }
  @keyframes uw-jelly {
    0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    10% { opacity: .85; }
    50% { transform: translateY(-50vh) translateX(var(--sway)) scale(1.05); }
    100% { transform: translateY(-110vh) translateX(calc(var(--sway) * -1)) scale(.9); opacity: 0; }
  }
  #uw-root .kelp {
    position: absolute; bottom: 0; width: 8px;
    background: linear-gradient(180deg, transparent, rgba(0,120,90,.55) 20%, rgba(0,80,60,.7));
    border-radius: 8px; transform-origin: bottom center;
    animation: uw-kelp ease-in-out infinite;
    filter: blur(.5px);
  }
  @keyframes uw-kelp {
    0%,100% { transform: rotate(-8deg) skewX(-4deg); }
    50% { transform: rotate(10deg) skewX(6deg); }
  }
  #uw-root .fish {
    position: absolute;
    width: 0; height: 0;
    border-style: solid;
    filter: drop-shadow(0 0 6px rgba(26,255,213,.6));
    animation: uw-fish linear forwards;
  }
  @keyframes uw-fish {
    0% { transform: translateX(0) scaleX(var(--flip)); opacity: 0; }
    8% { opacity: .75; }
    100% { transform: translateX(var(--swim)) scaleX(var(--flip)); opacity: 0; }
  }
  #uw-root .burst {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #1affd5; box-shadow: 0 0 12px 3px rgba(26,255,213,.9);
    animation: uw-burst linear forwards;
  }
  @keyframes uw-burst {
    0% { transform: translate(0,0) scale(1.2); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #uw-root .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 18vh;
    background:
      radial-gradient(ellipse at 30% 100%, rgba(0,60,80,.5), transparent 55%),
      radial-gradient(ellipse at 70% 100%, rgba(0,40,60,.45), transparent 50%),
      linear-gradient(180deg, transparent, rgba(0,20,30,.75));
    animation: uw-floor 3s ease-in-out infinite;
  }
  @keyframes uw-floor {
    0%,100% { opacity: .7; }
    50% { opacity: 1; }
  }
</style>

<script>
(function () {
  var root = document.getElementById("uw-root");
  if (!root) return;
  var overlay = document.getElementById("popup-overlay");
  var fx = document.getElementById("fx");
  var W = window.innerWidth || 1200, H = window.innerHeight || 800;
  window.addEventListener("resize", function () {
    W = window.innerWidth || 1200; H = window.innerHeight || 800;
  });
  function closePopup(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!overlay) return;
    overlay.classList.add("is-closed");
    overlay.style.cssText = "display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;";
  }
  var b1 = document.getElementById("uw-close-btn");
  var b2 = document.getElementById("uw-close-bg");
  if (b1) { b1.onclick = closePopup; b1.addEventListener("touchend", closePopup, { passive: false }); }
  if (b2) { b2.onclick = closePopup; b2.addEventListener("touchend", closePopup, { passive: false }); }

  for (var k = 0; k < 14; k++) {
    var kelp = document.createElement("div");
    kelp.className = "kelp";
    kelp.style.left = (k * 7.5 + Math.random() * 4) + "vw";
    kelp.style.height = (Math.random() * 18 + 12) + "vh";
    kelp.style.animationDuration = (Math.random() * 2.5 + 2.5) + "s";
    kelp.style.animationDelay = Math.random() * 2 + "s";
    kelp.style.opacity = 0.35 + Math.random() * 0.4;
    fx.appendChild(kelp);
  }

  function bubble() {
    var el = document.createElement("div");
    el.className = "bubble";
    var s = Math.random() * 22 + 5;
    el.style.width = s + "px"; el.style.height = s + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.setProperty("--drift", (Math.random() * 100 - 50) + "px");
    var dur = Math.random() * 3.5 + 2.2;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000 + 40);
  }

  function plankton() {
    var el = document.createElement("div");
    el.className = "plankton";
    el.style.left = Math.random() * W + "px";
    el.style.top = Math.random() * H + "px";
    el.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    el.style.setProperty("--dy", (Math.random() * -120 - 40) + "px");
    el.style.background = Math.random() > 0.5 ? "#1affd5" : "#7bffb2";
    var dur = Math.random() * 2 + 1.5;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function jelly() {
    var el = document.createElement("div");
    el.className = "jelly";
    el.style.left = Math.random() * 90 + 5 + "vw";
    el.style.bottom = "-8vh";
    el.style.setProperty("--sway", (Math.random() * 60 - 30) + "px");
    var scale = 0.7 + Math.random() * 0.8;
    el.style.transform = "scale(" + scale + ")";
    var dur = Math.random() * 5 + 7;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function fish() {
    var el = document.createElement("div");
    el.className = "fish";
    var fromLeft = Math.random() > 0.5;
    var size = Math.random() * 8 + 8;
    el.style.borderWidth = (size / 2) + "px " + size + "px " + (size / 2) + "px 0";
    el.style.borderColor = "transparent " + (Math.random() > 0.5 ? "rgba(26,255,213,.55)" : "rgba(123,255,178,.5)") + " transparent transparent";
    el.style.top = Math.random() * 65 + 10 + "vh";
    el.style.left = fromLeft ? "-5vw" : "105vw";
    el.style.setProperty("--flip", fromLeft ? "1" : "-1");
    el.style.setProperty("--swim", fromLeft ? "110vw" : "-110vw");
    var dur = Math.random() * 4 + 5;
    el.style.animationDuration = dur + "s";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, dur * 1000);
  }

  function burst(x, y) {
    for (var i = 0; i < 28; i++) {
      var s = document.createElement("div");
      s.className = "burst";
      var ang = (Math.PI * 2 * i) / 28;
      var dist = Math.random() * 110 + 25;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.background = i % 2 ? "#1affd5" : "#7bffb2";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      var dur = Math.random() * 0.7 + 0.5;
      s.style.animationDuration = dur + "s";
      fx.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), dur * 1000);
    }
  }

  setInterval(function () { bubble(); bubble(); bubble(); bubble(); }, 100);
  setInterval(function () { plankton(); plankton(); plankton(); }, 80);
  setInterval(jelly, 1800);
  setInterval(fish, 2000);
  function bang() { burst(Math.random() * W * 0.8 + W * 0.1, Math.random() * H * 0.5 + H * 0.2); }
  bang(); setTimeout(bang, 800); setInterval(bang, 2000);
  jelly(); jelly();
})();
</script>
